<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>土木設備分布地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
      :root {
        --bg: #eef2f5;
        --panel: #ffffff;
        --text: #17202a;
        --muted: #687584;
        --line: #d9e1e8;
        --accent: #087f8c;
        --accent-dark: #075d67;
        --amber: #d88922;
        --red: #bf4e30;
        --blue: #2563eb;
        --shadow: 0 12px 36px rgba(22, 36, 52, 0.16);
        --control-z: 900;
      }
      * { box-sizing: border-box; }
      html, body, .app { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, sans-serif;
      }
      .app {
        display: grid;
        grid-template-columns: minmax(320px, 420px) 1fr;
        min-width: 0;
        transition: grid-template-columns 180ms ease;
      }
      .app.is-panel-collapsed { grid-template-columns: 0 1fr; }
      .panel {
        background: var(--panel);
        border-right: 1px solid var(--line);
        box-shadow: var(--shadow);
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        min-height: 0;
        overflow: hidden;
        position: relative;
        z-index: 600;
      }
      .panel.is-collapsed {
        background: transparent;
        border-right: 0;
        box-shadow: none;
        pointer-events: none;
      }
      .panel.is-collapsed > * { display: none; }
      .panel-head {
        align-items: start;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 64px 18px 12px;
      }
      .panel-title { width: 100%; }
      h1, h2 { margin: 0; }
      h1 { font-size: 24px; line-height: 1.2; }
      h2 { font-size: 14px; }
      .icon-button, button, select, input {
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
        min-height: 38px;
      }
      button {
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 800;
        padding: 0 12px;
      }
      button:hover { background: var(--accent-dark); }
      button:disabled { cursor: progress; opacity: 0.7; }
      .icon-button {
        align-items: center;
        background: #f7fafc;
        color: var(--text);
        display: inline-flex;
        font-size: 20px;
        height: 38px;
        justify-content: center;
        padding: 0;
        width: 38px;
      }
      .btn-global-toggle {
        width: 100%;
        min-height: 36px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        font-weight: 800;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-global-toggle:hover { background: var(--accent-dark); }
      .btn-global-toggle.is-hidden { background: #64748b; }
      .tab-nav { display: flex; border-bottom: 1px solid var(--line); background: #f8fafc; }
      .tab-btn {
        flex: 1;
        background: transparent;
        color: var(--muted);
        border: none;
        border-bottom: 3px solid transparent;
        border-radius: 0;
        min-height: 44px;
        font-size: 14px;
      }
      .tab-btn:hover { background: #f1f5f9; color: var(--text); }
      .tab-btn.is-active { background: #fff; color: var(--accent-dark); border-bottom-color: var(--accent); }
      .tab-content { display: none; flex-direction: column; min-height: 0; overflow: hidden; }
      .tab-content.is-active { display: flex; }
      .stats {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, 1fr);
        padding: 14px 18px;
      }
      .stats div {
        background: #f7fafc;
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 3px;
        min-width: 0;
        padding: 9px;
      }
      .stats span, label span, .result-item span { color: var(--muted); font-size: 12px; }
      .stats strong { font-size: 18px; line-height: 1.2; }
      .tools { border-top: 1px solid var(--line); display: grid; gap: 12px; padding: 14px 18px; }
      label { display: grid; gap: 5px; }
      select, input[type="search"], input[type="text"] { background: #fff; color: var(--text); padding: 0 10px; width: 100%; }
      .button-row { display: grid; gap: 8px; grid-template-columns: 1fr; }
      .results-wrap {
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        min-height: 0;
        padding: 12px 18px 18px;
      }
      .results { margin-top: 8px; min-height: 0; overflow-y: auto; flex-grow: 1; padding-right: 4px; }
      .result-item {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--text);
        display: grid;
        gap: 4px;
        margin-bottom: 8px;
        min-height: auto;
        padding: 10px;
        text-align: left;
        width: 100%;
      }
      .result-item:hover { background: #eef8f9; color: var(--text); }
      .folders-section {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        min-height: 0;
        padding: 14px 18px 18px;
        overflow-y: auto;
      }
      .folder-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
      .folder-btn-group { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
      .btn-action { flex: 1; min-height: 32px; font-size: 13px; border-radius: 4px; background: #fff; }
      .btn-add-folder { color: var(--accent); border: 1px dashed var(--accent); }
      .btn-import-csv { background: #f0fdf4; color: #16a34a; border: 1px dashed #16a34a; }
      .btn-export-json { background: #fffbeb; color: #d97706; border: 1px dashed #d97706; }
      .btn-import-json { background: #fef2f2; color: #dc2626; border: 1px dashed #dc2626; }
      .folder-list {
        flex-grow: 1;
        min-height: 0;
        padding-right: 4px;
        margin-top: 8px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
        padding-bottom: 40px;
      }
      .folder-item {
        background: #f8fafc;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        transition: background 0.2s;
      }
      .folder-item:hover { background: #f1f5f9; }
      .folder-item-top { display: flex; flex-direction: column; gap: 6px; }
      .folder-item-title-row { display: flex; align-items: center; width: 100%; }
      .folder-name-toggle {
        cursor: pointer;
        user-select: none;
        font-weight: bold;
        font-size: 14px;
        color: var(--text);
        flex-grow: 1;
        padding: 2px 0;
        display: flex;
        align-items: center;
        gap: 4px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .folder-name-toggle:hover { color: var(--accent); }
      .record-list { margin-top: 6px; border-top: 1px dashed var(--line); padding-top: 6px; display: none; flex-direction: column; gap: 4px; }
      .record-list.is-expanded { display: flex; }
      .record-item {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 6px;
        text-align: left;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex-grow: 1;
        min-width: 0;
      }
      .record-item:hover { background: #eef8f9; border-color: var(--accent); }
      .record-item-title { font-weight: bold; color: var(--accent-dark); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      .record-item-meta { font-size: 11px; color: var(--muted); }
      .folder-actions { display: flex; flex-wrap: wrap; gap: 4px; }
      .btn-small {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 4px 8px;
        font-size: 12px;
        min-height: 26px;
        border-radius: 4px;
        font-weight: normal;
        cursor: pointer;
      }
      .btn-small:hover { background: #e2e8f0; color: var(--text); }
      .text-danger { color: var(--red) !important; font-weight: bold; }
      .text-danger:hover { background: #fee2e2; }
      .batch-action-bar {
        display: none;
        justify-content: space-between;
        align-items: center;
        background: #fef2f2;
        border: 1px solid #fca5a5;
        padding: 8px 12px;
        border-radius: 6px;
        margin-bottom: 8px;
      }
      .text-button {
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
        cursor: pointer;
        font: inherit;
        color: var(--muted);
        min-height: unset;
      }
      .text-button:hover { text-decoration: underline; color: var(--accent); background: transparent; }
      .map-shell { min-width: 0; position: relative; }
      .map-locate-button {
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        color: var(--accent-dark);
        min-height: 40px;
        padding: 0 14px;
        position: absolute;
        right: 14px;
        top: 14px;
        z-index: var(--control-z);
      }
      .map-locate-button:hover { background: #eef8f9; }
      .map-locate-button.is-active { background: var(--blue); border-color: var(--blue); color: #fff; }
      #map { background: #edf3f5; height: 100%; width: 100%; }
      .status {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--line);
        border-radius: 8px;
        bottom: 18px;
        box-shadow: var(--shadow);
        left: 50%;
        max-width: min(90vw, 620px);
        padding: 9px 12px;
        position: absolute;
        transform: translateX(-50%);
        z-index: 500;
      }
      .status:empty { display: none; }
      .popup-title { font-weight: 900; margin-bottom: 4px; }
      .popup-meta { color: var(--muted); font-size: 12px; line-height: 1.5; }
      .popup-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; margin-bottom: 6px; }
      .popup-actions a {
        background: var(--accent);
        border-radius: 6px;
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 800;
        min-height: 30px;
        padding: 6px 10px;
        text-decoration: none;
      }
      .point-label { cursor: pointer; font-size: 12px; font-weight: 800; line-height: 1.15; white-space: nowrap; }
      .point-label-chip {
        background: color-mix(in srgb, var(--label-color) 14%, #ffffff);
        border: 1px solid color-mix(in srgb, var(--label-color) 58%, #ffffff);
        border-left: 5px solid var(--label-color);
        border-radius: 5px;
        box-shadow: 0 2px 8px rgba(21, 38, 54, 0.18);
        color: #12272b;
        display: inline-flex;
        padding: 3px 6px 3px 5px;
      }
      .popup-form { margin-top: 6px; padding-top: 8px; border-top: 1px dashed #ccc; display: flex; flex-direction: column; gap: 6px; }
      .popup-form label { font-size: 12px; font-weight: bold; color: var(--text); }
      .popup-form select, .popup-form input { min-height: 28px; padding: 2px 6px; font-size: 12px; margin-top: 2px; }
      .btn-save-record {
        background: var(--amber);
        color: #fff;
        border: none;
        width: 100%;
        margin-top: 5px;
        font-size: 13px;
        min-height: 32px;
      }
      .btn-save-record:hover { background: #c27a1e; }
      .saved-star-marker { display: flex; justify-content: center; align-items: center; font-size: 16px; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.4)); cursor: pointer; }
      .popup-layout { display: flex; flex-direction: column; }
      .popup-left { margin-bottom: 2px; }
      .popup-right { max-height: 55vh; overflow-y: auto; padding-right: 2px; }
      .leaflet-popup-content { min-width: 225px !important; max-width: 70vw !important; width: auto !important; }
      @media (min-width: 550px) { .leaflet-popup-content { min-width: 340px !important; } }
      @media (max-width: 950px) and (max-height: 500px) and (orientation: landscape) {
        .leaflet-popup-content { width: 420px !important; min-width: 420px !important; }
        .popup-layout { flex-direction: row; gap: 12px; align-items: stretch; }
        .popup-left { flex: 1; min-width: 160px; border-right: 1px dashed #ccc; padding-right: 10px; margin-bottom: 0; }
        .popup-right { flex: 1.3; max-height: 75vh; }
        .popup-form { border-top: none; margin-top: 0; padding-top: 0; }
      }
      .custom-modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.6);
        z-index: 10000;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(2px);
      }
      .custom-modal-box {
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      }
      .top-controls {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top, 0px));
        left: calc(10px + env(safe-area-inset-left, 0px));
        z-index: calc(var(--control-z) + 30);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .map-search-btn {
        background: rgba(255,255,255,0.96);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 8px 20px rgba(22,36,52,0.18);
        color: var(--accent-dark);
        min-height: 38px;
        padding: 0 12px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
      .map-search-btn:hover { background: #eef8f9; color: var(--accent); }
      .map-search-panel {
        position: fixed;
        left: calc(10px + env(safe-area-inset-left, 0px));
        top: calc(60px + env(safe-area-inset-top, 0px));
        z-index: calc(var(--control-z) + 20);
        width: min(360px, calc(100vw - 20px));
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        display: none;
        flex-direction: column;
        max-height: calc(100vh - 80px);
        overflow: hidden;
      }
      .map-search-panel.is-open { display: flex; }
      .map-search-inner { display: flex; flex-direction: column; gap: 8px; padding: 12px; border-bottom: 1px solid var(--line); }
      .map-search-inner select, .map-search-inner input { min-height: 34px; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 0 10px; width: 100%; background: #fff; }
      .map-search-stats { display: flex; gap: 8px; font-size: 11px; color: var(--muted); padding: 6px 12px; }
      .map-search-results { overflow-y: auto; flex: 1; min-height: 0; padding: 0 10px 10px; }
      .map-search-results .result-item { margin-bottom: 6px; }

      /* ── 分享選項彈窗（手機專用）── */
      .share-action-sheet {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        z-index: 20000;
        background: rgba(0,0,0,0.5);
        display: none;
        align-items: flex-end;
        backdrop-filter: blur(2px);
      }
      .share-action-sheet.is-open { display: flex; }
      .share-action-sheet-inner {
        background: #fff;
        border-radius: 16px 16px 0 0;
        padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
        width: 100%;
        box-shadow: 0 -4px 24px rgba(0,0,0,0.15);
      }
      .share-sheet-title {
        font-size: 13px;
        color: var(--muted);
        text-align: center;
        margin-bottom: 12px;
        font-weight: bold;
      }
      .share-sheet-filename {
        font-size: 12px;
        color: var(--accent-dark);
        text-align: center;
        margin-bottom: 16px;
        background: #f0fdf4;
        padding: 6px 12px;
        border-radius: 8px;
        word-break: break-all;
      }
      .share-sheet-btns { display: flex; flex-direction: column; gap: 10px; }
      .share-sheet-btn {
        width: 100%;
        min-height: 52px;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 800;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .share-sheet-btn.btn-share { background: var(--accent); color: #fff; }
      .share-sheet-btn.btn-share:hover { background: var(--accent-dark); }
      .share-sheet-btn.btn-local { background: #f1f5f9; color: var(--text); }
      .share-sheet-btn.btn-local:hover { background: #e2e8f0; }
      .share-sheet-btn.btn-cancel { background: transparent; color: var(--muted); font-weight: normal; font-size: 14px; min-height: 36px; }
    </style>
  </head>

  <body>
    <!-- 共用 Modal -->
    <div id="globalModal" class="custom-modal-overlay">
      <div class="custom-modal-box">
        <h3 id="gmTitle" style="margin-top:0; font-size:18px; font-weight:900; color:var(--text);"></h3>
        <p id="gmContent" style="margin:10px 0 15px; font-size:14px; color:var(--muted); line-height:1.5;"></p>
        <div id="gmInputWrapper" style="display:none; flex-direction:column; gap:8px; margin-bottom:15px;">
          <input type="text" id="gmInput" style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box;" />
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:12px; color:var(--muted); font-weight:bold;">📅 插入日期：</span>
            <input type="date" id="gmDateInput" style="padding:4px 8px; border:1px solid #ccc; border-radius:4px; font-size:13px; cursor:pointer; color:var(--text); flex-grow:1;" />
          </div>
        </div>
        <select id="gmSelect" style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px; display:none;"></select>
        <div style="display:flex; justify-content:flex-end; gap:10px">
          <button id="gmCancelBtn" style="padding:8px 16px; background:#e2e8f0; color:#333; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">取消</button>
          <button id="gmConfirmBtn" style="padding:8px 16px; background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">確定</button>
        </div>
      </div>
    </div>

    <!-- ── 手機分享 Action Sheet ── -->
    <div id="shareActionSheet" class="share-action-sheet">
      <div class="share-action-sheet-inner">
        <div class="share-sheet-title">📤 選擇匯出方式</div>
        <div id="shareSheetFilename" class="share-sheet-filename"></div>
        <div class="share-sheet-btns">
          <button id="shareSheetShareBtn" class="share-sheet-btn btn-share">☁️ 傳送至其他 App（LINE / 雲端）</button>
          <button id="shareSheetLocalBtn" class="share-sheet-btn btn-local">💾 儲存到本機裝置</button>
          <button id="shareSheetCancelBtn" class="share-sheet-btn btn-cancel">取消</button>
        </div>
      </div>
    </div>

    <!-- 左上控制列 -->
    <div class="top-controls">
      <button id="panelToggle" class="icon-button" type="button" aria-expanded="false" title="展開面板" style="box-shadow:0 8px 20px rgba(22,36,52,0.18)">≡</button>
      <button id="mapSearchToggle" class="map-search-btn" title="搜尋設備">🔍 搜尋</button>
    </div>

    <!-- 地圖浮動搜尋面板 -->
    <div id="mapSearchPanel" class="map-search-panel">
      <div class="map-search-inner">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <span style="font-weight:800; font-size:14px; color:var(--accent-dark)">🔍 搜尋設備</span>
          <button id="mapSearchClose" style="background:transparent; color:var(--muted); border:none; min-height:unset; padding:4px 8px; font-size:16px; cursor:pointer;">✕</button>
        </div>
        <select id="areaSelect"><option value="">全部區域</option></select>
        <input id="searchInput" type="search" placeholder="例如 Q1295.Q1395.尖峰" autocomplete="off" />
        <p style="font-size:11px; color:var(--muted); margin:0">💡 右鍵地圖可反推圖號座標並手動新增設備</p>
      </div>
      <div class="map-search-stats">
        <span>總點位 <strong id="totalCount">--</strong></span>
        <span>視窗內 <strong id="visibleCount">--</strong></span>
        <span>標籤數 <strong id="drawCount">--</strong></span>
      </div>
      <div id="results" class="map-search-results"></div>
    </div>

    <!-- 主布局 -->
    <main class="app is-panel-collapsed">
      <aside id="panel" class="panel is-collapsed">
        <header class="panel-head">
          <div class="panel-title"><h1>土木設備分布地圖</h1></div>
          <button id="toggleLabelsBtn" class="btn-global-toggle">隱藏所有主圖標籤</button>
        </header>
        <nav class="tab-nav" style="display:none"></nav>
        <div id="tabSearch" class="tab-content" style="display:none"></div>
        <div id="tabRecords" class="tab-content is-active">
          <section class="folders-section" aria-label="巡視紀錄">
            <div class="folder-header">
              <div style="display:flex; gap:8px; width:100%; justify-content:space-between;">
                <span style="font-weight:bold; font-size:14px">全部地圖標記：</span>
                <div>
                  <button id="showAllStarsBtn" class="text-button" style="font-size:12px; margin-right:8px">全部顯示⭐</button>
                  <button id="hideAllStarsBtn" class="text-button" style="font-size:12px">全部隱藏🙈</button>
                </div>
              </div>
            </div>
            <div class="folder-btn-group">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // ==========================================

          this.inputEl.value = defaultVal;
          if (this.dateInputEl) this.dateInputEl.value = "";
          this.selectEl.style.display = type === "select" ? "block" : "none";
          this.selectEl.innerHTML = selectHtml;
          this.cancelBtn.style.display = type === "alert" ? "none" : "block";
          this.cancelBtn.onclick = () => { this.overlay.style.display = "none"; };
          this.confirmBtn.onclick = () => {
            this.overlay.style.display = "none";
            if (onConfirm) {
              if (type === "prompt") onConfirm(this.inputEl.value);
              else if (type === "select") onConfirm(this.selectEl.value);
              else onConfirm(true);
            }
          };
          this.overlay.style.display = "flex";
          if (type === "prompt") setTimeout(() => this.inputEl.focus(), 100);
        },
        alert(msg) { this.show({ title: "提示", content: msg, type: "alert" }); },
        confirm(msg, onConfirm) { this.show({ title: "請確認", content: msg, type: "confirm", onConfirm }); },
        prompt(msg, defaultVal, onConfirm) { this.show({ title: "輸入", content: msg, type: "prompt", defaultVal, onConfirm }); },
        select(title, msg, selectHtml, onConfirm) { this.show({ title, content: msg, type: "select", selectHtml, onConfirm }); },

      // ==========================================
      // 日期選擇器自動帶入
      // ==========================================
      if (GlobalModal.dateInputEl) {
        GlobalModal.dateInputEl.addEventListener("change", (e) => {
          if (e.target.value) {
            const selectedDate = e.target.value;

      // ==========================================
      // 智慧匯出 Action Sheet（手機分享 / 桌機下載）
      // ==========================================
      const shareSheet = {
        el: document.getElementById("shareActionSheet"),
        filenameEl: document.getElementById("shareSheetFilename"),
        shareBtn: document.getElementById("shareSheetShareBtn"),
        localBtn: document.getElementById("shareSheetLocalBtn"),
        cancelBtn: document.getElementById("shareSheetCancelBtn"),
        _pendingFile: null,
        _pendingDownload: null,

        open(file, downloadFn) {
          this._pendingFile = file;
          this._pendingDownload = downloadFn;
          this.filenameEl.textContent = file.name;
          this.el.classList.add("is-open");
        },
        close() {
          this.el.classList.remove("is-open");
          this._pendingFile = null;
          this._pendingDownload = null;
        },
      };

      // 分享按鈕：在使用者點擊的瞬間呼叫 navigator.share（確保手勢有效）
      shareSheet.shareBtn.addEventListener("click", async () => {
        const file = shareSheet._pendingFile;
        const downloadFn = shareSheet._pendingDownload;
        shareSheet.close();
        if (!file) return;
        try {
          await navigator.share({ title: file.name, files: [file] });
        } catch (err) {
          // AbortError = 使用者自行取消，不需 fallback
          if (err.name !== "AbortError") {
            downloadFn && downloadFn();
          }
        }
      });

      shareSheet.localBtn.addEventListener("click", () => {
        const downloadFn = shareSheet._pendingDownload;
        shareSheet.close();
        downloadFn && downloadFn();
      });

      shareSheet.cancelBtn.addEventListener("click", () => shareSheet.close());

      // 點擊背景關閉
      shareSheet.el.addEventListener("click", (e) => {
        if (e.target === shareSheet.el) shareSheet.close();
      });

      /**
       * exportOrShareFile
       * - 桌機：直接下載
       * - 手機（支援 Web Share API 檔案分享）：顯示 Action Sheet 讓使用者選擇
       */
      function exportOrShareFile(fileData, fileName, mimeType) {
        const file = new File([fileData], fileName, { type: mimeType });

        function downloadLocally() {
          const blob = new Blob([fileData], { type: mimeType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }

        const canShare = !!(
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({ files: [file] })
        );

        if (canShare) {
          // 顯示 Action Sheet，讓使用者在 Sheet 的按鈕點擊事件中呼叫 share
          shareSheet.open(file, downloadLocally);
        } else {
          downloadLocally();
        }
      }

      // ==========================================
      // 分頁相容
      // ==========================================
      const tabRecords = document.getElementById("tabRecords");
      function switchTab(tabId) {

      document.getElementById("mapSearchToggle").addEventListener("click", () => {

      document.getElementById("mapSearchClose").addEventListener("click", () => {
        document.getElementById("mapSearchPanel").classList.remove("is-open");
      });

      // ==========================================
      // 座標轉換
      // ==========================================
      const PI = Math.PI;
      function wgs84ToTwd67Tm2(latDeg, lngDeg) {

        const a84 = 6378137.0, b84 = 6356752.314245, a67 = 6378160.0, b67 = 6356774.7192;

        const x84 = n84 * Math.cos(lat) * Math.cos(lng), y84 = n84 * Math.cos(lat) * Math.sin(lng), z84 = n84 * (1 - e2_84) * Math.sin(lat);
        const dx = -752.0, dy = -358.0, dz = -179.0, rx = -0.0000011698, ry = 0.0000018398, rz = 0.0000009822, s = 0.00002329;

        const e2_67 = 1 - b67 ** 2 / a67 ** 2, ep2_67 = (a67 ** 2 - b67 ** 2) / b67 ** 2;
        const p = Math.sqrt(x67 ** 2 + y67 ** 2), theta = Math.atan2(z67 * a67, p * b67);
        const lat67 = Math.atan2(z67 + ep2_67 * b67 * Math.sin(theta) ** 3, p - e2_67 * a67 * Math.cos(theta) ** 3), lng67 = Math.atan2(y67, x67);

        const A = a67 * (1.0 - e2_67 / 4.0 - (3.0 * e2_67 ** 2) / 64.0 - (5.0 * e2_67 ** 3) / 256.0), B = a67 * ((3.0 * e2_67) / 8.0 + (3.0 * e2_67 ** 2) / 32.0 + (45.0 * e2_67 ** 3) / 1024.0);

        const tm2_y = k0 * (M + nu * tanLat * ((p_lon ** 2 / 2.0) * cosLat ** 2 + (p_lon ** 4 / 24.0) * cosLat ** 4 * (5.0 - t + 9.0 * c + 4.0 * c ** 2) + (p_lon ** 6 / 720.0) * cosLat ** 6 * (61.0 - 58.0 * t + t ** 2 + 600.0 * c - 330.0 * e_prime2)));

      const GRID_BASES = {
        A:[170000,2750000], B:[250000,2750000], C:[330000,2750000], D:[170000,2700000], E:[250000,2700000], F:[330000,2700000],
        G:[170000,2650000], H:[250000,2650000], J:[90000,2600000], K:[170000,2600000], L:[250000,2600000], M:[90000,2550000],
        N:[170000,2550000], O:[250000,2550000], P:[90000,2500000], Q:[170000,2500000], R:[250000,2500000], T:[170000,2450000],
        U:[250000,2450000], V:[170000,2400000], W:[250000,2400000], X:[275000,2614000], Y:[275000,2564000],
      };
      function tm2ToTpc(x, y) {
        let bestBase = "", bx = 0, by = 0;
        for (const [char, [cx, cy]] of Object.entries(GRID_BASES)) {
          const dx = x - cx, dy = y - cy;
          if (dx >= 0 && dx < 80000 && dy >= 0 && dy < 50000) { bestBase = char; bx = cx; by = cy; break; }
        }
        if (!bestBase) return "座標超出範圍";
        const dx = x - bx, dy = y - by;
        const t2x = String(Math.floor(dx / 800)).padStart(2, "0"), t2y = String(Math.floor(dy / 500)).padStart(2, "0");
        const remX = dx % 800, remY = dy % 500;
        const t3x = String.fromCharCode(65 + Math.floor(remX / 100)), t3y = String.fromCharCode(65 + Math.floor(remY / 100));
        const rremX = remX % 100, rremY = remY % 100;
        const t5x = String(Math.floor(rremX / 10)), t5y = String(Math.floor(rremY / 10));
        const rrremX = rremX % 10, rrremY = rremY % 10;
        return `${bestBase}${t2x}${t2y}${t3x}${t3y}${t5x}${t5y}${Math.floor(rrremX)}${Math.floor(rrremY)}`;
      }
      function latLngToTpcCode(lat, lng) {
        try { const { x, y } = wgs84ToTwd67Tm2(lat, lng); return tm2ToTpc(x, y); }
        catch (e) { return `GPS_${lat.toFixed(4)}_${lng.toFixed(4)}`; }
      }
      function tpcCodeToLatLng(code) {
        try {
          const c = code.trim().toUpperCase().replace(/\s+/g, "");
          if (c.length < 9) return null;
          const base = c[0], baseCoords = GRID_BASES[base];

          const [bx, by] = baseCoords;
          const t2x = parseInt(c.slice(1, 3)), t2y = parseInt(c.slice(3, 5));
          const t3x = c.charCodeAt(5) - 65, t3y = c.charCodeAt(6) - 65;
          const t5x = parseInt(c[7]), t5y = parseInt(c[8]);
          if ([t2x, t2y, t3x, t3y, t5x, t5y].some(isNaN)) return null;
          let t99x = 5, t99y = 5;
          if (c.length >= 11) { t99x = parseInt(c[9]) + 0.5; t99y = parseInt(c[10]) + 0.5; }

          const tm2_x_fe = bx + dx, tm2_y = by + dy;
          const a67 = 6378160.0, b67 = 6356774.7192, e2_67 = 1 - (b67 * b67) / (a67 * a67), e_p2 = e2_67 / (1 - e2_67), k0 = 0.9999, lng0 = (121.0 * PI) / 180.0;
          const A = a67 * (1 - e2_67 / 4 - (3 * e2_67 ** 2) / 64 - (5 * e2_67 ** 3) / 256);

          const sinL1 = Math.sin(lat1), cosL1 = Math.cos(lat1), tanL1 = Math.tan(lat1);
          const N1 = a67 / Math.sqrt(1 - e2_67 * sinL1 ** 2), R1 = (a67 * (1 - e2_67)) / Math.pow(1 - e2_67 * sinL1 ** 2, 1.5);

          const lng67 = lng0 + (Dv - ((1 + 2 * T1 + C1) * Dv ** 3) / 6 + ((5 - 2 * C1 + 28 * T1 - 3 * C1 ** 2 + 8 * e_p2 + 24 * T1 ** 2) * Dv ** 5) / 120) / cosL1;
          const N67 = a67 / Math.sqrt(1 - e2_67 * Math.sin(lat67) ** 2);
          const x67 = N67 * Math.cos(lat67) * Math.cos(lng67), y67 = N67 * Math.cos(lat67) * Math.sin(lng67), z67 = N67 * (1 - e2_67) * Math.sin(lat67);
          const dxH = -752.0, dyH = -358.0, dzH = -179.0, rx = -0.0000011698, ry = 0.0000018398, rz = 0.0000009822, sH = 0.00002329;
          const x84 = x67 + dxH + sH * x67 - rz * y67 + ry * z67, y84 = y67 + dyH + rz * x67 + sH * y67 - rx * z67, z84 = z67 + dzH - ry * x67 + rx * y67 + sH * z67;
          const a84 = 6378137.0, b84 = 6356752.314245, e2_84 = 1 - (b84 * b84) / (a84 * a84), ep2_84 = (a84 * a84 - b84 * b84) / (b84 * b84);

          return { lat: (lat84 * 180) / PI, lng: (lng84 * 180) / PI };
        } catch (e) { return null; }
      }

      // ==========================================
      // 地圖初始化
      // ==========================================
      const map = L.map("map", { preferCanvas: true, zoomControl: false, attributionControl: true });
      L.control.zoom({ position: "bottomright" }).addTo(map);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 21, maxNativeZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);

      const SHOW_POINTS_ZOOM = 15, MAX_POINT_LABELS = 1200, MAX_DIRECT_POINTS = 3500;
      const STORAGE_KEY = "taipower_inspection_v7";

      const state = {
        points: [], meta: null, area: "", query: "",
        search: { prefixes: [], terms: [] },
        visiblePoints: [], drawnItems: [], equipmentColorMap: new Map(),
        displayMode: "prefix", folders: [], records: [],
        hiddenRecordFolders: new Set(), expandedFolders: new Set(),
        selectedFolders: new Set(), selectedRecords: new Set(),
        labelsHidden: false, lastFolderId: null,
      };

      const statusBox = document.querySelector("#status");
      const folderList = document.querySelector("#folderList");
      const selectedCountText = document.getElementById("selectedCount");
      const areaSelect = document.getElementById("areaSelect");
      const searchInput = document.getElementById("searchInput");
      const results = document.getElementById("results");
      const resultTemplate = document.getElementById("resultTemplate");
      const totalCount = document.getElementById("totalCount");
      const visibleCount = document.getElementById("visibleCount");
      const drawCount = document.getElementById("drawCount");

      let labelsLayer = L.layerGroup().addTo(map);
      let recordsLayer = L.featureGroup().addTo(map);

      // ==========================================
      // 工具函式
      // ==========================================
      function compareNatural(a, b) { return a.localeCompare(b, "zh-Hant", { numeric: true, sensitivity: "base" }); }
      function comparePointsByName(a, b) { return compareNatural(a.name || a.code || "", b.name || b.code || ""); }
      function escapeHtml(v) { return String(v ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }
      function formatNumber(v) { return new Intl.NumberFormat("zh-TW").format(v); }
      function debounce(fn, wait = 180) { let t = 0; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), wait); }; }
      function setStatus(text) { statusBox.textContent = text; }

      function getAllRecordsInFolder(folderId) {
        const direct = state.records.filter(r => r.folderId === folderId);
        const children = state.folders.filter(f => f.parentId === folderId);
        let all = [...direct];
        for (const child of children) all = all.concat(getAllRecordsInFolder(child.id));
        return all;
      }
      function getAllRecordIdsInFolder(folderId) { return getAllRecordsInFolder(folderId).map(r => r.id); }

      // ==========================================
      // ✅ 修正：全域遞迴刪除資料夾（供單刪與批次刪共用）
      // ==========================================
      function deleteFolderRecursive(fId) {
        state.folders.filter(f => f.parentId === fId).forEach(child => deleteFolderRecursive(child.id));
        state.records = state.records.filter(r => r.folderId !== fId);
        state.folders = state.folders.filter(f => f.id !== fId);
        state.hiddenRecordFolders.delete(fId);
        state.expandedFolders.delete(fId);
        state.selectedFolders.delete(fId);
      }

      const DEFECT_GROUPS = [
        { label: "樹修", open: true, items: ["樹木修剪", "藤蔓清除", "竹枝清除", "椰樹修剪"] },
        { label: "導線", open: false, items: ["防雷脫落", "低壓脫落"] },
        { label: "設計", open: false, items: ["不良", "游休TR", "橫擔腐蝕"] },
        { label: "雜項", open: false, items: ["桿上異物"] },
      ];

      function findOrCreateFolderByPath(pathStr) {
        const parts = pathStr.split(/\s*\/\s*/).map(s => s.trim()).filter(Boolean);
        if (!parts.length) return null;
        let parentId = null, currentFolder = null;
        for (const part of parts) {
          currentFolder = state.folders.find(f => f.name === part && f.parentId === parentId);
          if (!currentFolder) {
            const newId = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
            currentFolder = { id: newId, name: part, parentId };
            state.folders.push(currentFolder);
            state.expandedFolders.add(newId);
          }
          parentId = currentFolder.id;
        }
        return currentFolder ? currentFolder.id : null;
      }

      function setPanelCollapsed(collapsed) {
        document.querySelector("#panel").classList.toggle("is-collapsed", collapsed);
        document.querySelector(".app").classList.toggle("is-panel-collapsed", collapsed);
        window.setTimeout(() => map.invalidateSize(), 220);
      }
      document.getElementById("panelToggle").addEventListener("click", () => {
        const panel = document.querySelector("#panel");
        const collapsed = !panel.classList.contains("is-collapsed");
        setPanelCollapsed(collapsed);
        document.getElementById("panelToggle").setAttribute("aria-expanded", String(!collapsed));

      // ==========================================
      // LocalStorage
      // ==========================================
      function saveToLocalStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ folders: state.folders, records: state.records, lastFolderId: state.lastFolderId }));
        } catch (e) { console.error("儲存失敗:", e); }
        renderFolders();
        updateRecordMarkers();
      }
      function loadFromLocalStorage() {
        try {
          let dataStr = localStorage.getItem(STORAGE_KEY) || localStorage.getItem("taipower_inspection_v6") || localStorage.getItem("taipower_inspection_v5");
          if (dataStr) {
            const parsed = JSON.parse(dataStr);
            state.folders = parsed.folders || [];
            state.records = parsed.records || [];
            state.lastFolderId = parsed.lastFolderId || null;
            state.folders.forEach(f => { if (typeof f.parentId === "undefined") f.parentId = null; });
            state.records.forEach(r => { if (!r.id) r.id = "rec_" + Date.now().toString(36) + Math.random().toString(36).substr(2, 6); });
            if (!state.lastFolderId && state.records.length > 0) state.lastFolderId = state.records[state.records.length - 1].folderId;
            if (!localStorage.getItem(STORAGE_KEY)) saveToLocalStorage();
          }
        } catch (e) { console.error("讀取 localStorage 失敗:", e); }
      }
      function getFullFolderPath(folderId) {
        let path = [], curr = state.folders.find(f => f.id === folderId);
        while (curr) { path.unshift(curr.name); curr = state.folders.find(f => f.id === curr.parentId); }
        return path.join(" / ");
      }
      function getFolderOptionsHtml(selectedId = null, excludeFolderId = null, includeRoot = false) {
        let html = includeRoot ? '<option value="">(最上層)</option>' : '<option value="">(請選擇資料夾)</option>';
        function buildOpts(pId, depth) {
          state.folders.filter(f => f.parentId === pId).forEach(f => {
            if (f.id === excludeFolderId) return;
            const prefix = "　".repeat(depth) + (depth > 0 ? "└ " : "");
            html += `<option value="${f.id}" ${f.id === selectedId ? "selected" : ""}>${prefix}${escapeHtml(f.name)}</option>`;
            buildOpts(f.id, depth + 1);
          });
        }
        buildOpts(null, 0);
        return html;
      }
      function isDescendant(targetParentId, folderId) {
        let curr = state.folders.find(f => f.id === targetParentId);
        while (curr) { if (curr.id === folderId) return true; curr = state.folders.find(f => f.id === curr.parentId); }
        return false;
      }

      // ==========================================
      // 渲染資料夾
      // ==========================================
      function renderFolders() {
        for (const id of state.selectedFolders) { if (!state.folders.some(f => f.id === id)) state.selectedFolders.delete(id); }
        for (const id of state.selectedRecords) { if (!state.records.some(r => r.id === id)) state.selectedRecords.delete(id); }

        const folderCount = state.selectedFolders.size, recordCount = state.selectedRecords.size;
        const selCount = folderCount + recordCount, totalItemsCount = state.folders.length + state.records.length;
        let countText = "";
        if (folderCount > 0 && recordCount > 0) countText = `${folderCount} 個資料夾，${recordCount} 筆紀錄`;
        else if (folderCount > 0) countText = `${folderCount} 個資料夾`;
        else if (recordCount > 0) countText = `${recordCount} 筆紀錄`;
        else countText = "0 項";
        selectedCountText.textContent = countText;

        const batchActionGroup = document.getElementById("batchActionGroup");
        if (batchActionGroup) batchActionGroup.style.display = selCount > 0 ? "flex" : "none";

        const selectAllBtn = document.getElementById("selectAllBtn");
        if (selectAllBtn) {
          if (selCount === totalItemsCount && totalItemsCount > 0) { selectAllBtn.textContent = "取消 ❌"; selectAllBtn.style.background = "#64748b"; }
          else { selectAllBtn.textContent = "全選 ☑️"; selectAllBtn.style.background = "#0f766e"; }
        }

        function buildFoldersHtml(parentId, depth) {
          let html = "";
          state.folders.filter(f => f.parentId === parentId).forEach(folder => {
            const directRecords = state.records.filter(r => r.folderId === folder.id).sort(comparePointsByName);
            const totalCount_ = getAllRecordsInFolder(folder.id).length;
            const directCount = directRecords.length;
            const isHidden = state.hiddenRecordFolders.has(folder.id);
            const isExpanded = state.expandedFolders.has(folder.id);
            const isChecked = state.selectedFolders.has(folder.id) ? "checked" : "";
            const allDirectSelected = directCount > 0 && directRecords.every(r => state.selectedRecords.has(r.id));
            const hasChildren = state.folders.some(f => f.parentId === folder.id);
            const countLabel = hasChildren ? `${totalCount_} (含子層)` : `${totalCount_}`;

            let recordsHTML = "";
            if (directCount > 0) {
              recordsHTML += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; padding-bottom:4px; border-bottom:1px dotted #e2e8f0;">
                <span style="font-size:11px; color:var(--muted);">直屬紀錄 ${directCount} 筆</span>
                <button class="btn-small" data-select-all-folder="${folder.id}" style="font-size:11px; padding:2px 6px; min-height:0;">${allDirectSelected ? "取消全選" : "全選"}</button>
              </div>`;
              recordsHTML += directRecords.map(r => {
                const rChecked = state.selectedRecords.has(r.id) ? "checked" : "";
                return `<div id="record-row-${r.id}" style="display:flex; align-items:center; gap:6px; margin-bottom:4px; padding:4px; border-radius:4px; transition:background-color 1.5s ease;">
                  <input type="checkbox" class="cb-record" data-id="${r.id}" ${rChecked} style="width:16px; height:16px; cursor:pointer; flex-shrink:0;">
                  <button class="record-item" data-fly-lat="${r.lat}" data-fly-lng="${r.lng}" title="飛轉至此設備">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                      <span class="record-item-title">📍 ${escapeHtml(r.name || r.code)}</span>
                      <span class="btn-small text-danger" data-delete-record="${r.id}" title="刪除此紀錄" style="border:none; padding:2px 4px; min-height:0; margin-left:4px;">✖</span>
                    </div>
                    <span class="record-item-meta">不良: ${escapeHtml(r.defect || "無")} | 緩急: ${escapeHtml(r.urgency || "C")}</span>
                  </button>
                </div>`;
              }).join("");
            } else {
              recordsHTML = `<div style="font-size:12px; color:#999; padding:4px;">(此層無直屬紀錄)</div>`;
            }
            let childrenHTML = "";
            if (isExpanded) childrenHTML = buildFoldersHtml(folder.id, depth + 1);
            const marginLeft = depth > 0 ? "10px" : "0px";
            const bg = depth % 2 === 0 ? "#f8fafc" : "#ffffff";
            const borderLeft = depth > 0 ? "border-left: 2px solid #cbd5e1;" : "";

            html += `<div class="folder-item" style="margin-left:${marginLeft}; ${borderLeft} border-radius:${depth > 0 ? "0 6px 6px 0" : "6px"}; background:${bg}; border-top:1px solid var(--line); border-bottom:1px solid var(--line); border-right:1px solid var(--line);">
              <div class="folder-item-top" style="flex-wrap:wrap;">
                <div style="display:flex; align-items:center; flex-grow:1; min-width:60%;">
                  <input type="checkbox" class="cb-folder" data-id="${folder.id}" ${isChecked} style="width:16px; height:16px; cursor:pointer; margin-right:6px; flex-shrink:0;">
                  <span class="folder-name-toggle" data-toggle="${folder.id}" title="展開/收合">
                    ${escapeHtml(folder.name)} (${countLabel})
                    <span style="font-size:10px; color:var(--muted); margin-left:4px;">${isExpanded ? "▲" : "▼"}</span>
                  </span>
                </div>
                <div class="folder-actions" style="display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; margin-top:6px; width:100%;">
                  <button class="btn-small" data-add-sub="${folder.id}">➕子層</button>
                  <button class="btn-small" data-rename="${folder.id}">✏️改名</button>
                  <button class="btn-small" data-move-up="${folder.id}">⬆️</button>
                  <button class="btn-small" data-move-down="${folder.id}">⬇️</button>
                  <button class="btn-small" data-export="${folder.id}">📤匯出</button>
                  <button class="btn-small" data-toggle-visibility="${folder.id}">${isHidden ? "🙈" : "👁️"}</button>
                  <button class="btn-small text-danger" data-delete-folder="${folder.id}">✖</button>
                </div>
              </div>
              <div class="record-list ${isExpanded ? "is-expanded" : ""}" style="margin-left:22px;">
                ${recordsHTML}
                ${childrenHTML}
              </div>
            </div>`;
          });
          return html;
        }
        folderList.innerHTML = buildFoldersHtml(null, 0);
      }

      // ==========================================
      // 批次操作
      // ==========================================
      document.getElementById("batchExportBtn").addEventListener("click", () => {
        if (state.selectedFolders.size === 0 && state.selectedRecords.size === 0) { GlobalModal.alert("請先勾選要匯出的資料夾或紀錄。"); return; }
        const uniqueRecordIds = new Set();
        state.selectedFolders.forEach(fId => getAllRecordIdsInFolder(fId).forEach(id => uniqueRecordIds.add(id)));
        state.selectedRecords.forEach(id => uniqueRecordIds.add(id));
        const exportData = [];
        uniqueRecordIds.forEach(rId => {
          const r = state.records.find(x => x.id === rId);
          if (r) exportData.push({ "巡視日期(目錄)": getFullFolderPath(r.folderId), 土木設備: r.name || "", 圖號座標: r.code || "", 不良項目: r.defect || "", 緩急程度: r.urgency || "", 設計單號: "", 設計日期: "", 施工單位: "", 施工單號: "", 施工日期: "" });
        });
        if (exportData.length === 0) { GlobalModal.alert("勾選範圍內沒有紀錄可匯出。"); return; }
        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "巡視紀錄");
        const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
        exportOrShareFile(buf, `批次匯出_${new Date().toISOString().slice(0, 10)}.xlsx`, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
      });

      document.getElementById("batchDeleteBtn").addEventListener("click", () => {
        const uniqueRecordIds = new Set();
        state.selectedFolders.forEach(fId => getAllRecordIdsInFolder(fId).forEach(id => uniqueRecordIds.add(id)));
        state.selectedRecords.forEach(id => uniqueRecordIds.add(id));
        GlobalModal.confirm(`確定要刪除選取的 ${state.selectedFolders.size} 個資料夾（含子層）嗎？\n共將移除 ${uniqueRecordIds.size} 筆不重複紀錄。`, () => {
          state.selectedFolders.forEach(fId => deleteFolderRecursive(fId));
          state.selectedRecords.forEach(rId => { state.records = state.records.filter(r => r.id !== rId); });
          state.selectedFolders.clear();
          state.selectedRecords.clear();
          saveToLocalStorage();
          renderer.redraw();
        });
      });

      document.getElementById("batchMoveBtn").addEventListener("click", () => {
        GlobalModal.select("🚚 批次移動至...", "請選擇要將勾選項搬移到哪個資料夾：", getFolderOptionsHtml(null, null, true), (targetId) => {
          const safeTarget = targetId === "" ? null : targetId;
          for (const fId of state.selectedFolders) {
            if (fId === safeTarget || (safeTarget && isDescendant(safeTarget, fId))) continue;
            const folder = state.folders.find(f => f.id === fId);
            if (folder) folder.parentId = safeTarget;
          }
          const recordsInMovingFolders = new Set();
          state.selectedFolders.forEach(fId => getAllRecordIdsInFolder(fId).forEach(id => recordsInMovingFolders.add(id)));
          for (const rId of state.selectedRecords) {
            if (recordsInMovingFolders.has(rId)) continue;
            if (safeTarget === null) { GlobalModal.alert("❌ 設備紀錄必須放置在資料夾內！"); break; }
            const record = state.records.find(r => r.id === rId);
            if (record) record.folderId = safeTarget;
          }
          state.selectedFolders.clear();
          state.selectedRecords.clear();
          saveToLocalStorage();
        });
      });

      document.getElementById("selectAllBtn").addEventListener("click", () => {
        const totalItemsCount = state.folders.length + state.records.length;
        const currentSelectedCount = state.selectedFolders.size + state.selectedRecords.size;
        if (currentSelectedCount === totalItemsCount && totalItemsCount > 0) { state.selectedFolders.clear(); state.selectedRecords.clear(); }
        else { state.folders.forEach(f => state.selectedFolders.add(f.id)); state.records.forEach(r => state.selectedRecords.add(r.id)); }
        renderFolders();
      });

      document.getElementById("showAllStarsBtn").addEventListener("click", () => { state.hiddenRecordFolders.clear(); renderFolders(); updateRecordMarkers(); });
      document.getElementById("hideAllStarsBtn").addEventListener("click", () => { state.folders.forEach(f => state.hiddenRecordFolders.add(f.id)); renderFolders(); updateRecordMarkers(); });

      // ==========================================
      // 資料夾清單事件委派
      // ==========================================
      folderList.addEventListener("click", (e) => {
        const target = e.target;

        const folderToggle = target.closest("[data-toggle]");
        if (folderToggle) {
          const fId = folderToggle.dataset.toggle;
          state.expandedFolders.has(fId) ? state.expandedFolders.delete(fId) : state.expandedFolders.add(fId);
          renderFolders(); return;
        }

        if (target.classList.contains("cb-folder")) {
          const fId = target.dataset.id;
          function getAllDescendantFolderIds(id) {
            let ids = [];
            state.folders.filter(f => f.parentId === id).forEach(child => { ids.push(child.id); ids = ids.concat(getAllDescendantFolderIds(child.id)); });
            return ids;
          }
          const descendantFolderIds = getAllDescendantFolderIds(fId);
          const allRecordIds = getAllRecordIdsInFolder(fId);
          if (target.checked) {
            state.selectedFolders.add(fId);
            descendantFolderIds.forEach(id => state.selectedFolders.add(id));
            allRecordIds.forEach(id => state.selectedRecords.add(id));
          } else {
            state.selectedFolders.delete(fId);
            descendantFolderIds.forEach(id => state.selectedFolders.delete(id));
            allRecordIds.forEach(id => state.selectedRecords.delete(id));
            let curr = state.folders.find(f => f.id === fId);
            while (curr && curr.parentId) { state.selectedFolders.delete(curr.parentId); curr = state.folders.find(f => f.id === curr.parentId); }
          }
          renderFolders(); return;
        }

        if (target.dataset.selectAllFolder) {
          const fId = target.dataset.selectAllFolder;
          const directRecords = state.records.filter(r => r.folderId === fId);
          const allSelected = directRecords.length > 0 && directRecords.every(r => state.selectedRecords.has(r.id));
          if (allSelected) directRecords.forEach(r => state.selectedRecords.delete(r.id));
          else directRecords.forEach(r => state.selectedRecords.add(r.id));
          renderFolders(); return;
        }

        if (target.classList.contains("cb-record")) {
          const rId = target.dataset.id;
          if (target.checked) { state.selectedRecords.add(rId); }
          else {
            state.selectedRecords.delete(rId);
            const record = state.records.find(r => r.id === rId);
            if (record) { let currId = record.folderId; while (currId) { state.selectedFolders.delete(currId); const pf = state.folders.find(f => f.id === currId); currId = pf ? pf.parentId : null; } }
          }
          renderFolders(); return;
        }

        const recordBtn = target.closest(".record-item");
        if (recordBtn && !target.dataset.deleteRecord) {
          const lat = parseFloat(recordBtn.dataset.flyLat), lng = parseFloat(recordBtn.dataset.flyLng);
          const point = state.points.find(p => p.lat === lat && p.lng === lng) || state.records.find(r => r.lat === lat && r.lng === lng);
          if (point) { map.flyTo([lat, lng], map.getMaxZoom(), { duration: 0.45 }); L.popup().setLatLng([lat, lng]).setContent(popupHtml(point)).openOn(map); if (window.innerWidth <= 820) setPanelCollapsed(true); }
          return;
        }

        if (target.dataset.deleteRecord) {
          const rId = target.dataset.deleteRecord;
          GlobalModal.confirm("確定要刪除此筆紀錄嗎？", () => { state.records = state.records.filter(r => r.id !== rId); state.selectedRecords.delete(rId); saveToLocalStorage(); renderer.redraw(); });
          return;
        }

        if (target.dataset.addSub) {
          GlobalModal.prompt("請輸入子資料夾名稱：", "", (newName) => {
            if (newName && newName.trim()) { const newId = Date.now().toString(); state.folders.push({ id: newId, name: newName.trim(), parentId: target.dataset.addSub }); state.expandedFolders.add(target.dataset.addSub); state.expandedFolders.add(newId); saveToLocalStorage(); }
          });
        } else if (target.dataset.rename) {
          const f = state.folders.find(x => x.id === target.dataset.rename);
          if (!f) return;
          GlobalModal.prompt("重新命名資料夾：", f.name, (newName) => { if (newName && newName.trim()) { f.name = newName.trim(); saveToLocalStorage(); } });
        }

        const moveUpBtn = target.closest("[data-move-up]");
        const moveDownBtn = target.closest("[data-move-down]");
        if (moveUpBtn || moveDownBtn) {
          const btn = moveUpBtn || moveDownBtn;
          const fId = btn.dataset.moveUp || btn.dataset.moveDown;
          const direction = moveUpBtn ? -1 : 1;
          const folder = state.folders.find(f => f.id === fId);
          if (!folder) return;
          const siblings = state.folders.filter(f => f.parentId === folder.parentId);
          const sIdx = siblings.findIndex(f => f.id === fId);
          if (direction === -1 && sIdx > 0) swapInArray(state.folders, fId, siblings[sIdx - 1].id);
          else if (direction === 1 && sIdx < siblings.length - 1) swapInArray(state.folders, fId, siblings[sIdx + 1].id);
          return;
        }

        if (target.dataset.toggleVisibility) {
          const fId = target.dataset.toggleVisibility;
          const nowHidden = state.hiddenRecordFolders.has(fId);
          function getAllDescIds(id) { const ids = [id]; state.folders.filter(f => f.parentId === id).forEach(child => getAllDescIds(child.id).forEach(cid => ids.push(cid))); return ids; }
          const affectedIds = getAllDescIds(fId);
          if (nowHidden) affectedIds.forEach(id => state.hiddenRecordFolders.delete(id));
          else affectedIds.forEach(id => state.hiddenRecordFolders.add(id));
          renderFolders(); updateRecordMarkers();
        } else if (target.dataset.export) {
          const fId = target.dataset.export;
          const folder = state.folders.find(f => f.id === fId);
          if (!folder) return;
          const targetRecords = getAllRecordsInFolder(fId);
          const pathName = getFullFolderPath(fId);
          const exportData = targetRecords.map(r => ({ "巡視日期(目錄)": getFullFolderPath(r.folderId), 土木設備: r.name || "", 圖號座標: r.code || "", 不良項目: r.defect || "", 緩急程度: r.urgency || "", 設計單號: "", 設計日期: "", 施工單位: "", 施工單號: "", 施工日期: "" }));
          if (exportData.length === 0) exportData.push({ "巡視日期(目錄)": pathName, 土木設備: "", 圖號座標: "", 不良項目: "", 緩急程度: "", 設計單號: "", 設計日期: "", 施工單位: "", 施工單號: "", 施工日期: "" });
          const ws = XLSX.utils.json_to_sheet(exportData);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "巡視紀錄");
          const buf = XLSX.write(wb, { bookType: "xlsx", type: "array" });
          exportOrShareFile(buf, `巡視紀錄_${folder.name}.xlsx`, "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
        } else if (target.dataset.deleteFolder) {
          // ✅ 修正：改用全域遞迴刪除
          const fId = target.dataset.deleteFolder;
          const folder = state.folders.find(f => f.id === fId);
          if (!folder) return;
          const totalToDelete = getAllRecordsInFolder(fId).length;
          GlobalModal.confirm(`確定要刪除資料夾「${folder.name}」及其所有子層嗎？\n共將移除 ${totalToDelete} 筆紀錄。`, () => {
            deleteFolderRecursive(fId);
            saveToLocalStorage();
            renderer.redraw();
          });
        }
      });

      function swapInArray(arr, id1, id2) {
        const idx1 = arr.findIndex(i => i.id === id1), idx2 = arr.findIndex(i => i.id === id2);
        if (idx1 < 0 || idx2 < 0) return;
        const temp = arr[idx1]; arr[idx1] = arr[idx2]; arr[idx2] = temp;
        saveToLocalStorage();
      }

      document.querySelector("#addFolderBtn").addEventListener("click", () => {
        GlobalModal.prompt("請輸入新的最上層資料夾名稱：", "", (newName) => {
          if (newName && newName.trim()) { const newId = Date.now().toString(); state.folders.push({ id: newId, name: newName.trim(), parentId: null }); state.expandedFolders.add(newId); saveToLocalStorage(); }
        });
      });

      // ==========================================
      // 匯入 Excel（手機可從雲端/檔案 App 選取）
      // ==========================================
      document.querySelector("#importCsvBtn").addEventListener("click", () => document.querySelector("#importFileInput").click());
      document.querySelector("#importFileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (event) {
          try {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, raw: false });
            let importedCount = 0, skippedCount = 0, manualCount = 0;
            let skipHeader = true;
            for (const row of rows) {
              if (skipHeader) { skipHeader = false; continue; }
              if (!row || row.length < 3) continue;
              const folderPath = String(row[0] || "").trim(), name = String(row[1] || "").trim(), code = String(row[2] || "").trim(), defect = String(row[3] || "").trim(), urgency = String(row[4] || "C").trim();
              if (!folderPath || !name) continue;
              let resolvedLat = null, resolvedLng = null, resolvedName = name, resolvedCode = code;
              let point = code ? state.points.find(p => (p.code || "") === code) : null;
              if (!point && name) point = state.points.find(p => (p.name || "") === name);
              if (point) { resolvedLat = point.lat; resolvedLng = point.lng; resolvedName = point.name || name; resolvedCode = point.code || code; }
              else {
                const gpsMatch = code.match(/^GPS_([\d.]+)_([\d.]+)$/i);
                if (gpsMatch) { resolvedLat = parseFloat(gpsMatch[1]); resolvedLng = parseFloat(gpsMatch[2]); resolvedCode = code; resolvedName = name; manualCount++; }
                else {
                  const reversed = tpcCodeToLatLng(code);
                  if (reversed) { resolvedLat = reversed.lat; resolvedLng = reversed.lng; resolvedCode = code; resolvedName = name; skippedCount++; }
                  else { skippedCount++; continue; }
                }
              }
              const folderId = findOrCreateFolderByPath(folderPath);
              if (!folderId) continue;
              const existingIndex = state.records.findIndex(r => r.folderId === folderId && r.lat === resolvedLat && r.lng === resolvedLng);
              const recordData = { id: existingIndex >= 0 ? state.records[existingIndex].id : "rec_" + Date.now().toString(36) + Math.random().toString(36).substr(2, 5), lat: resolvedLat, lng: resolvedLng, name: resolvedName, code: resolvedCode, folderId, defect, urgency };
              if (existingIndex >= 0) state.records[existingIndex] = recordData;
              else state.records.push(recordData);
              importedCount++;
            }
            saveToLocalStorage();
            let msg = `✅ 匯入完成！成功匯入/更新 ${importedCount} 筆紀錄`;

      function updateRecordMarkers() {

          let htmlContent = '<div class="saved-star-marker">⭐</div>';
          let iconAnchor = [10, 10];

            const labelColor = colorForEquipmentName(record.name);
            htmlContent = `<div style="display:flex; flex-direction:column; align-items:center; transform:translate(-50%, calc(-100% + 10px)); width:max-content;">

      // ==========================================
      // 地圖繪圖引擎

      function codePrefix(code) {

      function parseSearchQuery(query) {

        return { prefixes, terms };
      }
      function pointSearchText(point) { return `${point.name || ""} ${point.code || ""} ${codePrefix(point.code)}`.toLowerCase(); }
      function hasSearchTerm(point, terms) { if (!terms.length) return false; const text = pointSearchText(point); return terms.some(term => text.includes(term)); }
      function matchesSearch(point, search) { if (!search.prefixes.length && !search.terms.length) return true; return search.prefixes.includes(codePrefix(point.code)) || hasSearchTerm(point, search.terms); }
      function pointInBounds(point, bounds) { return point.lat >= bounds.getSouth() && point.lat <= bounds.getNorth() && point.lng >= bounds.getWest() && point.lng <= bounds.getEast(); }
      function matchesFilters(point) { if (state.area && point.area !== state.area) return false; return matchesSearch(point, state.search); }
      function visibleFilteredPoints() { const bounds = map.getBounds(), output = []; for (const p of state.points) { if (pointInBounds(p, bounds) && matchesFilters(p)) output.push(p); } return output; }

      const EQUIPMENT_COLOR_PALETTE = [
        {color:"#b91c1c",hue:0},{color:"#2563eb",hue:220},{color:"#15803d",hue:145},{color:"#d97706",hue:35},
        {color:"#7e22ce",hue:275},{color:"#0f766e",hue:175},{color:"#be185d",hue:335},{color:"#4d7c0f",hue:95},
        {color:"#4338ca",hue:245},{color:"#c2410c",hue:20},{color:"#047857",hue:155},{color:"#0e7490",hue:195},
        {color:"#a21caf",hue:295},{color:"#854d0e",hue:45},{color:"#1d4ed8",hue:225},{color:"#64748b",hue:215},
      ];
      const PREFIX_COLORS = EQUIPMENT_COLOR_PALETTE.map(({color}) => color);
      const EQUIPMENT_COLOR_HUES = new Map(EQUIPMENT_COLOR_PALETTE.map(({color,hue}) => [color,hue]));
      const NEARBY_EQUIPMENT_THRESHOLD = 220, UNKNOWN_EQUIPMENT_PREFIX = "未分類", UNKNOWN_EQUIPMENT_COLOR = "#64748b";

      function equipmentNamePrefix(name) { const m = String(name || "").trim().match(/^[\u3400-\u9fff]+/); return m ? m[0].slice(0, 4) : UNKNOWN_EQUIPMENT_PREFIX; }
      function circularHueDistance(a, b) { const diff = Math.abs(a - b) % 360; return Math.min(diff, 360 - diff); }
      function colorContrastScore(color, usedNeighborColors) { if (!usedNeighborColors.length) return 180; const hue = EQUIPMENT_COLOR_HUES.get(color) ?? hashText(color) % 360; return Math.min(...usedNeighborColors.map(uc => circularHueDistance(hue, EQUIPMENT_COLOR_HUES.get(uc) ?? hashText(uc) % 360))); }

      function buildEquipmentColorMap(items) {
        const groups = new Map();
        for (const item of items) { const prefix = equipmentNamePrefix(item.point.name); if (prefix === UNKNOWN_EQUIPMENT_PREFIX) continue; let g = groups.get(prefix); if (!g) { g = {prefix, count:0, xSum:0, ySum:0, minX:item.x, maxX:item.x, minY:item.y, maxY:item.y, color:""}; groups.set(prefix, g); } g.count++; g.xSum+=item.x; g.ySum+=item.y; g.minX=Math.min(g.minX,item.x); g.maxX=Math.max(g.maxX,item.x); g.minY=Math.min(g.minY,item.y); g.maxY=Math.max(g.maxY,item.y); }
        const colorMap = new Map([[UNKNOWN_EQUIPMENT_PREFIX, UNKNOWN_EQUIPMENT_COLOR]]);
        const colorUse = new Map(PREFIX_COLORS.map(c => [c, 0]));
        const sortedGroups = [...groups.values()].map(g => ({...g, x:g.xSum/g.count, y:g.ySum/g.count})).sort((a,b) => b.count - a.count);
        const adjacency = new Map(sortedGroups.map(g => [g.prefix, new Set()]));
        for (let i = 0; i < sortedGroups.length; i++) for (let j = i+1; j < sortedGroups.length; j++) if (groupScreenGap(sortedGroups[i], sortedGroups[j]) < NEARBY_EQUIPMENT_THRESHOLD) { adjacency.get(sortedGroups[i].prefix).add(sortedGroups[j].prefix); adjacency.get(sortedGroups[j].prefix).add(sortedGroups[i].prefix); }

        for (const g of orderedGroups) { const usedNeighborColors = [...adjacency.get(g.prefix)].map(p => colorMap.get(p)).filter(Boolean); const start = hashText(g.prefix) % PREFIX_COLORS.length; const ranked = PREFIX_COLORS.map((_,i) => PREFIX_COLORS[(start+i) % PREFIX_COLORS.length]).sort((a,b) => { const cd = colorContrastScore(b, usedNeighborColors) - colorContrastScore(a, usedNeighborColors); return cd !== 0 ? cd : (colorUse.get(a)||0)-(colorUse.get(b)||0); }); g.color = ranked[0]; colorMap.set(g.prefix, g.color); colorUse.set(g.color, (colorUse.get(g.color)||0)+1); }

      function colorForEquipmentName(name) { return state.equipmentColorMap.get(equipmentNamePrefix(name)) || colorForPrefix(equipmentNamePrefix(name)); }

      const canvasLayer = L.Layer.extend({
        onAdd(m) { this.canvas = L.DomUtil.create("canvas","leaflet-zoom-animated"); this.canvas.style.pointerEvents="none"; this.context=this.canvas.getContext("2d"); m.getPanes().overlayPane.appendChild(this.canvas); m.on("moveend zoomend resize", this.redraw, this); this.redraw(); },
        onRemove(m) { L.DomUtil.remove(this.canvas); m.off("moveend zoomend resize", this.redraw, this); },
        redraw() {

          const size = map.getSize(), topLeft = map.containerPointToLayerPoint([0,0]);
          L.DomUtil.setPosition(this.canvas, topLeft);

          this.canvas.style.width = `${size.x}px`; this.canvas.style.height = `${size.y}px`;
          const ctx = this.context; ctx.clearRect(0, 0, size.x, size.y);
          if (state.labelsHidden) { state.drawnItems = []; updateLabels(); updateStats(); return; }
          state.visiblePoints = visibleFilteredPoints();
          if (map.getZoom() >= SHOW_POINTS_ZOOM && state.visiblePoints.length <= MAX_DIRECT_POINTS) {
            state.displayMode = "point";
            state.drawnItems = state.visiblePoints.map(p => { const pixel = map.latLngToContainerPoint([p.lat, p.lng]); return {type:"point", point:p, x:pixel.x, y:pixel.y, count:1}; });
            state.equipmentColorMap = buildEquipmentColorMap(state.drawnItems);
            drawPoints(ctx, state.drawnItems);
          } else {
            state.displayMode = "prefix";
            const groups = new Map();
            for (const p of state.visiblePoints) { const prefix = codePrefix(p.code); let g = groups.get(prefix); if (!g) { g = {type:"prefix", prefix, count:0, latSum:0, lngSum:0}; groups.set(prefix, g); } g.count++; g.latSum+=p.lat; g.lngSum+=p.lng; }
            state.drawnItems = placePrefixLabels([...groups.values()].map(g => { const lat=g.latSum/g.count, lng=g.lngSum/g.count; const pixel=map.latLngToContainerPoint([lat,lng]); return {...g,lat,lng,x:pixel.x,y:pixel.y}; }).sort((a,b) => b.count-a.count));
            drawPrefixLabels(ctx, state.drawnItems);

        },

      const renderer = new canvasLayer().addTo(map);

      function drawPoints(ctx, items) { for (const item of items) { ctx.beginPath(); ctx.arc(item.x, item.y, 4.5, 0, Math.PI*2); ctx.fillStyle = colorForEquipmentName(item.point.name); ctx.fill(); ctx.lineWidth=1.5; ctx.strokeStyle="rgba(255,255,255,0.95)"; ctx.stroke(); } }

      let currentPrefixColors = new Map();
      function buildPrefixColorsByProximity(items) {
        const THRESHOLD = 160, adj = new Map(items.map(it => [it.prefix, new Set()]));
        for (let i=0; i<items.length; i++) for (let j=i+1; j<items.length; j++) { const dx=items[i].x-items[j].x, dy=items[i].y-items[j].y; if (Math.sqrt(dx*dx+dy*dy)<THRESHOLD) { adj.get(items[i].prefix).add(items[j].prefix); adj.get(items[j].prefix).add(items[i].prefix); } }
        const sorted = [...items].sort((a,b) => adj.get(b.prefix).size-adj.get(a.prefix).size);
        const colorIdx = new Map();

      function drawPrefixLabels(ctx, items) {

      function placePrefixLabels(items) {
        const occupied = new Set(), output = [], gridW = map.getZoom()<=10?52:36, gridH = map.getZoom()<=10?28:20;
        for (const item of items) { const key = `${Math.floor(item.x/gridW)}:${Math.floor(item.y/gridH)}`; if (occupied.has(key)) continue; occupied.add(key); output.push(item); if (output.length>=900) break; }
        return output;
      }
      function updateLabels() {
        labelsLayer.clearLayers();
        if (state.labelsHidden || state.displayMode !== "point" || state.visiblePoints.length > MAX_POINT_LABELS) return;
        for (const p of state.visiblePoints) {
          const labelColor = colorForEquipmentName(p.name);
          L.marker([p.lat, p.lng], { icon: L.divIcon({ className:"point-label", html:`<span class="point-label-chip" style="--label-color:${labelColor}">${escapeHtml(p.name)}</span>`, iconSize:null, iconAnchor:[-8,20] }) })
            .on("click", () => { L.popup({autoPanPadding:[10,10]}).setLatLng([p.lat,p.lng]).setContent(popupHtml(p)).openOn(map); })
            .addTo(labelsLayer);
        }
      }
      function updateStats() { totalCount.textContent=formatNumber(state.points.length); visibleCount.textContent=formatNumber(state.labelsHidden?0:state.visiblePoints.length); drawCount.textContent=formatNumber(state.drawnItems.length); }
      function fillAreas() { for (const area of state.meta?.areas||[]) { const o=document.createElement("option"); o.value=area.name; o.textContent=`${area.name} (${formatNumber(area.count)})`; areaSelect.append(o); } }

      document.getElementById("toggleLabelsBtn").addEventListener("click", (e) => {
        state.labelsHidden = !state.labelsHidden;
        e.target.textContent = state.labelsHidden ? "顯示所有主圖標籤" : "隱藏所有主圖標籤";
        e.target.classList.toggle("is-hidden", state.labelsHidden);
        renderer.redraw(); updateRecordMarkers();
      });
      areaSelect.addEventListener("change", applyFilter);
      searchInput.addEventListener("input", debounce(applyFilter, 180));

      function applyFilter() { state.area=areaSelect.value; state.query=searchInput.value.trim(); state.search=parseSearchQuery(state.query); renderResults(searchMatches(state.search)); renderer.redraw(); }
      function searchMatches(search) {
        if (!search.prefixes.length && !search.terms.some(t => t.length >= 1)) return [];
        const output = [];
        for (const p of state.points) { if (state.area && p.area !== state.area) continue; if (matchesSearch(p, search)) output.push(p); }
        return output.sort((a,b) => { const rc = searchResultRank(a,search)-searchResultRank(b,search); return rc !== 0 ? rc : comparePointsByName(a,b); }).slice(0, 50);
      }
      function renderResults(items) {
        results.innerHTML = "";
        if (!items.length) { results.innerHTML='<p class="popup-meta">請輸入設備關鍵字。</p>'; return; }
        for (const p of items) {
          const fragment = resultTemplate.content.cloneNode(true);
          fragment.querySelector("strong").textContent = p.name || "未命名";
          fragment.querySelector("span").textContent = `${p.area||""} / ${p.code||""}`;
          fragment.querySelector("button").addEventListener("click", () => { map.flyTo([p.lat,p.lng],map.getMaxZoom(),{duration:0.45}); L.popup({autoPanPadding:[10,10]}).setLatLng([p.lat,p.lng]).setContent(popupHtml(p)).openOn(map); document.getElementById("mapSearchPanel").classList.remove("is-open"); searchInput.value=""; applyFilter(); });
          results.append(fragment);
        }
      }

      map.on("click", (e) => {
        if (state.displayMode === "prefix") {
          const prefix = state.drawnItems.find(item => { const b=item.hitBox; return b&&e.containerPoint.x>=b.x&&e.containerPoint.x<=b.x+b.width&&e.containerPoint.y>=b.y&&e.containerPoint.y<=b.y+b.height; });
          if (prefix) map.flyTo([prefix.lat,prefix.lng], Math.max(map.getZoom()+2, SHOW_POINTS_ZOOM), {duration:0.45});
        } else {
          if (state.labelsHidden) return;
          let best=null, bestDist=16;
          for (const p of state.visiblePoints.slice(0,6000)) { const dist=map.latLngToContainerPoint([p.lat,p.lng]).distanceTo(e.containerPoint); if (dist<bestDist) { best=p; bestDist=dist; } }
          if (best) L.popup({autoPanPadding:[10,10]}).setLatLng([best.lat,best.lng]).setContent(popupHtml(best)).openOn(map);
        }
      });
      map.on("contextmenu", (e) => {
        const {lat,lng} = e.latlng;
        const code = latLngToTpcCode(lat, lng);
        L.popup({autoPanPadding:[10,10]}).setLatLng([lat,lng]).setContent(popupHtml({lat,lng,name:"手動新增設備",code,area:"自訂"})).openOn(map);
      });

      let locationMarker=null, locationCircle=null, locationWatchId=null;
      document.getElementById("locateButton").addEventListener("click", (e) => {
        if (locationWatchId !== null) {
          navigator.geolocation.clearWatch(locationWatchId); locationWatchId=null;
          if (locationMarker) { map.removeLayer(locationMarker); locationMarker=null; }
          if (locationCircle) { map.removeLayer(locationCircle); locationCircle=null; }
          e.target.classList.remove("is-active"); e.target.textContent="定位"; return;
        }
        if (!navigator.geolocation) { GlobalModal.alert("此瀏覽器不支援定位功能。"); return; }
        e.target.textContent="定位中...";
        locationWatchId = navigator.geolocation.watchPosition(
          (pos) => {
            const latlng = [pos.coords.latitude, pos.coords.longitude];
            if (!locationMarker) { locationMarker=L.circleMarker(latlng,{radius:7,color:"#fff",weight:2,fillColor:"#2563eb",fillOpacity:0.95}).addTo(map); locationCircle=L.circle(latlng,{radius:pos.coords.accuracy||30,color:"#2563eb",weight:1,fillColor:"#2563eb",fillOpacity:0.12}).addTo(map); map.flyTo(latlng, map.getMaxZoom(), {duration:0.45}); }
            else { locationMarker.setLatLng(latlng); locationCircle.setLatLng(latlng).setRadius(pos.coords.accuracy||30); }
            e.target.classList.add("is-active"); e.target.textContent="關閉定位";
          },
          (err) => { e.target.textContent="定位失敗"; console.error("定位錯誤:", err); },
          { enableHighAccuracy: true }
        );
      });

      const DATA_URLS = [
        { meta: "../data/meta.json", points: "../data/points.json" },
        { meta: "data/meta.json", points: "data/points.json" },
        { meta: "https://aertyuloq8.github.io/taipower-equipment-map/data/meta.json", points: "https://aertyuloq8.github.io/taipower-equipment-map/data/points.json" },
      ];
      async function tryFetchData() {
        for (const urls of DATA_URLS) {
          try { const [mr, pr] = await Promise.all([fetch(urls.meta,{cache:"no-cache"}), fetch(urls.points,{cache:"no-cache"})]); if (mr.ok && pr.ok) return { meta: await mr.json(), points: await pr.json() }; }
          catch (e) { console.warn("資料來源嘗試失敗：", urls.meta, e.message); }
        }
        throw new Error("所有資料來源皆無法連線，請檢查網路或資料目錄是否存在。");
      }

      async function init() {
        setStatus("載入設備資料...");
        loadFromLocalStorage(); renderFolders(); updateRecordMarkers();
        try {
          const { meta, points } = await tryFetchData();
          state.meta = meta; state.points = points;
          fillAreas(); renderResults([]);
          map.setView([23.7, 120.95], 8);
          if (state.meta?.bounds) map.fitBounds(state.meta.bounds, { padding: [28,28] });
          renderer.redraw(); setStatus("");
        } catch (e) { console.error(e); setStatus("⚠️ 設備資料載入失敗：" + e.message); }
      }
      init();
    </script>
  </body>
</html>
