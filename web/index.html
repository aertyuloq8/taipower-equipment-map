<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>土木設備分布地圖</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <aside id="panel" class="panel">
        <header class="panel-head">
          <div>
            <p class="eyebrow">免費地圖</p>
            <h1>土木設備分布地圖</h1>
          </div>
          <button id="panelToggle" class="icon-button" type="button" aria-expanded="true" title="收合面板">≡</button>
        </header>

        <section class="stats" aria-label="資料摘要">
          <div>
            <span>總點位</span>
            <strong id="totalCount">--</strong>
          </div>
          <div>
            <span>目前視窗</span>
            <strong id="visibleCount">--</strong>
          </div>
          <div>
            <span>顯示標籤</span>
            <strong id="drawCount">--</strong>
          </div>
        </section>

        <section class="tools" aria-label="地圖工具">
          <label>
            <span>區域</span>
            <select id="areaSelect">
              <option value="">全部區域</option>
            </select>
          </label>

          <label>
            <span>搜尋設備或圖號</span>
            <input id="searchInput" type="search" placeholder="例如 Q1295.Q1395.尖峰.觀音" autocomplete="off" />
          </label>

          <div class="button-row">
            <button id="fitButton" type="button">全圖</button>
            <button id="locateButton" type="button">定位</button>
          </div>
        </section>

        <section class="color-guide" aria-label="標籤顏色說明">
          <h2>標籤顏色</h2>
          <p>縮小時顏色分辨圖號前綴；放大後會依畫面位置替設備中文前綴避色，無中文前綴統一灰色。</p>
          <div class="swatches" aria-hidden="true">
            <span style="--swatch: #0f766e"></span>
            <span style="--swatch: #2563eb"></span>
            <span style="--swatch: #7c3aed"></span>
            <span style="--swatch: #be123c"></span>
            <span style="--swatch: #c2410c"></span>
            <span style="--swatch: #15803d"></span>
            <span style="--swatch: #64748b"></span>
          </div>
        </section>

        <section class="results-wrap">
          <h2>搜尋結果</h2>
          <div id="results" class="results"></div>
        </section>
      </aside>

      <section class="map-shell">
        <div id="map"></div>
        <div id="status" class="status">載入資料中...</div>
      </section>
    </main>

    <template id="resultTemplate">
      <button type="button" class="result-item">
        <strong></strong>
        <span></span>
      </button>
    </template>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
  </body>
</html>
