<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>土木設備分布地圖</title>

    <!-- Leaflet 地圖 CSS：提供地圖底圖、圖層與 Popup 的基本樣式 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- SheetJS：用於讀取 .xlsx/.xls/.csv 與產生匯出的 Excel 檔 -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <style>
      /* ==========================================
       * 全域 CSS 變數
       * 集中定義顏色、陰影、z-index，
       * 後續所有元件使用 var(--xxx) 取用，方便統一調色。
       * ========================================== */
      :root {
        --bg: #eef2f5;           /* 頁面背景色（灰藍） */
        --panel: #ffffff;        /* 左側面板背景（白） */
        --text: #17202a;         /* 主要文字色（深墨） */
        --muted: #687584;        /* 次要文字色（灰） */
        --line: #d9e1e8;         /* 分隔線、邊框色 */
        --accent: #087f8c;       /* 主色調（青綠） */
        --accent-dark: #075d67;  /* 主色深版（hover 用） */
        --amber: #d88922;        /* 琥珀色（儲存按鈕） */
        --red: #bf4e30;          /* 危險色（刪除） */
        --blue: #2563eb;         /* 藍色（定位啟用狀態） */
        --shadow: 0 12px 36px rgba(22, 36, 52, 0.16); /* 面板陰影 */
        --control-z: 900;        /* 浮動控制列 z-index 基準 */
      }

      /* 全域 box-sizing：讓 padding/border 不會撐大元素寬度 */
      * { box-sizing: border-box; }

      /* 讓 html/body/.app 撐滿整個視窗高度 */
      html, body, .app { height: 100%; margin: 0; }

      body {
        background: var(--bg);
        color: var(--text);
        /* 優先使用微軟正黑體，次用 Noto Sans TC，最後用系統字體 */
        font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, -apple-system, sans-serif;
      }

      /* 主版面：左側面板（320~420px）+ 右側地圖（剩餘空間） */
      .app {
        display: grid;
        grid-template-columns: minmax(320px, 420px) 1fr;
        min-width: 0;
        transition: grid-template-columns 180ms ease; /* 面板收合動畫 */
      }
      /* 面板收合時，左欄縮為 0，地圖佔滿全寬 */
      .app.is-panel-collapsed { grid-template-columns: 0 1fr; }

      /* ── 左側資料面板 ──
       * grid-template-rows: 標題區 / 分頁導覽 / 可捲動內容區
       * overflow: hidden 讓子元素自行控制捲動，避免雙重捲軸 */
      .panel {
        background: var(--panel);
        border-right: 1px solid var(--line);
        box-shadow: var(--shadow);
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        min-height: 0;
        overflow: hidden;
        position: relative;
        z-index: 600;
      }
      /* 收合狀態：變透明、不接受點擊，避免遮住地圖 */
      .panel.is-collapsed {
        background: transparent;
        border-right: 0;
        box-shadow: none;
        pointer-events: none;
      }
      .panel.is-collapsed > * { display: none; }

      /* 面板頂部：標題 + 隱藏標籤按鈕，padding-top 留出漢堡按鈕空間 */
      .panel-head {
        align-items: start;
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 64px 18px 12px;
      }
      .panel-title { width: 100%; }

      h1, h2 { margin: 0; }
      h1 { font-size: 24px; line-height: 1.2; }
      h2 { font-size: 14px; }

      /* 所有互動元件的共用基底：邊框、圓角、字體繼承 */
      .icon-button, button, select, input {
        border: 1px solid var(--line);
        border-radius: 6px;
        font: inherit;
        min-height: 38px;
      }
      /* 一般按鈕：主色背景、白字、粗體 */
      button {
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 800;
        padding: 0 12px;
      }
      button:hover { background: var(--accent-dark); }
      button:disabled { cursor: progress; opacity: 0.7; }

      /* 圖示型正方形按鈕（漢堡選單用） */
      .icon-button {
        align-items: center;
        background: #f7fafc;
        color: var(--text);
        display: inline-flex;
        font-size: 20px;
        height: 38px;
        justify-content: center;
        padding: 0;
        width: 38px;
      }

      /* 全幅切換按鈕（隱藏/顯示主圖標籤） */
      .btn-global-toggle {
        width: 100%;
        min-height: 36px;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 6px;
        font-weight: 800;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-global-toggle:hover { background: var(--accent-dark); }
      /* 隱藏狀態時改為灰色，讓使用者知道目前是「隱藏中」 */
      .btn-global-toggle.is-hidden { background: #64748b; }

      /* ── 分頁導覽列 ──
       * 巡視紀錄 / 不良統計 兩個分頁按鈕 */
      .tab-nav {
        display: flex;
        border-bottom: 1px solid var(--line);
        background: #f8fafc;
      }
      .tab-btn {
        flex: 1;
        background: transparent;
        color: var(--muted);
        border: none;
        border-bottom: 3px solid transparent; /* 底線留空，active 才顯示 */
        border-radius: 0;
        min-height: 44px;
        font-size: 14px;
      }
      .tab-btn:hover { background: #f1f5f9; color: var(--text); }
      /* 啟用分頁：白底、主色底線 */
      .tab-btn.is-active {
        background: #fff;
        color: var(--accent-dark);
        border-bottom-color: var(--accent);
      }

      /* 分頁內容：預設隱藏，is-active 才顯示為 flex column */
      .tab-content {
        display: none;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .tab-content.is-active { display: flex; }

      /* ── 搜尋面板統計列（總點位 / 視窗內 / 標籤數） ── */
      .stats {
        display: grid;
        gap: 8px;
        grid-template-columns: repeat(3, 1fr);
        padding: 14px 18px;
      }
      .stats div {
        background: #f7fafc;
        border: 1px solid var(--line);
        border-radius: 8px;
        display: grid;
        gap: 3px;
        min-width: 0;
        padding: 9px;
      }
      .stats span, label span, .result-item span { color: var(--muted); font-size: 12px; }
      .stats strong { font-size: 18px; line-height: 1.2; }

      .tools { border-top: 1px solid var(--line); display: grid; gap: 12px; padding: 14px 18px; }
      label { display: grid; gap: 5px; }
      select, input[type="search"], input[type="text"] {
        background: #fff;
        color: var(--text);
        padding: 0 10px;
        width: 100%;
      }
      .button-row { display: grid; gap: 8px; grid-template-columns: 1fr; }

      /* 搜尋結果包裝區：flex-grow 佔滿剩餘空間，min-height:0 允許縮小 */
      .results-wrap {
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        min-height: 0;
        padding: 12px 18px 18px;
      }
      .results {
        margin-top: 8px;
        min-height: 0;
        overflow-y: auto;
        flex-grow: 1;
        padding-right: 4px;
      }

      /* 搜尋結果單筆按鈕 */
      .result-item {
        background: #fff;
        border: 1px solid var(--line);
        color: var(--text);
        display: grid;
        gap: 4px;
        margin-bottom: 8px;
        min-height: auto;
        padding: 10px;
        text-align: left;
        width: 100%;
      }
      .result-item:hover { background: #eef8f9; color: var(--text); }

      /* ── 巡視紀錄資料夾區塊 ──
       * flex-grow:1 + overflow-y:auto = 佔滿空間且可獨立捲動 */
      .folders-section {
        display: flex;
        flex-direction: column;
        flex-grow: 1;
        min-height: 0;
        padding: 14px 18px 18px;
        overflow-y: auto;
      }
      .folder-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .folder-btn-group { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }

      /* 操作按鈕群組：新增/匯入/備份 */
      .btn-action { flex: 1; min-height: 32px; font-size: 13px; border-radius: 4px; background: #fff; }
      .btn-add-folder  { color: var(--accent); border: 1px dashed var(--accent); }
      .btn-import-csv  { background: #f0fdf4; color: #16a34a; border: 1px dashed #16a34a; }
      .btn-export-json { background: #fffbeb; color: #d97706; border: 1px dashed #d97706; }
      .btn-import-json { background: #fef2f2; color: #dc2626; border: 1px dashed #dc2626; }

      /* 資料夾列表容器：padding-bottom 為底部按鈕列留空間 */
      .folder-list {
        flex-grow: 1;
        min-height: 0;
        padding-right: 4px;
        margin-top: 8px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
        padding-bottom: 40px;
      }

      /* 單一資料夾卡片 */
      .folder-item {
        background: #f8fafc;
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 6px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        transition: background 0.2s;
      }
      .folder-item:hover { background: #f1f5f9; }
      .folder-item-top { display: flex; flex-direction: column; gap: 6px; }
      .folder-item-title-row { display: flex; align-items: center; width: 100%; }

      /* 資料夾名稱（可點擊展開/收合） */
      .folder-name-toggle {
        cursor: pointer;
        user-select: none;
        font-weight: bold;
        font-size: 14px;
        color: var(--text);
        flex-grow: 1;
        padding: 2px 0;
        display: flex;
        align-items: center;
        gap: 4px;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .folder-name-toggle:hover { color: var(--accent); }

      /* 資料夾內的紀錄清單：預設隱藏，展開後顯示 */
      .record-list {
        margin-top: 6px;
        border-top: 1px dashed var(--line);
        padding-top: 6px;
        display: none;
        flex-direction: column;
        gap: 4px;
      }
      .record-list.is-expanded { display: flex; }

      /* 單筆巡視紀錄按鈕 */
      .record-item {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 6px;
        text-align: left;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex-grow: 1;
        min-width: 0;
      }
      .record-item:hover { background: #eef8f9; border-color: var(--accent); }
      .record-item-title {
        font-weight: bold;
        color: var(--accent-dark);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .record-item-meta { font-size: 11px; color: var(--muted); }

      /* 資料夾操作按鈕列（子層/改名/上移/下移/匯出/眼睛/刪除） */
      .folder-actions { display: flex; flex-wrap: wrap; gap: 4px; }
      .btn-small {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--line);
        padding: 4px 8px;
        font-size: 12px;
        min-height: 26px;
        border-radius: 4px;
        font-weight: normal;
        cursor: pointer;
      }
      .btn-small:hover { background: #e2e8f0; color: var(--text); }

      /* 危險操作按鈕（刪除）：紅色強調 */
      .text-danger { color: var(--red) !important; font-weight: bold; }
      .text-danger:hover { background: #fee2e2; }

      /* 批次操作提示列（已棄用，保留相容） */
      .batch-action-bar {
        display: none;
        justify-content: space-between;
        align-items: center;
        background: #fef2f2;
        border: 1px solid #fca5a5;
        padding: 8px 12px;
        border-radius: 6px;
        margin-bottom: 8px;
      }

      /* 無樣式的文字連結按鈕（全部顯示⭐ / 全部隱藏🙈） */
      .text-button {
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
        cursor: pointer;
        font: inherit;
        color: var(--muted);
        min-height: unset;
      }
      .text-button:hover { text-decoration: underline; color: var(--accent); background: transparent; }

      /* ── 地圖區域 ── */
      .map-shell { min-width: 0; position: relative; }

      /* 地圖右上角定位按鈕 */
      .map-locate-button {
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        color: var(--accent-dark);
        min-height: 40px;
        padding: 0 14px;
        position: absolute;
        right: 14px;
        top: 14px;
        z-index: var(--control-z);
      }
      .map-locate-button:hover { background: #eef8f9; }
      /* 定位啟用中：藍底白字 */
      .map-locate-button.is-active { background: var(--blue); border-color: var(--blue); color: #fff; }

      /* Leaflet 地圖容器：撐滿父元素 */
      #map { background: #edf3f5; height: 100%; width: 100%; }

      /* 底部狀態列（載入中 / 錯誤訊息） */
      .status {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--line);
        border-radius: 8px;
        bottom: 18px;
        box-shadow: var(--shadow);
        left: 50%;
        max-width: min(90vw, 620px);
        padding: 9px 12px;
        position: absolute;
        transform: translateX(-50%);
        z-index: 500;
      }
      .status:empty { display: none; } /* 空白時自動隱藏 */

      /* ── Leaflet Popup 樣式 ── */
      .popup-title { font-weight: 900; margin-bottom: 4px; }
      .popup-meta { color: var(--muted); font-size: 12px; line-height: 1.5; }
      .popup-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 6px;
        margin-bottom: 6px;
      }
      .popup-actions a {
        background: var(--accent);
        border-radius: 6px;
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 800;
        min-height: 30px;
        padding: 6px 10px;
        text-decoration: none;
      }

      /* 地圖設備標籤（Leaflet divIcon） */
      .point-label { cursor: pointer; font-size: 12px; font-weight: 800; line-height: 1.15; white-space: nowrap; }
      /* 標籤晶片：左側粗色邊 + 半透明背景，對應設備類型顏色 */
      .point-label-chip {
        background: color-mix(in srgb, var(--label-color) 14%, #ffffff);
        border: 1px solid color-mix(in srgb, var(--label-color) 58%, #ffffff);
        border-left: 5px solid var(--label-color);
        border-radius: 5px;
        box-shadow: 0 2px 8px rgba(21, 38, 54, 0.18);
        color: #12272b;
        display: inline-flex;
        padding: 3px 6px 3px 5px;
      }

      /* Popup 內的巡視紀錄表單 */
      .popup-form {
        margin-top: 6px;
        padding-top: 8px;
        border-top: 1px dashed #ccc;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .popup-form label { font-size: 12px; font-weight: bold; color: var(--text); }
      .popup-form select, .popup-form input { min-height: 28px; padding: 2px 6px; font-size: 12px; margin-top: 2px; }

      /* 儲存紀錄按鈕：琥珀色，全寬 */
      .btn-save-record {
        background: var(--amber);
        color: #fff;
        border: none;
        width: 100%;
        margin-top: 5px;
        font-size: 13px;
        min-height: 32px;
      }
      .btn-save-record:hover { background: #c27a1e; }

      /* ⭐ 已儲存紀錄的地圖標記 */
      .saved-star-marker {
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 16px;
        filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.4));
        cursor: pointer;
      }

      /* ── Popup 版面佈局 ──
       * 直式（預設）：上下排列
       * 橫式（media query）：左右並排 */
      .popup-layout { display: flex; flex-direction: column; }
      .popup-left { margin-bottom: 2px; }
      .popup-right { max-height: 55vh; overflow-y: auto; padding-right: 2px; }

      /* ── Leaflet 彈窗寬度自適應（覆寫 JS 預設固定寬度） ── */
      /* 1. 手機直式：最小 225px，最大螢幕寬 70% */
      .leaflet-popup-content {
        min-width: 225px !important;
        max-width: 70vw !important;
        width: auto !important;
      }
      /* 2. 較大螢幕（≥550px）：給更寬的 340px 最小寬 */
      @media (min-width: 550px) {
        .leaflet-popup-content { min-width: 340px !important; }
      }
      /* 3. 手機橫式（landscape）：強制 420px 並改為左右並排佈局 */
      @media (max-width: 950px) and (max-height: 500px) and (orientation: landscape) {
        .leaflet-popup-content { width: 420px !important; min-width: 420px !important; }
        .popup-layout { flex-direction: row; gap: 12px; align-items: stretch; }
        .popup-left { flex: 1; min-width: 160px; border-right: 1px dashed #ccc; padding-right: 10px; margin-bottom: 0; }
        .popup-right { flex: 1.3; max-height: 75vh; }
        .popup-form { border-top: none; margin-top: 0; padding-top: 0; }
      }

      /* ── 自訂 Modal（取代 alert / confirm / prompt） ──
       * 半透明遮罩 + 模糊背景，z-index 最高確保蓋住地圖與面板 */
      .custom-modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: 10000;
        justify-content: center;
        align-items: center;
        backdrop-filter: blur(2px);
      }
      .custom-modal-box {
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      /* ── 左上角浮動控制列（漢堡 + 搜尋按鈕） ──
       * fixed 定位，z-index 比面板更高 */
      .top-controls {
        position: fixed;
        top: calc(12px + env(safe-area-inset-top, 0px));
        left: calc(10px + env(safe-area-inset-left, 0px));
        z-index: calc(var(--control-z) + 30);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .map-search-btn {
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 8px 20px rgba(22, 36, 52, 0.18);
        color: var(--accent-dark);
        min-height: 38px;
        padding: 0 12px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
      }
      .map-search-btn:hover { background: #eef8f9; color: var(--accent); }

      /* ── 地圖浮動搜尋面板 ──
       * 預設隱藏，點「🔍 搜尋」後加上 is-open 顯示 */
      .map-search-panel {
        position: fixed;
        left: calc(10px + env(safe-area-inset-left, 0px));
        top: calc(60px + env(safe-area-inset-top, 0px));
        z-index: calc(var(--control-z) + 20);
        width: min(360px, calc(100vw - 20px));
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        display: none;
        flex-direction: column;
        max-height: calc(100vh - 80px);
        overflow: hidden;
      }
      .map-search-panel.is-open { display: flex; }
      .map-search-inner {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border-bottom: 1px solid var(--line);
      }
      .map-search-inner select, .map-search-inner input {
        min-height: 34px;
        font-size: 13px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 10px;
        width: 100%;
        background: #fff;
      }
      .map-search-stats { display: flex; gap: 8px; font-size: 11px; color: var(--muted); padding: 6px 12px; }

      /* 搜尋結果列表：flex:1 + min-height:0 讓它自動填滿剩餘高度並允許捲動 */
      .map-search-results { overflow-y: auto; flex: 1; min-height: 0; padding: 0 10px 10px; }
      .map-search-results .result-item { margin-bottom: 6px; }
    </style>
  </head>

  <body>
    <!-- ==========================================
     * 共用彈出視窗 (GlobalModal)
     * 所有 alert / confirm / prompt / select 都統一使用此視窗，
     * 避免瀏覽器原生對話框的樣式不一致問題。
     * ========================================== -->
    <div id="globalModal" class="custom-modal-overlay">
      <div class="custom-modal-box">
        <!-- 標題（由 JS 動態填入） -->
        <h3 id="gmTitle" style="margin-top:0; font-size:18px; font-weight:900; color:var(--text);"></h3>
        <!-- 說明文字（由 JS 動態填入，支援 HTML） -->
        <p id="gmContent" style="margin:10px 0 15px; font-size:14px; color:var(--muted); line-height:1.5;"></p>

        <!-- 文字輸入區（type=prompt 才顯示）：包含文字框 + 日期選擇器 -->
        <div id="gmInputWrapper" style="display:none; flex-direction:column; gap:8px; margin-bottom:15px;">
          <input type="text" id="gmInput"
            style="width:100%; padding:10px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box;" />
          <!-- 日期選擇器：選取後自動把日期字串插入文字框前端 -->
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="font-size:12px; color:var(--muted); font-weight:bold;">📅 插入日期：</span>
            <input type="date" id="gmDateInput"
              style="padding:4px 8px; border:1px solid #ccc; border-radius:4px; font-size:13px; cursor:pointer; color:var(--text); flex-grow:1;" />
          </div>
        </div>

        <!-- 下拉選單（type=select 才顯示） -->
        <select id="gmSelect"
          style="width:100%; padding:10px; margin-bottom:15px; border:1px solid #ccc; border-radius:6px; display:none;"></select>

        <!-- 操作按鈕列（取消 / 確定） -->
        <div style="display:flex; justify-content:flex-end; gap:10px">
          <button id="gmCancelBtn"
            style="padding:8px 16px; background:#e2e8f0; color:#333; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">
            取消
          </button>
          <button id="gmConfirmBtn"
            style="padding:8px 16px; background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">
            確定
          </button>
        </div>
      </div>
    </div>

    <!-- ==========================================
     * 左上角固定控制列
     * 漢堡按鈕（展開/收合面板）+ 搜尋按鈕（開啟浮動搜尋面板）
     * ========================================== -->
    <div class="top-controls">
      <button id="panelToggle" class="icon-button" type="button"
        aria-expanded="false" title="展開面板"
        style="box-shadow:0 8px 20px rgba(22,36,52,0.18)">≡</button>
      <button id="mapSearchToggle" class="map-search-btn" title="搜尋設備">🔍 搜尋</button>
    </div>

    <!-- ==========================================
     * 地圖浮動搜尋面板
     * 可依「區域」下拉 + 「關鍵字/圖號前綴」搜尋設備，
     * 結果點擊後地圖飛轉並開啟 Popup。
     * ========================================== -->
    <div id="mapSearchPanel" class="map-search-panel">
      <div class="map-search-inner">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
          <span style="font-weight:800; font-size:14px; color:var(--accent-dark)">🔍 搜尋設備</span>
          <!-- 關閉搜尋面板 -->
          <button id="mapSearchClose"
            style="background:transparent; color:var(--muted); border:none; min-height:unset; padding:4px 8px; font-size:16px; cursor:pointer;">✕</button>
        </div>
        <!-- 區域篩選下拉（由 fillAreas() 動態填入選項） -->
        <select id="areaSelect"><option value="">全部區域</option></select>
        <!-- 關鍵字搜尋（最少 2 字才觸發，圖號前綴如 Q1295 不受限） -->
        <input id="searchInput" type="search" placeholder="例如 Q1295.Q1395.尖峰" autocomplete="off" />
        <p style="font-size:11px; color:var(--muted); margin:0">💡 右鍵地圖可反推圖號座標並手動新增設備</p>
      </div>
      <!-- 統計列：總點位 / 視窗內 / 標籤數（即時更新） -->
      <div class="map-search-stats">
        <span>總點位 <strong id="totalCount">--</strong></span>
        <span>視窗內 <strong id="visibleCount">--</strong></span>
        <span>標籤數 <strong id="drawCount">--</strong></span>
      </div>
      <!-- 搜尋結果列表（由 renderResults() 動態產生） -->
      <div id="results" class="map-search-results"></div>
    </div>

    <!-- ==========================================
     * 主應用佈局
     * left: #panel（巡視紀錄面板）
     * right: .map-shell（Leaflet 地圖）
     * ========================================== -->
    <main class="app is-panel-collapsed">

      <!-- ── 左側面板 ── -->
      <aside id="panel" class="panel is-collapsed">

        <!-- 面板頂部：標題 + 主圖標籤顯示/隱藏切換 -->
        <header class="panel-head">
          <div class="panel-title"><h1>土木設備分布地圖</h1></div>
          <button id="toggleLabelsBtn" class="btn-global-toggle">隱藏所有主圖標籤</button>
        </header>

        <!-- 分頁導覽：巡視紀錄 / 不良統計 -->
        <nav class="tab-nav">
          <button class="tab-btn is-active" id="tabRecordsBtn">📋 巡視紀錄</button>
          <button class="tab-btn" id="tabStatsBtn">📊 不良統計</button>
        </nav>

        <!-- 搜尋分頁佔位（已移至地圖浮層，此處保留 JS 相容性） -->
        <div id="tabSearch" class="tab-content" style="display:none"></div>

        <!-- ── 不良統計分頁 ──
         * defectStatsContent：由 renderDefectStats() 動態填入
         * 底部固定：頂部/底部捲動按鈕 -->
        <div id="tabStats" class="tab-content" style="flex-direction:column; min-height:0;">
          <div id="defectStatsContent" style="flex:1; overflow-y:auto; padding:14px 18px;"></div>
          <!-- 不良統計分頁的捲動按鈕列（固定在分頁底部，不隨內容捲走） -->
          <div style="flex-shrink:0; display:flex; justify-content:flex-end; gap:6px; padding:8px 12px; border-top:1px solid var(--line); background:#fff;">
            <button id="statsScrollTopBtn" style="min-height:32px; padding:0 14px; font-size:13px; background:#f1f5f9; color:var(--accent-dark); border:1px solid var(--line); border-radius:20px; font-weight:bold;">▲ 頂部</button>
            <button id="statsScrollBotBtn" style="min-height:32px; padding:0 14px; font-size:13px; background:#f1f5f9; color:var(--accent-dark); border:1px solid var(--line); border-radius:20px; font-weight:bold;">▼ 底部</button>
          </div>
        </div>

        <!-- ── 巡視紀錄分頁 ── -->
        <div id="tabRecords" class="tab-content is-active">
          <section class="folders-section" aria-label="巡視紀錄">

            <!-- 全部標記顯示/隱藏控制列 -->
            <div class="folder-header">
              <div style="display:flex; gap:8px; width:100%; justify-content:space-between;">
                <span style="font-weight:bold; font-size:14px">全部地圖標記：</span>
                <div>
                  <button id="showAllStarsBtn" class="text-button" style="font-size:12px; margin-right:8px">全部顯示⭐</button>
                  <button id="hideAllStarsBtn" class="text-button" style="font-size:12px">全部隱藏🙈</button>
                </div>
              </div>
            </div>

            <!-- 新增資料夾 + 匯入 Excel -->
            <div class="folder-btn-group">
              <button id="addFolderBtn" class="btn-action btn-add-folder">+ 新增最上層資料夾</button>
              <button id="importCsvBtn" class="btn-action btn-import-csv" title="支援 .xlsx, .xls, .csv">📥 匯入 Excel</button>
              <!-- 隱藏的檔案選擇器，由 importCsvBtn 觸發 -->
              <input type="file" id="importFileInput" accept=".csv,.xlsx,.xls,.xlsm" style="display:none" />
            </div>

            <!-- 資料備份 + 資料還原 -->
            <div class="folder-btn-group">
              <button id="exportSystemBtn" class="btn-action btn-export-json" title="將所有資料夾與紀錄打包下載">💾 資料備份</button>
              <button id="importSystemBtn" class="btn-action btn-import-json" title="從備份檔還原所有資料">📂 資料還原</button>
              <!-- 隱藏的 JSON 檔案選擇器，由 importSystemBtn 觸發 -->
              <input type="file" id="importSystemInput" accept=".json" style="display:none" />
            </div>

            <!-- 全選列 + 批次操作按鈕（匯出/移動/刪除）
             * batchActionGroup 在有選取項目時才顯示 -->
            <div style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; border:1px solid #cbd5e1; padding:8px 12px; border-radius:6px; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
              <div style="display:flex; align-items:center; gap:8px">
                <!-- 全選/取消全選（由 renderFolders() 動態切換文字與顏色） -->
                <button id="selectAllBtn"
                  style="background:#0f766e; color:white; border:none; padding:6px 12px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer; min-height:0;">
                  全選 ☑️
                </button>
                <span style="color:#b91c1c; font-size:13px; font-weight:bold">
                  已選：<span id="selectedCount">0 項</span>
                </span>
              </div>
              <!-- 批次操作：有選取時才顯示 -->
              <div id="batchActionGroup" style="display:none; gap:6px; flex-wrap:wrap">
                <button id="batchExportBtn" style="background:#16a34a; color:white; border:none; padding:6px 12px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer; min-height:0;">匯出 📤</button>
                <button id="batchMoveBtn"   style="background:#2563eb; color:white; border:none; padding:6px 12px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer; min-height:0;">移動 🚚</button>
                <button id="batchDeleteBtn" style="background:#dc2626; color:white; border:none; padding:6px 12px; border-radius:4px; font-size:12px; font-weight:bold; cursor:pointer; min-height:0;">刪除 🗑️</button>
              </div>
            </div>

            <!-- 資料夾清單（由 renderFolders() 動態產生 HTML） -->
            <div id="folderList" class="folder-list"></div>

          </section>

          <!-- 巡視紀錄分頁的捲動按鈕列（固定在分頁底部，不隨內容捲走） -->
          <div style="flex-shrink:0; display:flex; justify-content:flex-end; gap:6px; padding:8px 12px; border-top:1px solid var(--line); background:#fff;">
            <button id="scrollTopBtn" style="min-height:32px; padding:0 14px; font-size:13px; background:#f1f5f9; color:var(--accent-dark); border:1px solid var(--line); border-radius:20px; font-weight:bold;">▲ 頂部</button>
            <button id="scrollBotBtn" style="min-height:32px; padding:0 14px; font-size:13px; background:#f1f5f9; color:var(--accent-dark); border:1px solid var(--line); border-radius:20px; font-weight:bold;">▼ 底部</button>
          </div>
        </div>
      </aside>

      <!-- ── 右側地圖區域 ── -->
      <section class="map-shell">
        <!-- Leaflet 地圖掛載點 -->
        <div id="map"></div>
        <!-- 右上角定位按鈕 -->
        <button id="locateButton" class="map-locate-button" type="button" aria-pressed="false" title="定位目前位置">定位</button>
        <!-- 底部狀態訊息（載入中 / 失敗訊息） -->
        <div id="status" class="status">載入資料中...</div>
      </section>

    </main>

    <!-- 搜尋結果項目模板：JS 用 cloneNode 複製後填入內容，避免直接操作 DOM -->
    <template id="resultTemplate">
      <button type="button" class="result-item">
        <strong></strong><span></span>
      </button>
    </template>

    <!-- Leaflet 地圖核心函式庫 -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      // ==========================================
      // GlobalModal：自訂彈出視窗控制器
      // 取代瀏覽器原生 alert/confirm/prompt，
      // 支援 alert（提示）、confirm（確認）、prompt（輸入）、select（下拉）四種模式。
      // ==========================================
      const GlobalModal = {
        overlay:      document.getElementById("globalModal"),
        titleEl:      document.getElementById("gmTitle"),
        contentEl:    document.getElementById("gmContent"),
        inputWrapper: document.getElementById("gmInputWrapper"), // prompt 模式時顯示的輸入區塊
        inputEl:      document.getElementById("gmInput"),
        dateInputEl:  document.getElementById("gmDateInput"),    // 日期選擇器（插入日期用）
        selectEl:     document.getElementById("gmSelect"),
        cancelBtn:    document.getElementById("gmCancelBtn"),
        confirmBtn:   document.getElementById("gmConfirmBtn"),

        // show()：核心顯示函式，依 type 決定顯示哪些元件
        show({ title, content, type = "alert", defaultVal = "", selectHtml = "", onConfirm }) {
          this.titleEl.textContent  = title;
          this.contentEl.innerHTML  = content;

          // prompt 模式顯示輸入區塊，其餘隱藏
          this.inputWrapper.style.display = type === "prompt" ? "flex" : "none";
          this.inputEl.value = defaultVal;
          // 每次開啟重置日期選擇器，避免殘留上次的值
          if (this.dateInputEl) this.dateInputEl.value = "";

          // select 模式顯示下拉選單
          this.selectEl.style.display   = type === "select" ? "block" : "none";
          this.selectEl.innerHTML        = selectHtml;
          // alert 模式不需要取消按鈕
          this.cancelBtn.style.display   = type === "alert" ? "none" : "block";

          this.cancelBtn.onclick  = () => { this.overlay.style.display = "none"; };
          this.confirmBtn.onclick = () => {
            this.overlay.style.display = "none";
            if (onConfirm) {
              if (type === "prompt") onConfirm(this.inputEl.value);
              else if (type === "select") onConfirm(this.selectEl.value);
              else onConfirm(true);
            }
          };

          this.overlay.style.display = "flex";
          // prompt 模式自動聚焦輸入框，方便直接輸入
          if (type === "prompt") setTimeout(() => this.inputEl.focus(), 100);
        },

        // 快捷方法
        alert(msg)                   { this.show({ title: "提示",   content: msg, type: "alert" }); },
        confirm(msg, onConfirm)      { this.show({ title: "請確認", content: msg, type: "confirm", onConfirm }); },
        prompt(msg, defaultVal, onConfirm) { this.show({ title: "輸入", content: msg, type: "prompt", defaultVal, onConfirm }); },
        select(title, msg, selectHtml, onConfirm) { this.show({ title, content: msg, type: "select", selectHtml, onConfirm }); },
      };

      // ==========================================
      // 日期選擇器事件：選取日期後自動插入文字框前端
      // 防呆：連續選不同日期時，先移除舊日期再插入新日期，
      // 避免出現 "2026-05-242026-05-25巡視" 這種重複日期。
      // ==========================================
      if (GlobalModal.dateInputEl) {
        GlobalModal.dateInputEl.addEventListener("change", (e) => {
          if (e.target.value) {
            const selectedDate = e.target.value; // YYYY-MM-DD 格式
            // 移除文字框開頭的舊日期（若有）
            const oldTextWithoutDate = GlobalModal.inputEl.value.replace(/^\d{4}-\d{2}-\d{2}/, '');
            GlobalModal.inputEl.value = selectedDate + oldTextWithoutDate;
            // 游標移到最後，方便繼續輸入說明文字
            GlobalModal.inputEl.focus();
            const len = GlobalModal.inputEl.value.length;
            GlobalModal.inputEl.setSelectionRange(len, len);
          }
        });
      }

      // ==========================================
      // 分頁切換：switchTab()
      // 控制「巡視紀錄」與「不良統計」兩個分頁的顯示狀態。
      // 切到統計分頁時自動呼叫 renderDefectStats() 更新資料。
      // ==========================================
      // 保留變數（部分地方仍會用到 tabRecords）
      const tabSearchBtn  = document.getElementById("tabSearchBtn");  // null（已隱藏）
      const tabRecordsBtn = document.getElementById("tabRecordsBtn"); // null（已隱藏）
      const tabSearch  = document.getElementById("tabSearch");
      const tabRecords = document.getElementById("tabRecords");

      function switchTab(tabId) {
        // 先清除所有分頁的 active 狀態
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('is-active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('is-active'));

        if (tabId === 'records') {
          document.getElementById('tabRecordsBtn').classList.add('is-active');
          document.getElementById('tabRecords').classList.add('is-active');
        } else if (tabId === 'stats') {
          document.getElementById('tabStatsBtn').classList.add('is-active');
          document.getElementById('tabStats').classList.add('is-active');
          renderDefectStats(); // 切換時重新計算統計資料
        }
      }

      // 分頁按鈕事件綁定
      document.getElementById('tabRecordsBtn').addEventListener('click', () => switchTab('records'));
      document.getElementById('tabStatsBtn').addEventListener('click',   () => switchTab('stats'));

      // ==========================================
      // 地圖浮動搜尋面板：開啟 / 關閉
      // ==========================================
      const mapSearchPanel = document.getElementById("mapSearchPanel");
      document.getElementById("mapSearchToggle").addEventListener("click", () => {
        mapSearchPanel.classList.toggle("is-open"); // 切換顯示狀態
      });
      document.getElementById("mapSearchClose").addEventListener("click", () => {
        mapSearchPanel.classList.remove("is-open"); // 強制關閉
      });

      // ==========================================
      // 座標轉換：WGS84 → TWD67 TM2（橫麥卡托投影）
      // 用於將 GPS 經緯度轉換為台電圖號所使用的座標系統。
      // 流程：WGS84 弧度 → WGS84 ECEF → Helmert 轉換 → TWD67 ECEF → TWD67 弧度 → TM2
      // ==========================================
      const PI = Math.PI;

      function wgs84ToTwd67Tm2(latDeg, lngDeg) {
        const lat = (latDeg * PI) / 180.0,
              lng = (lngDeg * PI) / 180.0;

        // WGS84 橢球參數
        const a84 = 6378137.0, b84 = 6356752.314245;
        // TWD67 橢球參數
        const a67 = 6378160.0, b67 = 6356774.7192;

        // Step 1: WGS84 弧度 → WGS84 ECEF（地心直角座標）
        const e2_84 = 1 - b84 ** 2 / a84 ** 2;
        const n84 = a84 / Math.sqrt(1 - e2_84 * Math.sin(lat) ** 2);
        const x84 = n84 * Math.cos(lat) * Math.cos(lng),
              y84 = n84 * Math.cos(lat) * Math.sin(lng),
              z84 = n84 * (1 - e2_84) * Math.sin(lat);

        // Step 2: Helmert 七參數轉換 WGS84 → TWD67
        const dx = -752.0, dy = -358.0, dz = -179.0,
              rx = -0.0000011698, ry = 0.0000018398, rz = 0.0000009822, s = 0.00002329;
        const x67 = x84 - dx - s * x84 + rz * y84 - ry * z84,
              y67 = y84 - dy - rz * x84 - s * y84 + rx * z84,
              z67 = z84 - dz + ry * x84 - rx * y84 - s * z84;

        // Step 3: TWD67 ECEF → TWD67 弧度（緯度/經度）
        const e2_67 = 1 - b67 ** 2 / a67 ** 2,
              ep2_67 = (a67 ** 2 - b67 ** 2) / b67 ** 2;
        const p = Math.sqrt(x67 ** 2 + y67 ** 2),
              theta = Math.atan2(z67 * a67, p * b67);
        const lat67 = Math.atan2(z67 + ep2_67 * b67 * Math.sin(theta) ** 3, p - e2_67 * a67 * Math.cos(theta) ** 3),
              lng67 = Math.atan2(y67, x67);

        // Step 4: TWD67 弧度 → TM2 投影座標（中央經線 121°E，縮尺 0.9999）
        const lng0 = (121.0 * PI) / 180.0, k0 = 0.9999,
              e_prime2 = e2_67 / (1.0 - e2_67),
              nu = a67 / Math.sqrt(1.0 - e2_67 * Math.sin(lat67) ** 2),
              p_lon = lng67 - lng0;

        const A = a67 * (1.0 - e2_67 / 4.0 - (3.0 * e2_67 ** 2) / 64.0 - (5.0 * e2_67 ** 3) / 256.0),
              B = a67 * ((3.0 * e2_67) / 8.0 + (3.0 * e2_67 ** 2) / 32.0 + (45.0 * e2_67 ** 3) / 1024.0),
              C = a67 * ((15.0 * e2_67 ** 2) / 256.0 + (45.0 * e2_67 ** 3) / 1024.0),
              D = a67 * ((35.0 * e2_67 ** 3) / 3072.0);
        const M = A * lat67 - B * Math.sin(2.0 * lat67) + C * Math.sin(4.0 * lat67) - D * Math.sin(6.0 * lat67);

        const sinLat = Math.sin(lat67), cosLat = Math.cos(lat67), tanLat = Math.tan(lat67),
              t = tanLat ** 2, c = e_prime2 * cosLat ** 2;

        const tm2_x = k0 * nu * p_lon * cosLat *
          (1.0 + (p_lon ** 2 / 6.0) * cosLat ** 2 * (1.0 - t + c) +
           (p_lon ** 4 / 120.0) * cosLat ** 4 * (5.0 - 18.0 * t + t ** 2 + 72.0 * c - 58.0 * e_prime2));
        const tm2_y = k0 * (M + nu * tanLat *
          ((p_lon ** 2 / 2.0) * cosLat ** 2 +
           (p_lon ** 4 / 24.0) * cosLat ** 4 * (5.0 - t + 9.0 * c + 4.0 * c ** 2) +
           (p_lon ** 6 / 720.0) * cosLat ** 6 * (61.0 - 58.0 * t + t ** 2 + 600.0 * c - 330.0 * e_prime2)));

        return { x: tm2_x + 250000.0, y: tm2_y }; // 加 250000 為東偏（False Easting）
      }

      // ==========================================
      // 台電圖號格字基點座標表
      // 格式：字母 → [TM2 X 起點, TM2 Y 起點]
      // 每格 X 寬 80km（800m × 100格），Y 高 50km（500m × 100格）
      // ==========================================
      const GRID_BASES = {
        A: [170000, 2750000], B: [250000, 2750000], C: [330000, 2750000],
        D: [170000, 2700000], E: [250000, 2700000], F: [330000, 2700000],
        G: [170000, 2650000], H: [250000, 2650000],
        J: [90000,  2600000], K: [170000, 2600000], L: [250000, 2600000],
        M: [90000,  2550000], N: [170000, 2550000], O: [250000, 2550000],
        P: [90000,  2500000], Q: [170000, 2500000], R: [250000, 2500000],
        T: [170000, 2450000], U: [250000, 2450000],
        V: [170000, 2400000], W: [250000, 2400000],
        X: [275000, 2614000], Y: [275000, 2564000],
      };

      // ==========================================
      // TM2 座標 → 台電圖號（11碼）
      // 圖號結構：大格字母(1) + 中格XY(各2碼) + 小格XY(各1字母) + 細格XY(各1碼) + 精細XY(各1碼)
      // ==========================================
      function tm2ToTpc(x, y) {
        let bestBase = "", bx = 0, by = 0;
        for (const [char, [cx, cy]] of Object.entries(GRID_BASES)) {
          const dx = x - cx, dy = y - cy;
          if (dx >= 0 && dx < 80000 && dy >= 0 && dy < 50000) {
            bestBase = char; bx = cx; by = cy; break;
          }
        }
        if (!bestBase) return "座標超出範圍";

        const dx = x - bx, dy = y - by;
        const t2x = String(Math.floor(dx / 800)).padStart(2, "0"),
              t2y = String(Math.floor(dy / 500)).padStart(2, "0");
        const remX = dx % 800, remY = dy % 500;
        const t3x = String.fromCharCode(65 + Math.floor(remX / 100)),
              t3y = String.fromCharCode(65 + Math.floor(remY / 100));
        const rremX = remX % 100, rremY = remY % 100;
        const t5x = String(Math.floor(rremX / 10)), t5y = String(Math.floor(rremY / 10));
        const t99x = String(Math.floor(rremX % 10)), t99y = String(Math.floor(rremY % 10));

        return `${bestBase}${t2x}${t2y}${t3x}${t3y}${t5x}${t5y}${t99x}${t99y}`;
      }

      // GPS 經緯度 → 台電圖號（對外統一入口）
      function latLngToTpcCode(lat, lng) {
        try {
          const { x, y } = wgs84ToTwd67Tm2(lat, lng);
          return tm2ToTpc(x, y);
        } catch (e) {
          // 轉換失敗時以 GPS_ 前綴保存原始座標
          return `GPS_${lat.toFixed(4)}_${lng.toFixed(4)}`;
        }
      }

      // ==========================================
      // 反向座標轉換：台電圖號 → WGS84 經緯度
      // 用於「匯入 Excel 時圖號不在資料庫」的補救措施，
      // 以及「右鍵地圖顯示圖號」的反向驗證。
      // 精度約 ±5m（受圖號末碼解析度限制）。
      // ==========================================
      function tpcCodeToLatLng(code) {
        try {
          const c = code.trim().toUpperCase().replace(/\s+/g, "");
          if (c.length < 9) return null;

          const base = c[0];
          const baseCoords = GRID_BASES[base];
          if (!baseCoords) return null;
          const [bx, by] = baseCoords;

          // 解析各碼段
          const t2x = parseInt(c.slice(1, 3)); // 中格 X
          const t2y = parseInt(c.slice(3, 5)); // 中格 Y
          const t3x = c.charCodeAt(5) - 65;   // 小格 X（A=0, B=1...）
          const t3y = c.charCodeAt(6) - 65;   // 小格 Y
          const t5x = parseInt(c[7]);           // 細格 X
          const t5y = parseInt(c[8]);           // 細格 Y
          if ([t2x, t2y, t3x, t3y, t5x, t5y].some(isNaN)) return null;

          // 第 10、11 碼有填時精確到個位，否則取格子中心（+0.5）
          let t99x = 5, t99y = 5;
          if (c.length >= 11) { t99x = parseInt(c[9]) + 0.5; t99y = parseInt(c[10]) + 0.5; }

          const dx = t2x * 800 + t3x * 100 + t5x * 10 + t99x;
          const dy = t2y * 500 + t3y * 100 + t5y * 10 + t99y;
          const tm2_x_fe = bx + dx; // 含 False Easting 的 TM2 X
          const tm2_y = by + dy;

          // Step 2: 逆 TM 投影 → TWD67 弧度
          const a67 = 6378160.0, b67 = 6356774.7192;
          const e2_67 = 1 - (b67 * b67) / (a67 * a67);
          const e_p2 = e2_67 / (1 - e2_67);
          const k0 = 0.9999, lng0 = (121.0 * PI) / 180.0;

          const A = a67 * (1 - e2_67 / 4 - (3 * e2_67 ** 2) / 64 - (5 * e2_67 ** 3) / 256);
          const M0 = tm2_y / k0, mu = M0 / A;
          const e1 = (1 - Math.sqrt(1 - e2_67)) / (1 + Math.sqrt(1 - e2_67));
          const lat1 = mu
            + ((3 * e1) / 2 - (27 * e1 ** 3) / 32) * Math.sin(2 * mu)
            + ((21 * e1 ** 2) / 16 - (55 * e1 ** 4) / 32) * Math.sin(4 * mu)
            + ((151 * e1 ** 3) / 96) * Math.sin(6 * mu)
            + ((1097 * e1 ** 4) / 512) * Math.sin(8 * mu);

          const sinL1 = Math.sin(lat1), cosL1 = Math.cos(lat1), tanL1 = Math.tan(lat1);
          const N1 = a67 / Math.sqrt(1 - e2_67 * sinL1 ** 2);
          const R1 = (a67 * (1 - e2_67)) / Math.pow(1 - e2_67 * sinL1 ** 2, 1.5);
          const T1 = tanL1 ** 2, C1 = e_p2 * cosL1 ** 2;
          const D = (tm2_x_fe - 250000) / (N1 * k0);

          const lat67 = lat1 - ((N1 * tanL1) / R1) *
            (D ** 2 / 2 - ((5 + 3 * T1 + 10 * C1 - 4 * C1 ** 2 - 9 * e_p2) * D ** 4) / 24
              + ((61 + 90 * T1 + 298 * C1 + 45 * T1 ** 2 - 252 * e_p2 - 3 * C1 ** 2) * D ** 6) / 720);
          const lng67 = lng0 + (D - ((1 + 2 * T1 + C1) * D ** 3) / 6
            + ((5 - 2 * C1 + 28 * T1 - 3 * C1 ** 2 + 8 * e_p2 + 24 * T1 ** 2) * D ** 5) / 120) / cosL1;

          // Step 3: TWD67 弧度 → TWD67 ECEF
          const N67 = a67 / Math.sqrt(1 - e2_67 * Math.sin(lat67) ** 2);
          const x67 = N67 * Math.cos(lat67) * Math.cos(lng67),
                y67 = N67 * Math.cos(lat67) * Math.sin(lng67),
                z67 = N67 * (1 - e2_67) * Math.sin(lat67);

          // Step 4: 逆 Helmert（一階近似）→ WGS84 ECEF
          const dxH = -752.0, dyH = -358.0, dzH = -179.0;
          const rx = -0.0000011698, ry = 0.0000018398, rz = 0.0000009822, s = 0.00002329;
          const x84 = x67 + dxH + s * x67 - rz * y67 + ry * z67,
                y84 = y67 + dyH + rz * x67 + s * y67 - rx * z67,
                z84 = z67 + dzH - ry * x67 + rx * y67 + s * z67;

          // Step 5: WGS84 ECEF → WGS84 弧度 → 度
          const a84 = 6378137.0, b84 = 6356752.314245;
          const e2_84 = 1 - (b84 * b84) / (a84 * a84),
                ep2_84 = (a84 * a84 - b84 * b84) / (b84 * b84);
          const p = Math.sqrt(x84 ** 2 + y84 ** 2),
                theta = Math.atan2(z84 * a84, p * b84);
          const lat84 = Math.atan2(z84 + ep2_84 * b84 * Math.sin(theta) ** 3, p - e2_84 * a84 * Math.cos(theta) ** 3),
                lng84 = Math.atan2(y84, x84);

          return { lat: (lat84 * 180) / PI, lng: (lng84 * 180) / PI };
        } catch (e) {
          return null;
        }
      }

      // ==========================================
      // Leaflet 地圖初始化
      // preferCanvas：大量點位用 Canvas 繪製提升效能
      // maxZoom 21 / maxNativeZoom 19：允許超放大，底圖用 19 級放大補齊
      // ==========================================
      const map = L.map("map", { preferCanvas: true, zoomControl: false, attributionControl: true });
      L.control.zoom({ position: "bottomright" }).addTo(map);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 21,       // 按鈕最高可縮放到 21 級
        maxNativeZoom: 19, // 底圖圖片最高到 19 級，超過則數位放大
        attribution: "© OpenStreetMap",
      }).addTo(map);

      // ── 顯示控制常數 ──
      const SHOW_POINTS_ZOOM   = 15;   // 縮放層級 ≥ 15 才顯示個別點位（否則顯示群組標籤）
      const MAX_POINT_LABELS   = 1200; // 超過此數量不繪製 Leaflet divIcon 標籤（效能保護）
      const MAX_DIRECT_POINTS  = 3500; // 超過此數量改用群組模式（效能保護）
      const STORAGE_KEY        = "taipower_inspection_v7"; // localStorage 金鑰

      // ==========================================
      // 全域狀態物件（state）
      // 集中管理所有動態資料，避免全域變數散落各處。
      // ==========================================
      const state = {
        points:            [],          // 從伺服器載入的所有設備點位
        meta:              null,        // 後設資料（區域清單、邊界等）
        area:              "",          // 目前篩選的區域名稱
        query:             "",          // 目前的搜尋字串
        search:            { prefixes: [], terms: [] }, // 解析後的搜尋條件
        visiblePoints:     [],          // 目前視窗內且符合篩選的點位
        drawnItems:        [],          // Canvas 上實際繪製的項目（點位或群組）
        equipmentColorMap: new Map(),   // 設備名稱前綴 → 顏色對應表
        displayMode:       "prefix",    // "prefix"（群組）或 "point"（個別點位）
        folders:           [],          // 巡視紀錄資料夾清單
        records:           [],          // 巡視紀錄清單
        hiddenRecordFolders: new Set(), // 隱藏星號標記的資料夾 ID 集合
        expandedFolders:   new Set(),   // 展開中的資料夾 ID 集合
        selectedFolders:   new Set(),   // 已勾選的資料夾 ID 集合（批次操作用）
        selectedRecords:   new Set(),   // 已勾選的紀錄 ID 集合（批次操作用）
        labelsHidden:      false,       // 是否隱藏所有主圖標籤
        lastFolderId:      null,        // 最後一次使用的資料夾 ID（下次開啟 Popup 預設選取）
      };

      // ── 常用 DOM 節點快取 ──
      const statusBox        = document.querySelector("#status");
      const folderList       = document.querySelector("#folderList");
      const selectedCountText = document.getElementById("selectedCount");
      const batchActionBar   = document.getElementById("batchActionBar");
      const areaSelect       = document.getElementById("areaSelect");
      const searchInput      = document.getElementById("searchInput");
      const results          = document.getElementById("results");
      const resultTemplate   = document.getElementById("resultTemplate");
      const totalCount       = document.getElementById("totalCount");
      const visibleCount     = document.getElementById("visibleCount");
      const drawCount        = document.getElementById("drawCount");

      // ── Leaflet 圖層 ──
      let labelsLayer  = L.layerGroup().addTo(map);   // 設備名稱標籤（divIcon）
      let recordsLayer = L.featureGroup().addTo(map); // 巡視紀錄星號標記

      // ==========================================
      // 自然排序：數字段按數值比較
      // 例：尖峰1 < 尖峰2 < 尖峰10 < 尖峰11
      // 使用 zh-Hant locale 的 localeCompare numeric 模式
      // ==========================================
      function compareNatural(strA, strB) {
        return strA.localeCompare(strB, "zh-Hant", { numeric: true, sensitivity: "base" });
      }
      function comparePointsByName(a, b) {
        const nameA = a.name || a.code || "";
        const nameB = b.name || b.code || "";
        return compareNatural(nameA, nameB);
      }

      // ==========================================
      // 遞迴資料夾工具函式
      // ==========================================

      // 取得指定資料夾（含所有子層）的全部紀錄
      function getAllRecordsInFolder(folderId) {
        const direct   = state.records.filter(r => r.folderId === folderId);
        const children = state.folders.filter(f => f.parentId === folderId);
        let all = [...direct];
        for (const child of children) all = all.concat(getAllRecordsInFolder(child.id));
        return all;
      }

      // 取得指定資料夾（含所有子層）的全部紀錄 ID
      function getAllRecordIdsInFolder(folderId) {
        return getAllRecordsInFolder(folderId).map(r => r.id);
      }

      // ==========================================
      // 不良項目快捷標籤設定
      // 修改此處即可新增/調整快捷按鈕，不需改其他程式碼。
      // label：群組名稱（顯示在 <summary>）
      // open：預設是否展開
      // items：該群組的快捷選項文字（點選後帶入輸入框）
      // ==========================================
      const DEFECT_GROUPS = [
        { label: "樹修", open: true,  items: ["樹木修剪", "藤蔓清除", "竹枝清除", "椰樹修剪"] },
        { label: "導線", open: false, items: ["防雷脫落", "低壓脫落"] },
        { label: "設計", open: false, items: ["不良", "游休TR", "橫擔腐蝕"] },
        { label: "雜項", open: false, items: ["桿上異物"] },
      ];

      // ==========================================
      // 依路徑字串找到或建立資料夾，傳回最底層資料夾 ID
      // 支援格式：「5月21日」或「5月21日 / 子資料夾 / 孫資料夾」
      // 斜線分隔，逐層確認是否存在，不存在則自動建立。
      // ==========================================
      function findOrCreateFolderByPath(pathStr) {
        const parts = pathStr.split(/\s*\/\s*/).map(s => s.trim()).filter(Boolean);
        if (!parts.length) return null;
        let parentId = null, currentFolder = null;
        for (const part of parts) {
          currentFolder = state.folders.find(f => f.name === part && f.parentId === parentId);
          if (!currentFolder) {
            const newId = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
            currentFolder = { id: newId, name: part, parentId };
            state.folders.push(currentFolder);
            state.expandedFolders.add(newId); // 新建資料夾預設展開
          }
          parentId = currentFolder.id;
        }
        return currentFolder ? currentFolder.id : null;
      }

      // ==========================================
      // 面板展開/收合
      // collapsed=true → 左欄縮為 0，地圖佔滿全寬
      // 220ms 後通知 Leaflet 更新地圖容器尺寸
      // ==========================================
      function setPanelCollapsed(collapsed) {
        document.querySelector("#panel").classList.toggle("is-collapsed", collapsed);
        document.querySelector(".app").classList.toggle("is-panel-collapsed", collapsed);
        window.setTimeout(() => map.invalidateSize(), 220);
      }

      // 漢堡按鈕點擊：切換面板開關
      document.getElementById("panelToggle").addEventListener("click", () => {
        const panel = document.querySelector("#panel");
        const collapsed = !panel.classList.contains("is-collapsed");
        setPanelCollapsed(collapsed);
        document.getElementById("panelToggle").setAttribute("aria-expanded", String(!collapsed));
      });

      // ==========================================
      // jumpToRecord()：從不良統計或 Popup 跳轉至指定紀錄
      // 1. 展開該紀錄所屬的所有祖先資料夾
      // 2. 切換至巡視紀錄分頁
      // 3. 捲動至目標紀錄列並黃底高亮 5 秒
      // ==========================================
      function jumpToRecord(folderId, recordId) {
        // 展開從目標資料夾到根的所有資料夾
        let curr = state.folders.find(f => f.id === folderId);
        while (curr) {
          state.expandedFolders.add(curr.id);
          curr = state.folders.find(f => f.id === curr.parentId);
        }
        map.closePopup();
        setPanelCollapsed(false); // 確保面板開啟（手機版）
        switchTab('records');
        renderFolders();

        setTimeout(() => {
          const row = document.getElementById(`record-row-${recordId}`);
          if (row) {
            row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            row.style.backgroundColor = '#fef08a'; // 黃色高亮
            setTimeout(() => { row.style.backgroundColor = 'transparent'; }, 5000);
          }
        }, 80); // 等待 renderFolders() DOM 更新完成
      }

      // ==========================================
      // LocalStorage 存取
      // 儲存：資料夾、紀錄、最後使用的資料夾 ID
      // 讀取：支援從舊版（v5/v6）自動遷移
      // ==========================================

      function saveToLocalStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            folders:      state.folders,
            records:      state.records,
            lastFolderId: state.lastFolderId, // 記憶最後使用的資料夾，下次開 Popup 預選
          }));
        } catch (e) {
          console.error("儲存失敗:", e);
        }
        renderFolders();       // 更新資料夾清單 UI
        updateRecordMarkers(); // 更新地圖星號標記
      }

      function loadFromLocalStorage() {
        try {
          // 依序嘗試新舊版 key，支援無縫升級
          let dataStr = localStorage.getItem(STORAGE_KEY)
            || localStorage.getItem("taipower_inspection_v6")
            || localStorage.getItem("taipower_inspection_v5");

          if (dataStr) {
            const parsed = JSON.parse(dataStr);
            state.folders = parsed.folders || [];
            state.records = parsed.records || [];
            state.lastFolderId = parsed.lastFolderId || null;

            // 資料遷移：舊版資料夾可能沒有 parentId 欄位
            state.folders.forEach(f => { if (typeof f.parentId === "undefined") f.parentId = null; });
            // 資料遷移：舊版紀錄可能沒有 id 欄位
            state.records.forEach(r => {
              if (!r.id) r.id = "rec_" + Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
            });

            // 備用：若沒存 lastFolderId，用最後一筆紀錄的資料夾代替
            if (!state.lastFolderId && state.records.length > 0) {
              state.lastFolderId = state.records[state.records.length - 1].folderId;
            }

            // 若是從舊版 key 讀取，寫入新版 key
            if (!localStorage.getItem(STORAGE_KEY)) saveToLocalStorage();
          }
        } catch (e) {
          console.error("讀取 localStorage 失敗:", e);
        }
      }

      // ── 工具函式：取得資料夾完整路徑（以「 / 」連接） ──
      function getFullFolderPath(folderId) {
        let path = [], curr = state.folders.find(f => f.id === folderId);
        while (curr) { path.unshift(curr.name); curr = state.folders.find(f => f.id === curr.parentId); }
        return path.join(" / ");
      }

      // ── 工具函式：產生資料夾 <select> HTML（支援縮排顯示階層） ──
      function getFolderOptionsHtml(selectedId = null, excludeFolderId = null, includeRoot = false) {
        let html = includeRoot ? '<option value="">(最上層)</option>' : '<option value="">(請選擇資料夾)</option>';
        function buildOpts(pId, depth) {
          state.folders.filter(f => f.parentId === pId).forEach(f => {
            if (f.id === excludeFolderId) return;
            const prefix = "　".repeat(depth) + (depth > 0 ? "└ " : "");
            const sel = f.id === selectedId ? "selected" : "";
            html += `<option value="${f.id}" ${sel}>${prefix}${escapeHtml(f.name)}</option>`;
            buildOpts(f.id, depth + 1);
          });
        }
        buildOpts(null, 0);
        return html;
      }

      // ── 工具函式：判斷 targetParentId 是否為 folderId 的子孫（防止移動時形成循環） ──
      function isDescendant(targetParentId, folderId) {
        let curr = state.folders.find(f => f.id === targetParentId);
        while (curr) { if (curr.id === folderId) return true; curr = state.folders.find(f => f.id === curr.parentId); }
        return false;
      }

      // ==========================================
      // renderFolders()：重新繪製左側資料夾清單
      // 處理：勾選計數顯示、全選按鈕文字、遞迴建立 HTML、事件委派
      // ==========================================
      function renderFolders() {
        // 清理已刪除的幽靈選取 ID（避免操作不存在的資料）
        for (const id of state.selectedFolders) { if (!state.folders.some(f => f.id === id)) state.selectedFolders.delete(id); }
        for (const id of state.selectedRecords) { if (!state.records.some(r => r.id === id)) state.selectedRecords.delete(id); }

        const folderCount = state.selectedFolders.size;
        const recordCount = state.selectedRecords.size;
        const selCount = folderCount + recordCount;
        const totalItemsCount = state.folders.length + state.records.length;

        // 已選計數文字（明確區分資料夾與紀錄數量）
        let countText = "";
        if (folderCount > 0 && recordCount > 0) countText = `${folderCount} 個資料夾，${recordCount} 筆紀錄`;
        else if (folderCount > 0) countText = `${folderCount} 個資料夾`;
        else if (recordCount > 0) countText = `${recordCount} 筆紀錄`;
        else countText = "0 項";
        selectedCountText.textContent = countText;

        // 有選取時才顯示批次操作按鈕列
        const batchActionGroup = document.getElementById("batchActionGroup");
        if (batchActionGroup) batchActionGroup.style.display = selCount > 0 ? "flex" : "none";

        // 全選按鈕：已全選時切換為「取消」樣式
        const selectAllBtn = document.getElementById("selectAllBtn");
        if (selectAllBtn) {
          if (selCount === totalItemsCount && totalItemsCount > 0) {
            selectAllBtn.textContent = "取消 ❌"; selectAllBtn.style.background = "#64748b";
          } else {
            selectAllBtn.textContent = "全選 ☑️"; selectAllBtn.style.background = "#0f766e";
          }
        }

        // ── 遞迴建立資料夾 HTML ──
        // parentId=null 為最上層，depth 控制縮排與背景色交替
        function buildFoldersHtml(parentId, depth) {
          let html = "";
          const children = state.folders.filter(f => f.parentId === parentId);

          children.forEach(folder => {
            // 直屬紀錄：只取「folderId === 此資料夾 ID」的紀錄（不含子層）
            const directRecords = state.records.filter(r => r.folderId === folder.id);
            // 排序：先按名稱自然排序，同名再按圖號排序
            directRecords.sort((a, b) => {
              const nameA = a.name || "", nameB = b.name || "";
              const cmp = compareNatural(nameA, nameB);
              if (cmp !== 0) return cmp;
              return compareNatural(a.code || "", b.code || "");
            });

            const totalCount  = getAllRecordsInFolder(folder.id).length; // 含子層總數
            const directCount = directRecords.length;
            const isHidden    = state.hiddenRecordFolders.has(folder.id);
            const isExpanded  = state.expandedFolders.has(folder.id);
            const isChecked   = state.selectedFolders.has(folder.id) ? "checked" : "";
            const allDirectSelected = directCount > 0 && directRecords.every(r => state.selectedRecords.has(r.id));

            // ── 直屬紀錄 HTML ──
            let recordsHTML = "";
            if (directCount > 0) {
              // 標題列：顯示筆數 + 全選按鈕
              recordsHTML += `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; padding-bottom:4px; border-bottom:1px dotted #e2e8f0;">
                  <span style="font-size:11px; color:var(--muted);">直屬紀錄 ${directCount} 筆</span>
                  <button class="btn-small" data-select-all-folder="${folder.id}" style="font-size:11px; padding:2px 6px; min-height:0;">
                    ${allDirectSelected ? "取消全選" : "全選"}
                  </button>
                </div>`;
              // 每筆紀錄：勾選框 + 紀錄按鈕（點擊飛轉地圖）+ 刪除按鈕
              recordsHTML += directRecords.map(r => {
                const rChecked = state.selectedRecords.has(r.id) ? "checked" : "";
                return `
                  <div id="record-row-${r.id}" style="display:flex; align-items:center; gap:6px; margin-bottom:4px; padding:4px; border-radius:4px; transition:background-color 1.5s ease;">
                    <input type="checkbox" class="cb-record" data-id="${r.id}" ${rChecked} style="width:16px; height:16px; cursor:pointer; flex-shrink:0;">
                    <button class="record-item" data-fly-lat="${r.lat}" data-fly-lng="${r.lng}" title="飛轉至此設備">
                      <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span class="record-item-title">📍 ${escapeHtml(r.name || r.code)}</span>
                        <span class="btn-small text-danger" data-delete-record="${r.id}" title="刪除此紀錄" style="border:none; padding:2px 4px; min-height:0; margin-left:4px;">✖</span>
                      </div>
                      <span class="record-item-meta">不良: ${escapeHtml(r.defect || "無")} | 緩急: ${escapeHtml(r.urgency || "C")}</span>
                    </button>
                  </div>`;
              }).join("");
            } else {
              recordsHTML = `<div style="font-size:12px; color:#999; padding:4px;">(此層無直屬紀錄)</div>`;
            }

            // 子層資料夾遞迴
            let childrenHTML = "";
            if (isExpanded) childrenHTML = buildFoldersHtml(folder.id, depth + 1);

            // 子層資料夾：左邊框縮排、背景色交替
            const borderLeft = depth > 0 ? "border-left:2px solid #cbd5e1;" : "";
            const marginLeft = depth > 0 ? "10px" : "0px";
            const bg         = depth % 2 === 0 ? "#f8fafc" : "#ffffff";

            // 括號內顯示含子層的總紀錄數
            const hasChildren = state.folders.some(f => f.parentId === folder.id);
            const countLabel  = hasChildren ? `${totalCount} (含子層)` : `${totalCount}`;

            html += `
              <div class="folder-item" style="margin-left:${marginLeft}; ${borderLeft} border-radius:${depth > 0 ? "0 6px 6px 0" : "6px"}; background:${bg}; border-top:1px solid var(--line); border-bottom:1px solid var(--line); border-right:1px solid var(--line);">
                <div class="folder-item-top" style="flex-wrap:wrap;">
                  <div style="display:flex; align-items:center; flex-grow:1; min-width:60%;">
                    <input type="checkbox" class="cb-folder" data-id="${folder.id}" ${isChecked} style="width:16px; height:16px; cursor:pointer; margin-right:6px; flex-shrink:0;">
                    <span class="folder-name-toggle" data-toggle="${folder.id}" title="展開/收合">
                      ${escapeHtml(folder.name)} (${countLabel})
                      <span style="font-size:10px; color:var(--muted); margin-left:4px;">${isExpanded ? "▲" : "▼"}</span>
                    </span>
                  </div>
                  <div class="folder-actions" style="display:flex; flex-wrap:wrap; gap:4px; justify-content:flex-end; margin-top:6px; width:100%;">
                    <button class="btn-small" data-add-sub="${folder.id}" title="新增子層資料夾">➕子層</button>
                    <button class="btn-small" data-rename="${folder.id}" title="重新命名">✏️改名</button>
                    <button class="btn-small" data-move-up="${folder.id}" title="向上移">⬆️</button>
                    <button class="btn-small" data-move-down="${folder.id}" title="向下移">⬇️</button>
                    <button class="btn-small" data-export="${folder.id}" title="匯出此層+子層 Excel">📤匯出</button>
                    <button class="btn-small ${isHidden ? "" : "active-eye"}" data-toggle-visibility="${folder.id}" title="顯示/隱藏">${isHidden ? "🙈" : "👁️"}</button>
                    <button class="btn-small text-danger" data-delete-folder="${folder.id}" title="刪除">✖</button>
                  </div>
                </div>
                <div class="record-list ${isExpanded ? "is-expanded" : ""}" style="margin-left:22px;">
                  ${recordsHTML}
                  ${childrenHTML}
                </div>
              </div>`;
          });
          return html;
        }

        folderList.innerHTML = buildFoldersHtml(null, 0);
      }

      // ==========================================
      // 批次操作事件（匯出、刪除、移動）
      // 使用 Set 收集不重複 ID，避免資料夾與其紀錄被重複計算。
      // ==========================================

      // 批次匯出：收集所有勾選資料夾（含子層）與單獨勾選紀錄，產生 Excel
      document.getElementById("batchExportBtn").addEventListener("click", () => {
        if (state.selectedFolders.size === 0 && state.selectedRecords.size === 0) {
          GlobalModal.alert("請先勾選要匯出的資料夾或紀錄。"); return;
        }
        const uniqueRecordIds = new Set();
        state.selectedFolders.forEach(fId => getAllRecordIdsInFolder(fId).forEach(id => uniqueRecordIds.add(id)));
        state.selectedRecords.forEach(id => uniqueRecordIds.add(id));

        const exportData = [];
        uniqueRecordIds.forEach(rId => {
          const r = state.records.find(x => x.id === rId);
          if (r) exportData.push({
            "巡視日期(目錄)": getFullFolderPath(r.folderId),
            土木設備: r.name || "", 圖號座標: r.code || "",
            不良項目: r.defect || "", 緩急程度: r.urgency || "",
            設計單號: "", 設計日期: "", 施工單位: "", 施工單號: "", 施工日期: "",
          });
        });

        if (exportData.length === 0) { GlobalModal.alert("勾選範圍內沒有紀錄可匯出。"); return; }
        const ws = XLSX.utils.json_to_sheet(exportData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "巡視紀錄");
        XLSX.writeFile(wb, `批次匯出_${new Date().toISOString().slice(0, 10)}.xlsx`);
      });

      // 批次刪除：刪除所有勾選資料夾（含子層）與單獨勾選紀錄
      document.getElementById("batchDeleteBtn").addEventListener("click", () => {
        const uniqueRecordIds = new Set();
        state.selectedFolders.forEach(fId => getAllRecordIdsInFolder(fId).forEach(id => uniqueRecordIds.add(id)));
        state.selectedRecords.forEach(id => uniqueRecordIds.add(id));
        const totalRecords = uniqueRecordIds.size;
        const folderCount  = state.selectedFolders.size;

        GlobalModal.confirm(
          `確定要刪除選取的 ${folderCount} 個資料夾（含子層）與單獨勾選的紀錄嗎？\n共將移除 ${totalRecords} 筆不重複紀錄。`,
          () => {
            // 遞迴刪除資料夾及其所有子層
            function deleteFolderRecursive(fId) {
              state.folders.filter(f => f.parentId === fId).forEach(child => deleteFolderRecursive(child.id));
              state.records = state.records.filter(r => r.folderId !== fId);
              state.folders = state.folders.filter(f => f.id !== fId);
              state.hiddenRecordFolders.delete(fId);
              state.expandedFolders.delete(fId);
            }
            state.selectedFolders.forEach(fId => deleteFolderRecursive(fId));
            state.selectedRecords.forEach(rId => { state.records = state.records.filter(r => r.id !== rId); });
            state.selectedFolders.clear();
            state.selectedRecords.clear();
            saveToLocalStorage();
            renderer.redraw();
          }
        );
      });

      // 批次移動：將勾選的資料夾與紀錄移到指定目標資料夾
      document.getElementById("batchMoveBtn").addEventListener("click", () => {
        GlobalModal.select("🚚 批次移動至...", "請選擇要將勾選項搬移到哪個資料夾：",
          getFolderOptionsHtml(null, null, true),
          (targetId) => {
            const safeTarget = targetId === "" ? null : targetId;

            for (const fId of state.selectedFolders) {
              // 防止移動到自己或子孫（會形成循環）
              if (fId === safeTarget || (safeTarget && isDescendant(safeTarget, fId))) continue;
              const folder = state.folders.find(f => f.id === fId);
              if (folder) folder.parentId = safeTarget;
            }

            // 計算哪些紀錄已隨資料夾移動（不需重複改 folderId）
            const recordsInMovingFolders = new Set();
            state.selectedFolders.forEach(fId => getAllRecordIdsInFolder(fId).forEach(id => recordsInMovingFolders.add(id)));

            for (const rId of state.selectedRecords) {
              if (recordsInMovingFolders.has(rId)) continue; // 已跟隨資料夾移動，跳過
              if (safeTarget === null) { GlobalModal.alert("❌ 設備紀錄必須放置在資料夾內！"); break; }
              const record = state.records.find(r => r.id === rId);
              if (record) record.folderId = safeTarget;
            }

            state.selectedFolders.clear();
            state.selectedRecords.clear();
            saveToLocalStorage();
          }
        );
      });

      // ==========================================
      // 全選按鈕：切換全選 / 取消全選
      // ==========================================
      document.getElementById("selectAllBtn").addEventListener("click", () => {
        const totalItemsCount = state.folders.length + state.records.length;
        const currentSelectedCount = state.selectedFolders.size + state.selectedRecords.size;

        if (currentSelectedCount === totalItemsCount && totalItemsCount > 0) {
          // 已全選 → 清空
          state.selectedFolders.clear(); state.selectedRecords.clear();
        } else {
          // 未全選 → 全選
          state.folders.forEach(f => state.selectedFolders.add(f.id));
          state.records.forEach(r => state.selectedRecords.add(r.id));
        }
        renderFolders();
      });

      // 全部顯示星號 / 全部隱藏星號
      document.getElementById("showAllStarsBtn").addEventListener("click", () => {
        state.hiddenRecordFolders.clear();
        renderFolders(); updateRecordMarkers();
      });
      document.getElementById("hideAllStarsBtn").addEventListener("click", () => {
        state.folders.forEach(f => state.hiddenRecordFolders.add(f.id));
        renderFolders(); updateRecordMarkers();
      });

      // ==========================================
      // 資料夾清單事件委派
      // 統一在 #folderList 上監聽，依 data-* 屬性分派處理。
      // 避免對每個動態生成的元素個別綁定，節省記憶體。
      // ==========================================
      folderList.addEventListener("click", (e) => {
        const target = e.target;

        // ── 展開/收合資料夾（accordion：展開時收合同層其他資料夾）──
        const folderToggle = target.closest("[data-toggle]");
        if (folderToggle) {
          const fId = folderToggle.dataset.toggle;
          const folder = state.folders.find(f => f.id === fId);
          const isExpanding = !state.expandedFolders.has(fId);
          if (isExpanding) {
            // 收合同層的其他資料夾（accordion 行為）
            const siblings = state.folders.filter(f => f.parentId === (folder ? folder.parentId : null));
            siblings.forEach(sib => { if (sib.id !== fId) state.expandedFolders.delete(sib.id); });
            state.expandedFolders.add(fId);
          } else {
            state.expandedFolders.delete(fId);
          }
          renderFolders(); return;
        }

        // ── 資料夾勾選框：向下全選子孫資料夾與紀錄 ──
        if (target.classList.contains("cb-folder")) {
          const fId = target.dataset.id;
          const isChecked = target.checked;

          // 取得所有子孫資料夾 ID（遞迴）
          function getAllDescendantFolderIds(id) {
            let ids = [];
            state.folders.filter(f => f.parentId === id).forEach(child => {
              ids.push(child.id);
              ids = ids.concat(getAllDescendantFolderIds(child.id));
            });
            return ids;
          }
          const descendantFolderIds = getAllDescendantFolderIds(fId);
          const allRecordIds = getAllRecordIdsInFolder(fId);

          if (isChecked) {
            // 打勾：自己 + 所有子孫資料夾 + 所有紀錄
            state.selectedFolders.add(fId);
            descendantFolderIds.forEach(id => state.selectedFolders.add(id));
            allRecordIds.forEach(id => state.selectedRecords.add(id));
          } else {
            // 取消：自己 + 所有子孫資料夾 + 所有紀錄
            state.selectedFolders.delete(fId);
            descendantFolderIds.forEach(id => state.selectedFolders.delete(id));
            allRecordIds.forEach(id => state.selectedRecords.delete(id));
            // 防呆：向上取消所有祖先資料夾的勾選（避免祖先還勾著造成誤刪）
            let curr = state.folders.find(f => f.id === fId);
            while (curr && curr.parentId) {
              state.selectedFolders.delete(curr.parentId);
              curr = state.folders.find(f => f.id === curr.parentId);
            }
          }
          renderFolders(); return;
        }

        // ── 直屬紀錄的全選/取消全選按鈕 ──
        if (target.dataset.selectAllFolder) {
          const fId = target.dataset.selectAllFolder;
          const directRecords = state.records.filter(r => r.folderId === fId);
          const allSelected = directRecords.length > 0 && directRecords.every(r => state.selectedRecords.has(r.id));
          if (allSelected) directRecords.forEach(r => state.selectedRecords.delete(r.id));
          else directRecords.forEach(r => state.selectedRecords.add(r.id));
          renderFolders(); return;
        }

        // ── 單筆紀錄勾選框：向上取消祖先資料夾的勾選 ──
        if (target.classList.contains("cb-record")) {
          const rId = target.dataset.id;
          if (target.checked) {
            state.selectedRecords.add(rId);
          } else {
            state.selectedRecords.delete(rId);
            // 防呆：取消紀錄時，連帶取消所有祖先資料夾的勾選
            const record = state.records.find(r => r.id === rId);
            if (record) {
              let currId = record.folderId;
              while (currId) {
                state.selectedFolders.delete(currId);
                const parentFolder = state.folders.find(f => f.id === currId);
                currId = parentFolder ? parentFolder.parentId : null;
              }
            }
          }
          renderFolders(); return;
        }

        // ── 點擊紀錄按鈕：地圖飛轉至該設備並開啟 Popup ──
        const recordBtn = target.closest(".record-item");
        if (recordBtn && !target.dataset.deleteRecord) {
          const lat = parseFloat(recordBtn.dataset.flyLat),
                lng = parseFloat(recordBtn.dataset.flyLng);
          const point = state.points.find(p => p.lat === lat && p.lng === lng)
                     || state.records.find(r => r.lat === lat && r.lng === lng);
          if (point) {
            map.flyTo([lat, lng], map.getMaxZoom(), { duration: 0.45 });
            L.popup().setLatLng([lat, lng]).setContent(popupHtml(point)).openOn(map);
            if (window.innerWidth <= 820) setPanelCollapsed(true); // 手機版自動收合面板
          }
          return;
        }

        // ── 刪除單筆紀錄 ──
        if (target.dataset.deleteRecord) {
          const rId = target.dataset.deleteRecord;
          GlobalModal.confirm("確定要刪除此筆紀錄嗎？", () => {
            state.records = state.records.filter(r => r.id !== rId);
            state.selectedRecords.delete(rId);
            saveToLocalStorage(); renderer.redraw();
          });
          return;
        }

        // ── 新增子層資料夾 ──
        if (target.dataset.addSub) {
          const pId = target.dataset.addSub;
          GlobalModal.prompt("請輸入子資料夾名稱：", "", (newName) => {
            if (newName && newName.trim()) {
              const newId = Date.now().toString();
              state.folders.push({ id: newId, name: newName.trim(), parentId: pId });
              state.expandedFolders.add(pId);   // 展開父層
              state.expandedFolders.add(newId); // 展開新建的子層
              saveToLocalStorage();
            }
          });
        }
        // ── 重新命名資料夾 ──
        else if (target.dataset.rename) {
          const fId = target.dataset.rename;
          const f = state.folders.find(x => x.id === fId);
          if (!f) return;
          GlobalModal.prompt("重新命名資料夾：", f.name, (newName) => {
            if (newName && newName.trim()) { f.name = newName.trim(); saveToLocalStorage(); }
          });
        }

        // ── 向上/向下移動資料夾（在同層兄弟中交換位置）──
        const moveUpBtn = target.closest("[data-move-up]");
        const moveDownBtn = target.closest("[data-move-down]");
        if (moveUpBtn || moveDownBtn) {
          const btn = moveUpBtn || moveDownBtn;
          const fId = btn.dataset.moveUp || btn.dataset.moveDown;
          const direction = moveUpBtn ? -1 : 1;
          const folder = state.folders.find(f => f.id === fId);
          if (!folder) return;
          const siblings = state.folders.filter(f => f.parentId === folder.parentId);
          const sIdx = siblings.findIndex(f => f.id === fId);
          if (direction === -1 && sIdx > 0) swapInArray(state.folders, fId, siblings[sIdx - 1].id);
          else if (direction === 1 && sIdx < siblings.length - 1) swapInArray(state.folders, fId, siblings[sIdx + 1].id);
          return;
        }
        // ── 切換資料夾星號標記顯示/隱藏（遞迴影響子層）──
        else if (target.dataset.toggleVisibility) {
          const fId = target.dataset.toggleVisibility;
          const nowHidden = state.hiddenRecordFolders.has(fId);
          function getAllDescendantFolderIds(id) {
            const ids = [id];
            state.folders.filter(f => f.parentId === id).forEach(child => getAllDescendantFolderIds(child.id).forEach(cid => ids.push(cid)));
            return ids;
          }
          const affectedIds = getAllDescendantFolderIds(fId);
          if (nowHidden) affectedIds.forEach(id => state.hiddenRecordFolders.delete(id));
          else affectedIds.forEach(id => state.hiddenRecordFolders.add(id));
          renderFolders(); updateRecordMarkers();
        }
        // ── 匯出此資料夾（含子層）為 Excel ──
        else if (target.dataset.export) {
          const fId = target.dataset.export;
          const folder = state.folders.find(f => f.id === fId);
          if (!folder) return;
          const targetRecords = getAllRecordsInFolder(fId);
          const pathName = getFullFolderPath(fId);
          const exportData = targetRecords.map(r => ({
            "巡視日期(目錄)": getFullFolderPath(r.folderId),
            土木設備: r.name || "", 圖號座標: r.code || "",
            不良項目: r.defect || "", 緩急程度: r.urgency || "",
            設計單號: "", 設計日期: "", 施工單位: "", 施工單號: "", 施工日期: "",
          }));
          // 空資料夾仍產生一列標題（方便使用者了解欄位格式）
          if (exportData.length === 0) exportData.push({ "巡視日期(目錄)": pathName, 土木設備: "", 圖號座標: "", 不良項目: "", 緩急程度: "", 設計單號: "", 設計日期: "", 施工單位: "", 施工單號: "", 施工日期: "" });
          const ws = XLSX.utils.json_to_sheet(exportData);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "巡視紀錄");
          XLSX.writeFile(wb, `巡視紀錄_${folder.name}.xlsx`);
        }
        // ── 刪除資料夾（含子層與所有紀錄）──
        else if (target.dataset.deleteFolder) {
          const fId = target.dataset.deleteFolder;
          const folder = state.folders.find(f => f.id === fId);
          if (!folder) return;
          GlobalModal.confirm(`確定要刪除資料夾「${folder.name}」及其中所有紀錄嗎？`, () => {
            state.records = state.records.filter(r => r.folderId !== fId);
            state.folders = state.folders.filter(f => f.id !== fId);
            state.hiddenRecordFolders.delete(fId);
            state.selectedFolders.delete(fId);
            saveToLocalStorage(); renderer.redraw();
          });
        }
      });

      // 交換陣列中兩個元素的位置（用於向上/向下移動資料夾）
      function swapInArray(arr, id1, id2) {
        const idx1 = arr.findIndex(i => i.id === id1),
              idx2 = arr.findIndex(i => i.id === id2);
        if (idx1 < 0 || idx2 < 0) return;
        [arr[idx1], arr[idx2]] = [arr[idx2], arr[idx1]];
        saveToLocalStorage();
      }

      // ── 新增最上層資料夾 ──
      document.querySelector("#addFolderBtn").addEventListener("click", () => {
        GlobalModal.prompt("請輸入新的最上層資料夾名稱：", "", (newName) => {
          if (newName && newName.trim()) {
            const newId = Date.now().toString();
            state.folders.push({ id: newId, name: newName.trim(), parentId: null });
            state.expandedFolders.add(newId);
            saveToLocalStorage();
          }
        });
      });

      // ==========================================
      // 匯入 Excel（.xlsx / .xls / .csv）
      // 欄位格式：巡視日期(目錄) | 土木設備 | 圖號座標 | 不良項目 | 緩急程度
      // 座標解析優先順序：
      //   1. 圖號精確比對資料庫
      //   2. 設備名稱比對資料庫
      //   3. GPS_ 格式直接解析
      //   4. 台電圖號反推座標
      // ==========================================
