      // 設備 popup 內容：顯示設備資訊、既有紀錄提醒、缺失項目與儲存表單。
      function popupHtml(point) {
        const existingRecord = state.records.find(
          (r) => r.lat === point.lat && r.lng === point.lng,
        );
        const allRecordsForPoint = state.records.filter(
          (r) => r.lat === point.lat && r.lng === point.lng,
        );

        let warningHtml = "";
        if (allRecordsForPoint.length > 0) {
          const folderLinks = allRecordsForPoint
            .map((r) => {
              const fId = r.folderId;
              const path = getFullFolderPath(fId);
              return `<span class="goto-folder-link" data-folder-id="${fId}" data-record-id="${r.id}"
                  style="cursor:pointer; text-decoration:underline; color:#b91c1c; margin-right:4px;"
                  title="點擊跳轉至此紀錄">📂 ${escapeHtml(path)}</span>`;
            })
            .join("");
          warningHtml = `<div style="font-size:11px; margin-bottom:6px; font-weight:bold; background:#fff5f5; padding:4px 6px; border-radius:4px; line-height:1.8;">⚠️ 已記錄於：<br>${folderLinks}</div>`;
        }

        const defectVal = existingRecord ? existingRecord.defect || "" : "";
        const nameVal = existingRecord
          ? existingRecord.name || point.name || "手動新增設備"
          : point.name || "手動新增設備";
        const uA =
          existingRecord && existingRecord.urgency === "A" ? "selected" : "";
        const uB =
          existingRecord && existingRecord.urgency === "B" ? "selected" : "";
        const uC =
          !existingRecord ||
          existingRecord.urgency === "C" ||
          (!uA && !uB && !(existingRecord && existingRecord.urgency === "D"))
            ? "selected"
            : "";
        const uD =
          existingRecord && existingRecord.urgency === "D" ? "selected" : "";

        // 緊湊型「輸入框 + 分類收合快捷標籤」
        // 點快捷標籤只會把文字帶入輸入框，不會改變實際儲存格式。
const defectGroupsHtml = DEFECT_GROUPS.map((group) => {
          const chipsHtml = group.items
            .map((opt) => {
              const len = opt.length;
              let line1 = escapeHtml(opt);
              let line2 = "";
              
              // 🧠 智慧斷行：大於等於 3 個字時，依據你要求的邏輯完美切半 (上2下1, 上3下2...)
              if (len >= 3) {
                const cutIndex = Math.ceil(len / 2); // 向上取整，確保上排字數大於等於下排
                line1 = escapeHtml(opt.substring(0, cutIndex));
                line2 = escapeHtml(opt.substring(cutIndex));
              }

              // 🎨 樣式徹底解放：
              // 1. 拿掉任何 nowrap、overflow 裁切屬性。
              // 2. 加上 flex: 1 1 auto; 讓按鈕像水一樣自動填滿、自動換行。
              // 3. 字體統一維持清晰的 13px，不再委屈縮小。
              return `<div class="defect-chip-btn" data-val="${escapeHtml(opt)}"
                style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:4px; cursor:pointer; user-select:none; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:44px; flex: 1 1 auto; padding:6px 8px; box-sizing:border-box;">
                <span style="pointer-events:none; font-size:13px; color:#475569; line-height:1.25; letter-spacing:0.5px;">${line1}</span>
                ${line2 ? `<span style="pointer-events:none; font-size:13px; color:#475569; line-height:1.25; letter-spacing:0.5px; margin-top:2px;">${line2}</span>` : ""}
              </div>`;
            })
            .join("");

          // 🏗️ 外層容器從 display: grid 改為 display: flex; flex-wrap: wrap; 
          // 這是解決版面擠壓的最關鍵設定！
          return `
            <details class="defect-group" ${group.open ? "open" : ""} style="border:1px solid #e2e8f0; border-radius:5px; background:#fff; padding:6px; margin-top:5px;">
              <summary style="cursor:pointer; color:#475569; font-size:13px; font-weight:bold; user-select:none;">
                ${escapeHtml(group.label)} (${group.items.length})
              </summary>
              <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;">
                ${chipsHtml}
              </div>
            </details>
          `;
        }).join("");

        const defectFieldHtml = `
          <input type="text" id="popup-defect-input" 
            value="${escapeHtml(defectVal)}" placeholder="輸入或點選標籤" 
            style="width:100%; min-height:28px; padding:4px 8px; font-size:12px; border:1px solid #94a3b8; border-radius:4px; box-sizing:border-box;">
          ${defectGroupsHtml}
        `;

        // ==========================================
        // 【修改區塊】動態決定預設選中的資料夾
        // 優先度：1. 該點位原本就有的紀錄資料夾 -> 2. 最後一次使用的資料夾 -> 3. 無(請選擇)
        // ==========================================
        const defaultFolderId = existingRecord
          ? existingRecord.folderId
          : state.lastFolderId || null;
        const folderOptsHtml = getFolderOptionsHtml(defaultFolderId);
        // ==========================================

        return `
          <div class="popup-layout">
            <div class="popup-left">
              ${warningHtml}
              <div class="popup-title">${escapeHtml(point.name || "未命名設備")}</div>
              <div class="popup-meta" style="margin-bottom:2px;">圖號：${escapeHtml(point.code || "")}</div>
              <div class="popup-meta" style="margin-bottom:6px;">${point.lat.toFixed(6)}, ${point.lng.toFixed(6)}</div>
              
              <div class="popup-actions" style="margin-bottom:4px; flex-wrap:nowrap;">
                <a href="${googleNavUrl(point)}" target="_blank" rel="noopener" style="flex:1; text-align:center;">🧭 導航</a>
                <a href="${streetViewUrl(point)}" target="_blank" rel="noopener" style="flex:1; text-align:center;">🏙️ 街景</a>
              </div>
            </div>

            <div class="popup-right popup-form">
              <div style="display:flex; flex-direction:column; gap:5px;">
                <label style="font-size:12px; font-weight:bold;">
                  🏷️ 設備名稱
                  <input id="popup-name-input" type="text" value="${escapeHtml(nameVal)}" placeholder="輸入設備名稱" style="width:100%; min-height:32px; padding:4px 8px; font-size:13px; margin-top:3px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
                </label>

                <label style="font-size:12px; font-weight:bold;">
                  📁 存入資料夾
                  <select id="popup-folder" style="width:100%; min-height:32px; padding:4px 6px; font-size:13px; margin-top:3px; border:1px solid #ccc; border-radius:4px;">
                    ${folderOptsHtml}
                  </select>
                </label>
                
                <label style="font-size:12px; font-weight:bold;">
                  🔧 不良項目
                  <div style="margin-top:3px;">${defectFieldHtml}</div>
                </label>
                
                <label style="font-size:12px; font-weight:bold; margin-top:2px;">
                  🚦 緩急程度
                  <select id="popup-urgency" style="width:100%; min-height:32px; padding:4px 6px; font-size:13px; margin-top:3px; border:1px solid #ccc; border-radius:4px;">
                    <option value="A" ${uA}>A：極嚴重不良</option>
                    <option value="B" ${uB}>B：次嚴重不良</option>
                    <option value="C" ${uC}>C：較輕不良</option>
                    <option value="D" ${uD}>D：巡檢當場處理</option>
                  </select>
                </label>
                
                <button class="btn-save-record" data-lat="${point.lat}" data-lng="${point.lng}" data-name="${escapeHtml(point.name || "")}" data-code="${escapeHtml(point.code || "")}" style="margin-top:6px;">
                  💾 儲存紀錄
                </button>
              </div>
            </div>
          </div>
        `;
      }

      // 全頁 click 事件：處理 popup 內的跳轉、快捷缺失標籤與儲存紀錄。
      document.addEventListener("click", (e) => {
        // [新增] 點擊「已記錄於」的資料夾連結 → 切換到巡視紀錄分頁並展開該資料夾
        const gotoLink = e.target.closest(".goto-folder-link");
        if (gotoLink) {
          const fId = gotoLink.dataset.folderId;
          const rId = gotoLink.dataset.recordId; // 取得綁定的紀錄 ID
          if (!fId) return;

          // 展開該資料夾及其所有祖先
          let curr = state.folders.find((f) => f.id === fId);
          while (curr) {
            state.expandedFolders.add(curr.id);
            curr = state.folders.find((f) => f.id === curr.parentId);
          }

          map.closePopup();
          setPanelCollapsed(false); // 確保在手機版時會強制打開左側面板
          switchTab("records");
          renderFolders();

          // 捲動到目標並高亮
          setTimeout(() => {
            const recordRow = document.getElementById(`record-row-${rId}`);
            if (recordRow) {
              // 捲動到畫面中間
              recordRow.scrollIntoView({ behavior: "smooth", block: "center" });
              // 背景瞬間變為黃色高亮
              recordRow.style.backgroundColor = "#fef08a";
              // 1.5秒後利用 CSS transition 慢慢淡出回原本的透明色
              setTimeout(() => {
                recordRow.style.backgroundColor = "transparent";
              }, 5000);
            } else {
              // 如果找不到單筆紀錄(異常)，退回尋找資料夾
              const el = folderList.querySelector(`[data-toggle="${fId}"]`);
              if (el)
                el.closest(".folder-item")?.scrollIntoView({
                  behavior: "smooth",
                  block: "center",
                });
            }
          }, 80);
          return;
        }
        // ==========================================
        // 【新增區塊】監聽不良項目快捷按鈕的點擊
        // ==========================================
        if (e.target.classList.contains("defect-chip-btn")) {
          const inputEl = document.getElementById("popup-defect-input");
          if (inputEl) {
            // 點擊後，直接將按鈕的值帶入文字輸入框
            inputEl.value = e.target.dataset.val;

            // 加入簡單的視覺回饋（點擊時閃爍一下顏色）
            const originalBg = e.target.style.background;
            e.target.style.background = "#bae6fd"; // 亮藍色
            setTimeout(() => {
              e.target.style.background = originalBg;
            }, 150);
          }
          return;
        }

        const defectGroup = e.target.closest(".defect-group");
        if (defectGroup && e.target.tagName === "SUMMARY") {
          setTimeout(() => {
            if (!defectGroup.open) return;
            document.querySelectorAll(".defect-group").forEach((group) => {
              if (group !== defectGroup) group.removeAttribute("open");
            });
          }, 0);
          return;
        }

        // ==========================================
        // 【修改區塊】按下儲存紀錄時，記憶資料夾 ID
        // ==========================================
        if (e.target.classList.contains("btn-save-record")) {
          const btn = e.target;
          const lat = parseFloat(btn.dataset.lat),
            lng = parseFloat(btn.dataset.lng);
          const folderEl = document.getElementById("popup-folder");
          const nameEl = document.getElementById("popup-name-input");
          const defectEl = document.getElementById("popup-defect-input");
          const urgencyEl = document.getElementById("popup-urgency");

          if (!folderEl || !nameEl || !defectEl || !urgencyEl) return;
          const folderId = folderEl.value;
          const customName =
            nameEl.value.trim() || btn.dataset.name || "手動新增設備";
          const defect = defectEl.value.trim();
          const urgency = urgencyEl.value;

          if (!folderId) {
            GlobalModal.alert("請先建立並選擇存放資料夾！");
            return;
          }

          // ── 在此處記憶最後一次使用的資料夾 ──
          state.lastFolderId = folderId;

          state.records = state.records.filter(
            (r) => r.folderId !== folderId || r.lat !== lat || r.lng !== lng,
          );
          state.records.push({
            id:
              "rec_" +
              Date.now().toString(36) +
              Math.random().toString(36).substr(2, 6),
            lat: lat,
            lng: lng,
            name: customName,
            code: btn.dataset.code,
            folderId: folderId,
            defect: defect,
            urgency: urgency,
          });
          saveToLocalStorage();
          map.closePopup();
          switchTab("records");
        }
      });

      // 巡視紀錄標記：依資料夾顯示狀態在地圖上繪製星號標記。
      function updateRecordMarkers() {
        recordsLayer.clearLayers();
        const visibleRecords = state.records.filter(
          (r) => !state.hiddenRecordFolders.has(r.folderId),
        );
        for (const record of visibleRecords) {
          let htmlContent = '<div class="saved-star-marker">⭐</div>';
          let iconAnchor = [10, 10];
          if (state.labelsHidden) {
            const labelColor = colorForEquipmentName(record.name);
            htmlContent = `<div style="display:flex; flex-direction:column; align-items:center; transform: translate(-50%, calc(-100% + 10px)); width: max-content;">
                <span class="point-label-chip" style="--label-color: ${labelColor}; margin-bottom: 2px;">${escapeHtml(record.name || record.code)}</span>
                <div class="saved-star-marker">⭐</div>
              </div>`;
            iconAnchor = [0, 0];
          }
          L.marker([record.lat, record.lng], {
            icon: L.divIcon({
              className: "",
              html: htmlContent,
              iconSize: [0, 0],
              iconAnchor: iconAnchor,
            }),
          })
            .on("click", () => {
              L.popup({ autoPanPadding: [10, 10] })
                .setLatLng([record.lat, record.lng])
                .setContent(popupHtml(record))
                .openOn(map);
            })
            .addTo(recordsLayer);
        }
      }

      // ==========================================
      // 地圖繪圖與核心邏輯
      // ==========================================
      function setStatus(text) {
        statusBox.textContent = text;
      }
      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }
      function formatNumber(value) {
        return new Intl.NumberFormat("zh-TW").format(value);
      }
      function debounce(fn, wait = 180) {
        let timer = 0;
        return (...args) => {
          window.clearTimeout(timer);
          timer = window.setTimeout(() => fn(...args), wait);
        };
      }
      function codePrefix(code) {
        const match = String(code || "")
          .trim()
          .toUpperCase()
          .replace(/\s+/g, "")
          .match(/^([A-Z]\d{4})/);
        return match
          ? match[1]
          : String(code || "")
              .trim()
              .slice(0, 5) || "未知";
      }
      function searchResultRank(point, search) {
        if (hasSearchTerm(point, search.terms)) return 0;
        if (search.prefixes.includes(codePrefix(point.code))) return 1;
        return 2;
      }
      function parseSearchQuery(query) {
        const tokens = String(query || "")
          .trim()
          .split(/[.\s,，、;；|｜/／]+/)
          .map((t) => t.trim())
          .filter(Boolean);
        const prefixes = [];
        const terms = [];
        for (const t of tokens) {
          const n = t.toUpperCase();
          if (/^[A-Z]\d{4}$/.test(n)) {
            if (!prefixes.includes(n)) prefixes.push(n);
          } else {
            terms.push(t.toLowerCase());
          }
        }
        return { prefixes, terms };
      }
      function pointSearchText(point) {
        return `${point.name || ""} ${point.code || ""} ${codePrefix(point.code)}`.toLowerCase();
      }
      function hasSearchTerm(point, terms) {
        if (!terms.length) return false;
        const text = pointSearchText(point);
        return terms.some((term) => text.includes(term));
      }
      function matchesSearch(point, search) {
        if (!search.prefixes.length && !search.terms.length) return true;
        return (
          search.prefixes.includes(codePrefix(point.code)) ||
          hasSearchTerm(point, search.terms)
        );
      }
      function pointInBounds(point, bounds) {
        return (
          point.lat >= bounds.getSouth() &&
          point.lat <= bounds.getNorth() &&
          point.lng >= bounds.getWest() &&
          point.lng <= bounds.getEast()
        );
      }
      function matchesFilters(point) {
        if (state.area && point.area !== state.area) return false;
        return matchesSearch(point, state.search);
      }
      function visibleFilteredPoints() {
        const bounds = map.getBounds();
        const output = [];
        for (const point of state.points) {
          if (pointInBounds(point, bounds) && matchesFilters(point))
            output.push(point);
        }
        return output;
      }

      const EQUIPMENT_COLOR_PALETTE = [
        { color: "#b91c1c", hue: 0 },
        { color: "#2563eb", hue: 220 },
        { color: "#15803d", hue: 145 },
        { color: "#d97706", hue: 35 },
        { color: "#7e22ce", hue: 275 },
        { color: "#0f766e", hue: 175 },
        { color: "#be185d", hue: 335 },
        { color: "#4d7c0f", hue: 95 },
        { color: "#4338ca", hue: 245 },
        { color: "#c2410c", hue: 20 },
        { color: "#047857", hue: 155 },
        { color: "#0e7490", hue: 195 },
        { color: "#a21caf", hue: 295 },
        { color: "#854d0e", hue: 45 },
        { color: "#1d4ed8", hue: 225 },
        { color: "#64748b", hue: 215 },
      ];
      const PREFIX_COLORS = EQUIPMENT_COLOR_PALETTE.map(({ color }) => color);
      const EQUIPMENT_COLOR_HUES = new Map(
        EQUIPMENT_COLOR_PALETTE.map(({ color, hue }) => [color, hue]),
      );
      const NEARBY_EQUIPMENT_THRESHOLD = 220;
      const UNKNOWN_EQUIPMENT_PREFIX = "未分類",
        UNKNOWN_EQUIPMENT_COLOR = "#64748b";
      function hashText(value) {
        let hash = 0;
        for (const char of value) {
          hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
        }
        return hash;
      }
      // 圖號前綴用黃金角度 HSL，確保 Q0158、Q1166、Q1380... 每個都是明顯不同的顏色
      function colorForPrefix(prefix) {
        const h = hashText(prefix);
        const hue = (h * 137.508) % 360;
        const sat = 58 + (h % 22); // 58~80%
        const lit = 30 + (h % 16); // 30~46%，夠深讓白字清晰
        return `hsl(${hue.toFixed(0)}, ${sat}%, ${lit}%)`;
      }
      function equipmentNamePrefix(name) {
        const match = String(name || "")
          .trim()
          .match(/^[\u3400-\u9fff]+/);
        return match ? match[0].slice(0, 4) : UNKNOWN_EQUIPMENT_PREFIX;
      }

      // ==========================================
      // 地圖繪製引擎 (Canvas)
      // ==========================================

      // Canvas 繪圖層：大量點位與圖號群組標籤都在這裡繪製，提升效能。
      const canvasLayer = L.Layer.extend({
        onAdd(currentMap) {
          this.canvas = L.DomUtil.create("canvas", "leaflet-zoom-animated");
          this.canvas.style.pointerEvents = "none";
          this.context = this.canvas.getContext("2d");
          currentMap.getPanes().overlayPane.appendChild(this.canvas);
          currentMap.on("moveend zoomend resize", this.redraw, this);
          this.redraw();
        },
        onRemove(currentMap) {
          L.DomUtil.remove(this.canvas);
          currentMap.off("moveend zoomend resize", this.redraw, this);
        },
        redraw() {
          if (!this.canvas || !state.points.length) return;
          const size = map.getSize();
          const topLeft = map.containerPointToLayerPoint([0, 0]);
          L.DomUtil.setPosition(this.canvas, topLeft);
          this.canvas.width = size.x;
          this.canvas.height = size.y;
          this.canvas.style.width = `${size.x}px`;
          this.canvas.style.height = `${size.y}px`;
          const ctx = this.context;
          ctx.clearRect(0, 0, size.x, size.y);

          if (state.labelsHidden) {
            state.drawnItems = [];
            updateLabels();
            updateStats();
            return;
          }

          state.visiblePoints = visibleFilteredPoints();
          if (
            map.getZoom() >= SHOW_POINTS_ZOOM &&
            state.visiblePoints.length <= MAX_DIRECT_POINTS
          ) {
            state.displayMode = "point";
            state.drawnItems = state.visiblePoints.map((p) => {
              const pixel = map.latLngToContainerPoint([p.lat, p.lng]);
              return {
                type: "point",
                point: p,
                x: pixel.x,
                y: pixel.y,
                count: 1,
              };
            });

            state.equipmentColorMap = buildEquipmentColorMap(state.drawnItems);

            drawPoints(ctx, state.drawnItems);
          } else {
            state.displayMode = "prefix";
            const groups = new Map();
            for (const point of state.visiblePoints) {
              const prefix = codePrefix(point.code);
              let group = groups.get(prefix);
              if (!group) {
                group = {
                  type: "prefix",
                  prefix,
                  count: 0,
                  latSum: 0,
                  lngSum: 0,
                };
                groups.set(prefix, group);
              }
              group.count += 1;
              group.latSum += point.lat;
              group.lngSum += point.lng;
            }
            state.drawnItems = placePrefixLabels(
              [...groups.values()]
                .map((g) => {
                  const lat = g.latSum / g.count;
                  const lng = g.lngSum / g.count;
                  const pixel = map.latLngToContainerPoint([lat, lng]);
                  return { ...g, lat, lng, x: pixel.x, y: pixel.y };
                })
                .sort((a, b) => b.count - a.count),
            );
            drawPrefixLabels(ctx, state.drawnItems);
          }
          updateLabels();
          updateStats();
        },
      });
      const renderer = new canvasLayer().addTo(map);

      // 設備名稱配色：相鄰設備群優先分配高反差色，避免近距離標籤撞色。
      function circularHueDistance(a, b) {
        const diff = Math.abs(a - b) % 360;
        return Math.min(diff, 360 - diff);
      }

      function colorContrastScore(color, usedNeighborColors) {
        if (!usedNeighborColors.length) return 180;
        const hue = EQUIPMENT_COLOR_HUES.get(color) ?? hashText(color) % 360;
        return Math.min(
          ...usedNeighborColors.map((usedColor) =>
            circularHueDistance(
              hue,
              EQUIPMENT_COLOR_HUES.get(usedColor) ?? hashText(usedColor) % 360,
            ),
          ),
        );
      }

      function groupScreenGap(a, b) {
        const dx = Math.max(0, a.minX - b.maxX, b.minX - a.maxX);
        const dy = Math.max(0, a.minY - b.maxY, b.minY - a.maxY);
        return Math.sqrt(dx * dx + dy * dy);
      }

      function buildEquipmentColorMap(items) {
        const groups = new Map();
        for (const item of items) {
          const prefix = equipmentNamePrefix(item.point.name);
          if (prefix === UNKNOWN_EQUIPMENT_PREFIX) continue;
          let group = groups.get(prefix);
          if (!group) {
            group = {
              prefix,
              count: 0,
              xSum: 0,
              ySum: 0,
              minX: item.x,
              maxX: item.x,
              minY: item.y,
              maxY: item.y,
              color: "",
            };
            groups.set(prefix, group);
          }
          group.count += 1;
          group.xSum += item.x;
          group.ySum += item.y;
          group.minX = Math.min(group.minX, item.x);
          group.maxX = Math.max(group.maxX, item.x);
          group.minY = Math.min(group.minY, item.y);
          group.maxY = Math.max(group.maxY, item.y);
        }
        const colorMap = new Map([
          [UNKNOWN_EQUIPMENT_PREFIX, UNKNOWN_EQUIPMENT_COLOR],
        ]);
        const colorUse = new Map(PREFIX_COLORS.map((c) => [c, 0]));
        const sortedGroups = [...groups.values()]
          .map((g) => ({ ...g, x: g.xSum / g.count, y: g.ySum / g.count }))
          .sort((a, b) => b.count - a.count);

        const adjacency = new Map(
          sortedGroups.map((group) => [group.prefix, new Set()]),
        );
        for (let i = 0; i < sortedGroups.length; i++) {
          for (let j = i + 1; j < sortedGroups.length; j++) {
            if (
              groupScreenGap(sortedGroups[i], sortedGroups[j]) <
              NEARBY_EQUIPMENT_THRESHOLD
            ) {
              adjacency.get(sortedGroups[i].prefix).add(sortedGroups[j].prefix);
              adjacency.get(sortedGroups[j].prefix).add(sortedGroups[i].prefix);
            }
          }
        }

        const orderedGroups = [...sortedGroups].sort((a, b) => {
          const degreeDiff =
            adjacency.get(b.prefix).size - adjacency.get(a.prefix).size;
          if (degreeDiff !== 0) return degreeDiff;
          if (b.count !== a.count) return b.count - a.count;
          return compareNatural(a.prefix, b.prefix);
        });

        for (const group of orderedGroups) {
          const usedNeighborColors = [...adjacency.get(group.prefix)]
            .map((prefix) => colorMap.get(prefix))
            .filter(Boolean);
          const start = hashText(group.prefix) % PREFIX_COLORS.length;
          const rankedColors = PREFIX_COLORS.map(
            (_, i) => PREFIX_COLORS[(start + i) % PREFIX_COLORS.length],
          ).sort((a, b) => {
            const contrastDiff =
              colorContrastScore(b, usedNeighborColors) -
              colorContrastScore(a, usedNeighborColors);
            if (contrastDiff !== 0) return contrastDiff;
            return (colorUse.get(a) || 0) - (colorUse.get(b) || 0);
          });
          group.color = rankedColors[0];
          colorMap.set(group.prefix, group.color);
          colorUse.set(group.color, (colorUse.get(group.color) || 0) + 1);
        }
        return colorMap;
      }
      function colorForEquipmentName(name) {
        return (
          state.equipmentColorMap.get(equipmentNamePrefix(name)) ||
          colorForPrefix(equipmentNamePrefix(name))
        );
      }

      function drawPoints(ctx, items) {
        for (const item of items) {
          ctx.beginPath();
          ctx.arc(item.x, item.y, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = colorForEquipmentName(item.point.name);
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
          ctx.stroke();
        }
      }
      // 前綴標籤著色快取（每次 redraw 重新計算）
      let currentPrefixColors = new Map();

      // 圖號群組配色：依目前畫面鄰近關係重新分配顏色，降低相鄰標籤撞色。
      function buildPrefixColorsByProximity(items) {
        // 步驟 1：建立鄰近圖（畫面上距離 < 閾值 px 視為相鄰）
        const THRESHOLD = 160; // px，約等於兩個標籤寬度
        const adj = new Map(items.map((it) => [it.prefix, new Set()]));
        for (let i = 0; i < items.length; i++) {
          for (let j = i + 1; j < items.length; j++) {
            const dx = items[i].x - items[j].x,
              dy = items[i].y - items[j].y;
            if (Math.sqrt(dx * dx + dy * dy) < THRESHOLD) {
              adj.get(items[i].prefix).add(items[j].prefix);
              adj.get(items[j].prefix).add(items[i].prefix);
            }
          }
        }
        // 步驟 2：貪婪著色（鄰居最多的先著色，確保最難的先分配）
        const sorted = [...items].sort(
          (a, b) => adj.get(b.prefix).size - adj.get(a.prefix).size,
        );
        const colorIdx = new Map();
        for (const { prefix } of sorted) {
          const usedIdx = new Set(
            [...adj.get(prefix)]
              .map((n) => colorIdx.get(n))
              .filter((v) => v !== undefined),
          );
          let c = 0;
          while (usedIdx.has(c)) c++;
          colorIdx.set(prefix, c);
        }
        // 步驟 3：色號 → 明顯可分辨的顏色（每 6 個一輪，色相差 60°；亮度/飽和度交錯）
        const result = new Map();
        for (const [prefix, idx] of colorIdx) {
          const hue = (idx * 60 + Math.floor(idx / 6) * 30) % 360; // 環內60°間距，每輪偏移30°
          const sat = 65 + (idx % 3) * 10; // 65 / 75 / 85%
          const lit = 28 + (idx % 2) * 12; // 28 / 40%（深淺交錯讓白字清楚）
          result.set(prefix, `hsl(${hue}, ${sat}%, ${lit}%)`);
        }
        return result;
      }

      // 繪製圖號群組標籤：包含背景色、白色外框、文字與點擊 hitBox。
      function drawPrefixLabels(ctx, items) {
        // 每次重繪前，依當前畫面鄰近關係重新計算色彩分配
        currentPrefixColors = buildPrefixColorsByProximity(items);

        for (const item of items) {
          const color =
            currentPrefixColors.get(item.prefix) || colorForPrefix(item.prefix);
          const label = `${item.prefix} · ${formatNumber(item.count)}`;
          const width = Math.max(74, Math.min(128, 28 + label.length * 7)),
            height = 30;
          const x = item.x - width / 2,
            y = item.y - height / 2;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(x, y, width, height, 8);
          else ctx.rect(x, y, width, height);
          ctx.fillStyle = color;
          ctx.fill();
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#fff";
          ctx.stroke();
          ctx.fillStyle = "#fff";
          ctx.font = "800 12px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(label, item.x, item.y + 0.5);

          item.hitBox = { x, y, width, height };
        }
      }
      function placePrefixLabels(items) {
        const occupied = new Set(),
          output = [],
          gridW = map.getZoom() <= 10 ? 52 : 36,
          gridH = map.getZoom() <= 10 ? 28 : 20;
        for (const item of items) {
          const key = `${Math.floor(item.x / gridW)}:${Math.floor(item.y / gridH)}`;
          if (occupied.has(key)) continue;
          occupied.add(key);
          output.push(item);
          if (output.length >= 900) break;
        }
        return output;
      }
      function updateLabels() {
        labelsLayer.clearLayers();
        if (
          state.labelsHidden ||
          state.displayMode !== "point" ||
          state.visiblePoints.length > MAX_POINT_LABELS
        )
          return;
        for (const point of state.visiblePoints) {
          const labelColor = colorForEquipmentName(point.name);
          L.marker([point.lat, point.lng], {
            icon: L.divIcon({
              className: "point-label",
              html: `<span class="point-label-chip" style="--label-color: ${labelColor}">${escapeHtml(point.name)}</span>`,
              iconSize: null,
              iconAnchor: [-8, 20],
            }),
          })
            .on("click", () => {
              L.popup({ autoPanPadding: [10, 10] })
                .setLatLng([point.lat, point.lng])
                .setContent(popupHtml(point))
                .openOn(map);
            })
            .addTo(labelsLayer);
        }
      }
      function updateStats() {
        totalCount.textContent = formatNumber(state.points.length);
        visibleCount.textContent = formatNumber(
          state.labelsHidden ? 0 : state.visiblePoints.length,
        );
        drawCount.textContent = formatNumber(state.drawnItems.length);
      }
      function fillAreas() {
        for (const area of state.meta?.areas || []) {
          const option = document.createElement("option");
          option.value = area.name;
          option.textContent = `${area.name} (${formatNumber(area.count)})`;
          areaSelect.append(option);
        }
      }

      document
        .getElementById("toggleLabelsBtn")
        .addEventListener("click", (e) => {
          state.labelsHidden = !state.labelsHidden;
          e.target.textContent = state.labelsHidden
            ? "顯示所有主圖標籤"
            : "隱藏所有主圖標籤";
          e.target.classList.toggle("is-hidden", state.labelsHidden);
          renderer.redraw();
          updateRecordMarkers();
        });
      areaSelect.addEventListener("change", applyFilter);
      searchInput.addEventListener("input", debounce(applyFilter, 180));

      // 搜尋篩選：更新區域/關鍵字條件，重繪結果列表與地圖。
      function applyFilter() {
        state.area = areaSelect.value;
        state.query = searchInput.value.trim();
        state.search = parseSearchQuery(state.query);
        renderResults(searchMatches(state.search));
        renderer.redraw();
      }

      // 【已修正】搜尋放寬至單個字元 (例如可以只搜「尖」)
      function searchMatches(search) {
        if (!search.prefixes.length && !search.terms.some((t) => t.length >= 1))
          return [];
        const output = [];
        for (const point of state.points) {
          if (state.area && point.area !== state.area) continue;
          if (matchesSearch(point, search)) output.push(point);
        }
        return output
          .sort((a, b) => {
            const rankCompare =
              searchResultRank(a, search) - searchResultRank(b, search);
            if (rankCompare !== 0) return rankCompare;
            return comparePointsByName(a, b);
          })
          .slice(0, 50);
      }

      function renderResults(items) {
        results.innerHTML = "";
        if (!items.length) {
          results.innerHTML = '<p class="popup-meta">請輸入設備關鍵字。</p>';
          return;
        }
        for (const point of items) {
          const fragment = resultTemplate.content.cloneNode(true);
          fragment.querySelector("strong").textContent = point.name || "未命名";
          fragment.querySelector("span").textContent =
            `${point.area || ""} / ${point.code || ""}`;
          fragment.querySelector("button").addEventListener("click", () => {
            map.flyTo([point.lat, point.lng], map.getMaxZoom(), {
              duration: 0.45,
            });
            L.popup({ autoPanPadding: [10, 10] })
              .setLatLng([point.lat, point.lng])
              .setContent(popupHtml(point))
              .openOn(map);
            document
              .getElementById("mapSearchPanel")
              .classList.remove("is-open");
            searchInput.value = "";
            applyFilter();
          });
          results.append(fragment);
        }
      }

      // 地圖互動：點群組標籤時放大，點設備點位時開啟 popup。
      map.on("click", (e) => {
        if (state.displayMode === "prefix") {
          const prefix = state.drawnItems.find((item) => {
            const b = item.hitBox;
            return (
              b &&
              e.containerPoint.x >= b.x &&
              e.containerPoint.x <= b.x + b.width &&
              e.containerPoint.y >= b.y &&
              e.containerPoint.y <= b.y + b.height
            );
          });
          if (prefix)
            map.flyTo(
              [prefix.lat, prefix.lng],
              Math.max(map.getZoom() + 2, SHOW_POINTS_ZOOM),
              { duration: 0.45 },
            );
        } else {
          if (state.labelsHidden) return;
          let best = null,
            bestDist = 16;
          for (const point of state.visiblePoints.slice(0, 6000)) {
            const dist = map
              .latLngToContainerPoint([point.lat, point.lng])
              .distanceTo(e.containerPoint);
            if (dist < bestDist) {
              best = point;
              bestDist = dist;
            }
          }
          if (best)
            L.popup({ autoPanPadding: [10, 10] })
              .setLatLng([best.lat, best.lng])
              .setContent(popupHtml(best))
              .openOn(map);
        }
      });
      map.on("contextmenu", (e) => {
        const { lat, lng } = e.latlng;
        const code = latLngToTpcCode(lat, lng);
        const point = {
          lat,
          lng,
          name: "手動新增設備",
          code: code,
          area: "自訂",
        };
        L.popup({ autoPanPadding: [10, 10] })
          .setLatLng([lat, lng])
          .setContent(popupHtml(point))
          .openOn(map);
      });

      let locationMarker = null,
        locationCircle = null,
        locationWatchId = null;

      // 定位功能：使用瀏覽器 Geolocation 顯示目前位置與精度範圍。
      document.getElementById("locateButton").addEventListener("click", (e) => {
        if (locationWatchId !== null) {
          navigator.geolocation.clearWatch(locationWatchId);
          locationWatchId = null;
          if (locationMarker) {
            map.removeLayer(locationMarker);
            locationMarker = null;
          }
          if (locationCircle) {
            map.removeLayer(locationCircle);
            locationCircle = null;
          }
          e.target.classList.remove("is-active");
          e.target.textContent = "定位";
          return;
        }
        if (!navigator.geolocation) {
          GlobalModal.alert("此瀏覽器不支援定位功能。");
          return;
        }
        e.target.textContent = "定位中...";
        locationWatchId = navigator.geolocation.watchPosition(
          (pos) => {
            const latlng = [pos.coords.latitude, pos.coords.longitude];
            if (!locationMarker) {
              locationMarker = L.circleMarker(latlng, {
                radius: 7,
                color: "#fff",
                weight: 2,
                fillColor: "#2563eb",
                fillOpacity: 0.95,
              }).addTo(map);
              locationCircle = L.circle(latlng, {
                radius: pos.coords.accuracy || 30,
                color: "#2563eb",
                weight: 1,
                fillColor: "#2563eb",
                fillOpacity: 0.12,
              }).addTo(map);
              map.flyTo(latlng, map.getMaxZoom(), { duration: 0.45 });
            } else {
              locationMarker.setLatLng(latlng);
              locationCircle
                .setLatLng(latlng)
                .setRadius(pos.coords.accuracy || 30);
            }
            e.target.classList.add("is-active");
            e.target.textContent = "關閉定位";
          },
          (err) => {
            e.target.textContent = "定位失敗";
            console.error("定位錯誤:", err);
          },
          { enableHighAccuracy: true },
        );
      });

      // 資料來源：優先讀本機 data 目錄，失敗時改讀 GitHub Pages 備援資料。
      const DATA_URLS = [
        { meta: "../data/meta.json", points: "../data/points.json" },
        { meta: "data/meta.json", points: "data/points.json" },
        {
          meta: "https://aertyuloq8.github.io/taipower-equipment-map/data/meta.json",
          points:
            "https://aertyuloq8.github.io/taipower-equipment-map/data/points.json",
        },
      ];

      async function tryFetchData() {
        for (const urls of DATA_URLS) {
          try {
            const [metaRes, pointsRes] = await Promise.all([
              fetch(urls.meta, { cache: "no-cache" }),
              fetch(urls.points, { cache: "no-cache" }),
            ]);
            if (metaRes.ok && pointsRes.ok) {
              return {
                meta: await metaRes.json(),
                points: await pointsRes.json(),
              };
            }
          } catch (e) {
            console.warn("資料來源嘗試失敗，切換備用：", urls.meta, e.message);
          }
        }
        throw new Error(
          "所有資料來源皆無法連線，請檢查網路或資料目錄是否存在。",
        );
      }

      // 啟動流程：讀取本機紀錄、載入設備資料、初始化地圖與統計資訊。
      async function init() {
        setStatus("載入設備資料...");
        loadFromLocalStorage();
        renderFolders();
        updateRecordMarkers();

        try {
          const { meta, points } = await tryFetchData();
          state.meta = meta;
          state.points = points;

          fillAreas();
          renderResults([]);
          map.setView([23.7, 120.95], 8);
          if (state.meta?.bounds)
            map.fitBounds(state.meta.bounds, { padding: [28, 28] });
          renderer.redraw();
          setStatus("");
        } catch (e) {
          console.error(e);
          setStatus("⚠️ 設備資料載入失敗：" + e.message);
        }
      }

      init();
    </script>
  </body>
</html>
