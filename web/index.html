      document.querySelector("#importCsvBtn").addEventListener("click", () => document.querySelector("#importFileInput").click());
      document.querySelector("#importFileInput").addEventListener("change", (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (event) {
          try {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, raw: false });
            let importedCount = 0, skippedCount = 0, manualCount = 0;
            let skipHeader = true;

            for (const row of rows) {
              if (skipHeader) { skipHeader = false; continue; } // 跳過標題列
              if (!row || row.length < 3) continue;

              const folderPath = String(row[0] || "").trim();
              const name       = String(row[1] || "").trim();
              const code       = String(row[2] || "").trim();
              const defect     = String(row[3] || "").trim();
              const urgency    = String(row[4] || "C").trim();
              if (!folderPath || !name) continue;

              let resolvedLat = null, resolvedLng = null, resolvedName = name, resolvedCode = code;

              // 優先 1：圖號比對（圖號唯一性最高）
              let point = code ? state.points.find(p => (p.code || "") === code) : null;
              // 優先 2：名稱比對（圖號空白或不在資料庫）
              if (!point && name) point = state.points.find(p => (p.name || "") === name);

              if (point) {
                resolvedLat = point.lat; resolvedLng = point.lng;
                resolvedName = point.name || name; resolvedCode = point.code || code;
              } else {
                // 優先 3：GPS_ 格式直接解析（手動新增的點位）
                const gpsMatch = code.match(/^GPS_([\d.]+)_([\d.]+)$/i);
                if (gpsMatch) {
                  resolvedLat = parseFloat(gpsMatch[1]); resolvedLng = parseFloat(gpsMatch[2]);
                  resolvedCode = code; resolvedName = name; manualCount++;
                } else {
                  // 優先 4：台電圖號反推座標（圖號不在資料庫但格式正確）
                  const reversed = tpcCodeToLatLng(code);
                  if (reversed) {
                    resolvedLat = reversed.lat; resolvedLng = reversed.lng;
                    resolvedCode = code; resolvedName = name; skippedCount++;
                  } else {
                    // 圖號格式無法解析，略過此列
                    skippedCount++; continue;
                  }
                }
              }

              const folderId = findOrCreateFolderByPath(folderPath);
              if (!folderId) continue;

              // 同一資料夾 + 同一座標 → 更新既有紀錄，否則新增
              const existingIndex = state.records.findIndex(r => r.folderId === folderId && r.lat === resolvedLat && r.lng === resolvedLng);
              const recordData = {
                id: existingIndex >= 0 ? state.records[existingIndex].id : "rec_" + Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                lat: resolvedLat, lng: resolvedLng,
                name: resolvedName, code: resolvedCode,
                folderId, defect, urgency,
              };
              if (existingIndex >= 0) state.records[existingIndex] = recordData;
              else state.records.push(recordData);
              importedCount++;
            }

            saveToLocalStorage();
            let msg = `✅ 匯入完成！成功匯入/更新 ${importedCount} 筆紀錄`;
            if (manualCount > 0) msg += `（含 ${manualCount} 筆 GPS 手動點位）`;
            msg += `。`;
            if (skippedCount > 0) msg += `\n📐 有 ${skippedCount} 筆不在資料庫，已用圖號反推座標自動補全。`;
            GlobalModal.alert(msg);
          } catch (err) {
            GlobalModal.alert("讀取檔案失敗！請確認格式是否正確。\n" + err.message);
          }
          e.target.value = ""; // 清除選取，允許重複選同一檔案
        };
        reader.readAsArrayBuffer(file);
      });

      // ==========================================
      // 資料備份與還原
      // 備份：將 state.folders + state.records 序列化為 JSON 下載
      // 還原：讀取 JSON 檔，覆蓋現有資料（有確認提示）
      // ==========================================
      document.getElementById("exportSystemBtn").addEventListener("click", () => {
        const data = JSON.stringify({ folders: state.folders, records: state.records }, null, 2);
        const blob = new Blob([data], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `資料備份_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });

      document.getElementById("importSystemBtn").addEventListener("click", () => document.getElementById("importSystemInput").click());
      document.getElementById("importSystemInput").addEventListener("change", (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = function (event) {
          try {
            const parsed = JSON.parse(event.target.result);
            if (!parsed.folders || !parsed.records) throw new Error("格式錯誤");
            GlobalModal.confirm("⚠️ 確定要還原備份嗎？現有資料將被覆蓋！", () => {
              state.folders = parsed.folders; state.records = parsed.records;
              state.hiddenRecordFolders.clear(); state.expandedFolders.clear();
              state.selectedFolders.clear(); state.selectedRecords.clear();
              saveToLocalStorage(); renderer.redraw();
              GlobalModal.alert("還原成功！");
            });
          } catch (err) { GlobalModal.alert("還原失敗：" + err.message); }
          e.target.value = "";
        };
        reader.readAsText(file);
      });

      // ==========================================
      // Popup 相關函式
      // ==========================================

      // 產生 Google 導航連結（目的地為設備座標）
      function googleNavUrl(point) { return `https://www.google.com/maps/dir/?api=1&destination=${point.lat},${point.lng}`; }
      // 產生 Google 街景連結（視角指向設備座標）
      function streetViewUrl(point) { return `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${point.lat},${point.lng}`; }

      // ==========================================
      // popupHtml()：產生設備 Popup 的完整 HTML
      // 包含：已記錄提醒、設備資訊、導航/街景連結、
      //       設備名稱輸入、資料夾選擇、不良項目（快捷標籤）、緩急程度、儲存按鈕
      // ==========================================
      function popupHtml(point) {
        // 查詢此座標是否已有紀錄（用於預填表單與顯示提醒）
        const existingRecord    = state.records.find(r => r.lat === point.lat && r.lng === point.lng);
        const allRecordsForPoint = state.records.filter(r => r.lat === point.lat && r.lng === point.lng);

        // 已有紀錄時，顯示資料夾連結提醒（可點擊跳轉）
        let warningHtml = "";
        if (allRecordsForPoint.length > 0) {
          const folderLinks = allRecordsForPoint.map(r => {
            const path = getFullFolderPath(r.folderId);
            return `<span class="goto-folder-link" data-folder-id="${r.folderId}" data-record-id="${r.id}"
              style="cursor:pointer; text-decoration:underline; color:#b91c1c; margin-right:4px;"
              title="點擊跳轉至此紀錄">📂 ${escapeHtml(path)}</span>`;
          }).join("");
          warningHtml = `<div style="font-size:11px; margin-bottom:6px; font-weight:bold; background:#fff5f5; padding:4px 6px; border-radius:4px; line-height:1.8;">⚠️ 已記錄於：<br>${folderLinks}</div>`;
        }

        // 預填值：優先使用既有紀錄，否則用點位資料
        const defectVal = existingRecord ? existingRecord.defect || "" : "";
        const nameVal   = existingRecord ? existingRecord.name || point.name || "手動新增設備" : point.name || "手動新增設備";
        const uA = existingRecord && existingRecord.urgency === "A" ? "selected" : "";
        const uB = existingRecord && existingRecord.urgency === "B" ? "selected" : "";
        const uC = (!existingRecord || existingRecord.urgency === "C" || (!uA && !uB && !(existingRecord && existingRecord.urgency === "D"))) ? "selected" : "";
        const uD = existingRecord && existingRecord.urgency === "D" ? "selected" : "";

        // ── 不良項目快捷標籤 HTML ──
        // DEFECT_GROUPS 陣列 → <details> 群組 → 晶片按鈕
        // 點晶片 → 帶入文字輸入框（不直接儲存）
        const defectGroupsHtml = DEFECT_GROUPS.map(group => {
          const chipsHtml = group.items.map(opt => {
            const len = opt.length;
            let line1 = escapeHtml(opt), line2 = "";
            // 3字以上時上下各半斷行（向上取整確保上排 ≥ 下排）
            if (len >= 3) {
              const cutIndex = Math.ceil(len / 2);
              line1 = escapeHtml(opt.substring(0, cutIndex));
              line2 = escapeHtml(opt.substring(cutIndex));
            }
            return `<div class="defect-chip-btn" data-val="${escapeHtml(opt)}"
              style="background:#f8fafc; border:1px solid #cbd5e1; border-radius:4px; cursor:pointer; user-select:none; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:44px; flex:1 1 auto; padding:6px 8px; box-sizing:border-box;">
              <span style="pointer-events:none; font-size:13px; color:#475569; line-height:1.25; letter-spacing:0.5px;">${line1}</span>
              ${line2 ? `<span style="pointer-events:none; font-size:13px; color:#475569; line-height:1.25; letter-spacing:0.5px; margin-top:2px;">${line2}</span>` : ""}
            </div>`;
          }).join("");

          // flex-wrap: wrap 讓晶片自動換行，不受固定格數限制
          return `
            <details class="defect-group" ${group.open ? "open" : ""} style="border:1px solid #e2e8f0; border-radius:5px; background:#fff; padding:6px; margin-top:5px;">
              <summary style="cursor:pointer; color:#475569; font-size:13px; font-weight:bold; user-select:none;">
                ${escapeHtml(group.label)} (${group.items.length})
              </summary>
              <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;">${chipsHtml}</div>
            </details>`;
        }).join("");

        const defectFieldHtml = `
          <input type="text" id="popup-defect-input" value="${escapeHtml(defectVal)}" placeholder="輸入或點選標籤"
            style="width:100%; min-height:28px; padding:4px 8px; font-size:12px; border:1px solid #94a3b8; border-radius:4px; box-sizing:border-box;">
          ${defectGroupsHtml}`;

        // 預設選取資料夾優先順序：
        //   1. 此設備已有紀錄 → 使用原本的資料夾
        //   2. 最後一次使用的資料夾（state.lastFolderId）
        //   3. 無（顯示「請選擇資料夾」）
        const defaultFolderId = existingRecord ? existingRecord.folderId : (state.lastFolderId || null);
        const folderOptsHtml  = getFolderOptionsHtml(defaultFolderId);

        return `
          <div class="popup-layout">
            <div class="popup-left">
              ${warningHtml}
              <div class="popup-title">${escapeHtml(point.name || "未命名設備")}</div>
              <div class="popup-meta" style="margin-bottom:2px;">圖號：${escapeHtml(point.code || "")}</div>
              <div class="popup-meta" style="margin-bottom:6px;">${point.lat.toFixed(6)}, ${point.lng.toFixed(6)}</div>
              <div class="popup-actions" style="margin-bottom:4px; flex-wrap:nowrap;">
                <a href="${googleNavUrl(point)}" target="_blank" rel="noopener" style="flex:1; text-align:center;">🧭 導航</a>
                <a href="${streetViewUrl(point)}" target="_blank" rel="noopener" style="flex:1; text-align:center;">🏙️ 街景</a>
              </div>
            </div>
            <div class="popup-right popup-form">
              <div style="display:flex; flex-direction:column; gap:5px;">
                <label style="font-size:12px; font-weight:bold;">
                  🏷️ 設備名稱
                  <input id="popup-name-input" type="text" value="${escapeHtml(nameVal)}" placeholder="輸入設備名稱"
                    style="width:100%; min-height:32px; padding:4px 8px; font-size:13px; margin-top:3px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
                </label>
                <label style="font-size:12px; font-weight:bold;">
                  📁 存入資料夾
                  <select id="popup-folder" style="width:100%; min-height:32px; padding:4px 6px; font-size:13px; margin-top:3px; border:1px solid #ccc; border-radius:4px;">
                    ${folderOptsHtml}
                  </select>
                </label>
                <label style="font-size:12px; font-weight:bold;">
                  🔧 不良項目
                  <div style="margin-top:3px;">${defectFieldHtml}</div>
                </label>
                <label style="font-size:12px; font-weight:bold; margin-top:2px;">
                  🚦 緩急程度
                  <select id="popup-urgency" style="width:100%; min-height:32px; padding:4px 6px; font-size:13px; margin-top:3px; border:1px solid #ccc; border-radius:4px;">
                    <option value="A" ${uA}>A：極嚴重不良</option>
                    <option value="B" ${uB}>B：次嚴重不良</option>
                    <option value="C" ${uC}>C：較輕不良</option>
                    <option value="D" ${uD}>D：巡檢當場處理</option>
                  </select>
                </label>
                <button class="btn-save-record" data-lat="${point.lat}" data-lng="${point.lng}"
                  data-name="${escapeHtml(point.name || "")}" data-code="${escapeHtml(point.code || "")}"
                  style="margin-top:6px;">💾 儲存紀錄</button>
              </div>
            </div>
          </div>`;
      }

      // ==========================================
      // 全頁 click 事件委派
      // 集中處理所有動態生成元素的點擊，按順序判斷類型：
      // 1. 不良統計列展開/收合（accordion）
      // 2. 不良統計紀錄跳轉
      // 3. Popup 已記錄連結跳轉
      // 4. 不良快捷晶片點選
      // 5. 快捷群組 accordion
      // 6. 儲存紀錄按鈕
      // ==========================================
      document.addEventListener("click", (e) => {

        // ── 1. 不良統計列：展開/收合（accordion，同時收合其他列）──
        const statHeader = e.target.closest('.defect-stat-header');
        if (statHeader) {
          const recordsDiv = statHeader.nextElementSibling;
          const arrow = statHeader.querySelector('.defect-stat-arrow');
          const isOpen = recordsDiv.style.display !== 'none';
          // 收合所有其他列（accordion 行為）
          document.querySelectorAll('.defect-stat-header').forEach(h => {
            if (h !== statHeader) {
              h.nextElementSibling.style.display = 'none';
              const a = h.querySelector('.defect-stat-arrow');
              if (a) a.style.transform = '';
            }
          });
          recordsDiv.style.display = isOpen ? 'none' : 'block';
          arrow.style.transform = isOpen ? '' : 'rotate(90deg)';
          return;
        }

        // ── 2. 不良統計子紀錄：點擊跳轉至巡視紀錄 ──
        const statRecord = e.target.closest('.defect-stat-record');
        if (statRecord) { jumpToRecord(statRecord.dataset.folderId, statRecord.dataset.recordId); return; }

        // ── 3. Popup「已記錄於」連結：跳轉至巡視紀錄 ──
        const gotoLink = e.target.closest(".goto-folder-link");
        if (gotoLink) { jumpToRecord(gotoLink.dataset.folderId, gotoLink.dataset.recordId); return; }

        // ── 4. 不良項目快捷晶片：帶入文字輸入框 ──
        if (e.target.classList.contains("defect-chip-btn")) {
          const inputEl = document.getElementById("popup-defect-input");
          if (inputEl) {
            inputEl.value = e.target.dataset.val;
            // 短暫閃爍藍色提供視覺回饋
            const originalBg = e.target.style.background;
            e.target.style.background = "#bae6fd";
            setTimeout(() => { e.target.style.background = originalBg; }, 150);
          }
          return;
        }

        // ── 5. 不良快捷群組 <details> accordion ──
        const defectGroup = e.target.closest(".defect-group");
        if (defectGroup && e.target.tagName === "SUMMARY") {
          setTimeout(() => {
            if (!defectGroup.open) return;
            // 展開此群組時收合其他群組
            document.querySelectorAll(".defect-group").forEach(group => {
              if (group !== defectGroup) group.removeAttribute("open");
            });
          }, 0);
          return;
        }

        // ── 6. 儲存紀錄按鈕 ──
        if (e.target.classList.contains("btn-save-record")) {
          const btn = e.target;
          const lat = parseFloat(btn.dataset.lat), lng = parseFloat(btn.dataset.lng);
          const folderEl  = document.getElementById("popup-folder");
          const nameEl    = document.getElementById("popup-name-input");
          const defectEl  = document.getElementById("popup-defect-input");
          const urgencyEl = document.getElementById("popup-urgency");
          if (!folderEl || !nameEl || !defectEl || !urgencyEl) return;

          const folderId   = folderEl.value;
          const customName = nameEl.value.trim() || btn.dataset.name || "手動新增設備";
          const defect     = defectEl.value.trim();
          const urgency    = urgencyEl.value;

          if (!folderId) { GlobalModal.alert("請先建立並選擇存放資料夾！"); return; }

          // 記憶最後使用的資料夾，下次開 Popup 時預設選取
          state.lastFolderId = folderId;

          // 同資料夾 + 同座標 → 覆蓋（避免重複紀錄）
          state.records = state.records.filter(r => r.folderId !== folderId || r.lat !== lat || r.lng !== lng);
          state.records.push({
            id: "rec_" + Date.now().toString(36) + Math.random().toString(36).substr(2, 6),
            lat, lng, name: customName, code: btn.dataset.code,
            folderId, defect, urgency,
          });

          saveToLocalStorage();
          map.closePopup();
          switchTab("records"); // 儲存後自動切換到巡視紀錄分頁
        }
      });

      // ==========================================
      // updateRecordMarkers()：在地圖上繪製巡視紀錄星號標記
      // 隱藏的資料夾不繪製（依 hiddenRecordFolders 判斷）
      // 主圖標籤隱藏時，星號旁顯示設備名稱標籤（labelsHidden 模式）
      // ==========================================
      function updateRecordMarkers() {
        recordsLayer.clearLayers();
        const visibleRecords = state.records.filter(r => !state.hiddenRecordFolders.has(r.folderId));
        for (const record of visibleRecords) {
          let htmlContent = '<div class="saved-star-marker">⭐</div>';
          let iconAnchor = [10, 10];
          // 主圖標籤隱藏模式：星號旁顯示設備名稱（幫助辨識）
          if (state.labelsHidden) {
            const labelColor = colorForEquipmentName(record.name);
            htmlContent = `<div style="display:flex; flex-direction:column; align-items:center; transform:translate(-50%, calc(-100% + 10px)); width:max-content;">
              <span class="point-label-chip" style="--label-color:${labelColor}; margin-bottom:2px;">${escapeHtml(record.name || record.code)}</span>
              <div class="saved-star-marker">⭐</div>
            </div>`;
            iconAnchor = [0, 0];
          }
          L.marker([record.lat, record.lng], {
            icon: L.divIcon({ className: "", html: htmlContent, iconSize: [0, 0], iconAnchor }),
          }).on("click", () => {
            L.popup({ autoPanPadding: [10, 10] })
              .setLatLng([record.lat, record.lng])
              .setContent(popupHtml(record))
              .openOn(map);
          }).addTo(recordsLayer);
        }
      }

      // ==========================================
      // 工具函式
      // ==========================================

      // 更新底部狀態列文字
      function setStatus(text) { statusBox.textContent = text; }

      // HTML 特殊字元跳脫（防 XSS）
      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;").replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;").replaceAll('"', "&quot;");
      }

      // 數字格式化（加千分位分隔符，使用台灣繁體 locale）
      function formatNumber(value) { return new Intl.NumberFormat("zh-TW").format(value); }

      // Debounce：延遲執行，避免搜尋輸入每個字都觸發重繪
      function debounce(fn, wait = 180) {
        let timer = 0;
        return (...args) => { window.clearTimeout(timer); timer = window.setTimeout(() => fn(...args), wait); };
      }

      // 取得圖號前綴（字母+4碼數字），用於群組模式的標籤與配色
      function codePrefix(code) {
        const match = String(code || "").trim().toUpperCase().replace(/\s+/g, "").match(/^([A-Z]\d{4})/);
        return match ? match[1] : (String(code || "").trim().slice(0, 5) || "未知");
      }

      // 搜尋結果排序權重（精確關鍵字 > 圖號前綴 > 其他）
      function searchResultRank(point, search) {
        if (hasSearchTerm(point, search.terms)) return 0;
        if (search.prefixes.includes(codePrefix(point.code))) return 1;
        return 2;
      }

      // 解析搜尋字串為前綴陣列與關鍵字陣列
      // 圖號前綴（如 Q1295）→ prefixes；其他 → terms
      function parseSearchQuery(query) {
        const tokens = String(query || "").trim().split(/[.\s,，、;；|｜/／]+/).map(t => t.trim()).filter(Boolean);
        const prefixes = [], terms = [];
        for (const t of tokens) {
          const n = t.toUpperCase();
          if (/^[A-Z]\d{4}$/.test(n)) { if (!prefixes.includes(n)) prefixes.push(n); }
          else terms.push(t.toLowerCase());
        }
        return { prefixes, terms };
      }

      // 取得設備的搜尋用文字（名稱 + 圖號 + 前綴，合併小寫）
      function pointSearchText(point) {
        return `${point.name || ""} ${point.code || ""} ${codePrefix(point.code)}`.toLowerCase();
      }

      // 判斷設備是否符合關鍵字搜尋
      function hasSearchTerm(point, terms) {
        if (!terms.length) return false;
        const text = pointSearchText(point);
        return terms.some(term => text.includes(term));
      }

      // 判斷設備是否符合搜尋條件（前綴或關鍵字）
      function matchesSearch(point, search) {
        if (!search.prefixes.length && !search.terms.length) return true;
        return search.prefixes.includes(codePrefix(point.code)) || hasSearchTerm(point, search.terms);
      }

      // 判斷設備點位是否在目前地圖視窗範圍內
      function pointInBounds(point, bounds) {
        return point.lat >= bounds.getSouth() && point.lat <= bounds.getNorth()
            && point.lng >= bounds.getWest() && point.lng <= bounds.getEast();
      }

      // 判斷設備是否通過區域篩選 + 搜尋篩選
      function matchesFilters(point) {
        if (state.area && point.area !== state.area) return false;
        return matchesSearch(point, state.search);
      }

      // 取得目前視窗內且符合所有篩選條件的點位陣列
      function visibleFilteredPoints() {
        const bounds = map.getBounds(), output = [];
        for (const point of state.points) {
          if (pointInBounds(point, bounds) && matchesFilters(point)) output.push(point);
        }
        return output;
      }

      // ==========================================
      // 設備配色系統
      // 使用固定色板（16色），依設備名稱前綴分配顏色，
      // 相鄰群組優先分配色相差異大的顏色，降低撞色機率。
      // ==========================================

      const EQUIPMENT_COLOR_PALETTE = [
        { color: "#b91c1c", hue: 0   }, { color: "#2563eb", hue: 220 },
        { color: "#15803d", hue: 145 }, { color: "#d97706", hue: 35  },
        { color: "#7e22ce", hue: 275 }, { color: "#0f766e", hue: 175 },
        { color: "#be185d", hue: 335 }, { color: "#4d7c0f", hue: 95  },
        { color: "#4338ca", hue: 245 }, { color: "#c2410c", hue: 20  },
        { color: "#047857", hue: 155 }, { color: "#0e7490", hue: 195 },
        { color: "#a21caf", hue: 295 }, { color: "#854d0e", hue: 45  },
        { color: "#1d4ed8", hue: 225 }, { color: "#64748b", hue: 215 },
      ];
      const PREFIX_COLORS = EQUIPMENT_COLOR_PALETTE.map(({ color }) => color);
      const EQUIPMENT_COLOR_HUES = new Map(EQUIPMENT_COLOR_PALETTE.map(({ color, hue }) => [color, hue]));
      const NEARBY_EQUIPMENT_THRESHOLD = 220; // px，畫面上距離小於此值視為「相鄰」
      const UNKNOWN_EQUIPMENT_PREFIX = "未分類", UNKNOWN_EQUIPMENT_COLOR = "#64748b";

      // 字串雜湊（用於從名稱穩定產生顏色索引）
      function hashText(value) {
        let hash = 0;
        for (const char of value) hash = (hash * 31 + char.charCodeAt(0)) >>> 0;
        return hash;
      }

      // 圖號前綴配色：用黃金角度（137.5°）分散色相，確保各前綴顏色差異明顯
      function colorForPrefix(prefix) {
        const h = hashText(prefix);
        const hue = (h * 137.508) % 360;
        const sat = 58 + (h % 22); // 58~80%
        const lit = 30 + (h % 16); // 30~46%（夠深讓白字清晰）
        return `hsl(${hue.toFixed(0)}, ${sat}%, ${lit}%)`;
      }

      // 取得設備名稱的中文前綴（最多 4 字）作為群組 key
      function equipmentNamePrefix(name) {
        const match = String(name || "").trim().match(/^[\u3400-\u9fff]+/);
        return match ? match[0].slice(0, 4) : UNKNOWN_EQUIPMENT_PREFIX;
      }

      // ==========================================
      // Canvas 繪圖引擎（Leaflet 自訂圖層）
      // 大量點位時直接在 Canvas 繪製，效能遠優於 divIcon。
      // 每次地圖移動/縮放都重新繪製（moveend/zoomend/resize）。
      // ==========================================
      const canvasLayer = L.Layer.extend({
        onAdd(currentMap) {
          this.canvas = L.DomUtil.create("canvas", "leaflet-zoom-animated");
          this.canvas.style.pointerEvents = "none"; // 讓點擊事件穿透到地圖
          this.context = this.canvas.getContext("2d");
          currentMap.getPanes().overlayPane.appendChild(this.canvas);
          currentMap.on("moveend zoomend resize", this.redraw, this);
          this.redraw();
        },
        onRemove(currentMap) {
          L.DomUtil.remove(this.canvas);
          currentMap.off("moveend zoomend resize", this.redraw, this);
        },
        redraw() {
          if (!this.canvas || !state.points.length) return;
          const size   = map.getSize();
          const topLeft = map.containerPointToLayerPoint([0, 0]);
          L.DomUtil.setPosition(this.canvas, topLeft);
          this.canvas.width  = size.x;
          this.canvas.height = size.y;
          this.canvas.style.width  = `${size.x}px`;
          this.canvas.style.height = `${size.y}px`;
          const ctx = this.context;
          ctx.clearRect(0, 0, size.x, size.y);

          // 主圖標籤隱藏模式：清空 Canvas，只顯示星號標記
          if (state.labelsHidden) { state.drawnItems = []; updateLabels(); updateStats(); return; }

          state.visiblePoints = visibleFilteredPoints();

          if (map.getZoom() >= SHOW_POINTS_ZOOM && state.visiblePoints.length <= MAX_DIRECT_POINTS) {
            // ── 個別點位模式（縮放夠近且點位數量不超過上限）──
            state.displayMode = "point";
            state.drawnItems = state.visiblePoints.map(p => {
              const pixel = map.latLngToContainerPoint([p.lat, p.lng]);
              return { type: "point", point: p, x: pixel.x, y: pixel.y, count: 1 };
            });
            state.equipmentColorMap = buildEquipmentColorMap(state.drawnItems);
            drawPoints(ctx, state.drawnItems);
          } else {
            // ── 群組標籤模式（縮放較遠或點位太多）──
            state.displayMode = "prefix";
            const groups = new Map();
            for (const point of state.visiblePoints) {
              const prefix = codePrefix(point.code);
              let group = groups.get(prefix);
              if (!group) { group = { type: "prefix", prefix, count: 0, latSum: 0, lngSum: 0 }; groups.set(prefix, group); }
              group.count++; group.latSum += point.lat; group.lngSum += point.lng;
            }
            state.drawnItems = placePrefixLabels(
              [...groups.values()].map(g => {
                const lat = g.latSum / g.count, lng = g.lngSum / g.count;
                const pixel = map.latLngToContainerPoint([lat, lng]);
                return { ...g, lat, lng, x: pixel.x, y: pixel.y };
              }).sort((a, b) => b.count - a.count)
            );
            drawPrefixLabels(ctx, state.drawnItems);
          }
          updateLabels(); updateStats();
        },
      });
      const renderer = new canvasLayer().addTo(map);

      // ── 色相距離計算（環形，0~180°）──
      function circularHueDistance(a, b) {
        const diff = Math.abs(a - b) % 360;
        return Math.min(diff, 360 - diff);
      }

      // 計算某顏色與已使用相鄰顏色的最小色相距離（值越大代表對比越明顯）
      function colorContrastScore(color, usedNeighborColors) {
        if (!usedNeighborColors.length) return 180;
        const hue = EQUIPMENT_COLOR_HUES.get(color) ?? hashText(color) % 360;
        return Math.min(...usedNeighborColors.map(usedColor =>
          circularHueDistance(hue, EQUIPMENT_COLOR_HUES.get(usedColor) ?? hashText(usedColor) % 360)
        ));
      }

      // 計算兩個群組在畫面上的最近距離（用於建立鄰近圖）
      function groupScreenGap(a, b) {
        const dx = Math.max(0, a.minX - b.maxX, b.minX - a.maxX),
              dy = Math.max(0, a.minY - b.maxY, b.minY - a.maxY);
        return Math.sqrt(dx * dx + dy * dy);
      }

      // ==========================================
      // buildEquipmentColorMap()：為設備名稱前綴分配顏色
      // 使用圖著色演算法：相鄰群組（畫面上距離近）不分配相近色相
      // ==========================================
      function buildEquipmentColorMap(items) {
        const groups = new Map();
        for (const item of items) {
          const prefix = equipmentNamePrefix(item.point.name);
          if (prefix === UNKNOWN_EQUIPMENT_PREFIX) continue;
          let group = groups.get(prefix);
          if (!group) {
            group = { prefix, count: 0, xSum: 0, ySum: 0, minX: item.x, maxX: item.x, minY: item.y, maxY: item.y, color: "" };
            groups.set(prefix, group);
          }
          group.count++; group.xSum += item.x; group.ySum += item.y;
          group.minX = Math.min(group.minX, item.x); group.maxX = Math.max(group.maxX, item.x);
          group.minY = Math.min(group.minY, item.y); group.maxY = Math.max(group.maxY, item.y);
        }

        const colorMap = new Map([[UNKNOWN_EQUIPMENT_PREFIX, UNKNOWN_EQUIPMENT_COLOR]]);
        const colorUse = new Map(PREFIX_COLORS.map(c => [c, 0]));
        const sortedGroups = [...groups.values()].map(g => ({ ...g, x: g.xSum / g.count, y: g.ySum / g.count })).sort((a, b) => b.count - a.count);

        // 建立鄰近圖（雙向）
        const adjacency = new Map(sortedGroups.map(group => [group.prefix, new Set()]));
        for (let i = 0; i < sortedGroups.length; i++) {
          for (let j = i + 1; j < sortedGroups.length; j++) {
            if (groupScreenGap(sortedGroups[i], sortedGroups[j]) < NEARBY_EQUIPMENT_THRESHOLD) {
              adjacency.get(sortedGroups[i].prefix).add(sortedGroups[j].prefix);
              adjacency.get(sortedGroups[j].prefix).add(sortedGroups[i].prefix);
            }
          }
        }

        // 依鄰居數量排序（鄰居最多的優先分配，確保對比需求最高的先處理）
        const orderedGroups = [...sortedGroups].sort((a, b) => {
          const degreeDiff = adjacency.get(b.prefix).size - adjacency.get(a.prefix).size;
          if (degreeDiff !== 0) return degreeDiff;
          if (b.count !== a.count) return b.count - a.count;
          return compareNatural(a.prefix, b.prefix);
        });

        for (const group of orderedGroups) {
          const usedNeighborColors = [...adjacency.get(group.prefix)].map(prefix => colorMap.get(prefix)).filter(Boolean);
          // 從雜湊決定的起始位置開始，找對比最大的顏色
          const start = hashText(group.prefix) % PREFIX_COLORS.length;
          const rankedColors = PREFIX_COLORS.map((_, i) => PREFIX_COLORS[(start + i) % PREFIX_COLORS.length])
            .sort((a, b) => {
              const contrastDiff = colorContrastScore(b, usedNeighborColors) - colorContrastScore(a, usedNeighborColors);
              if (contrastDiff !== 0) return contrastDiff;
              return (colorUse.get(a) || 0) - (colorUse.get(b) || 0); // 同對比時優先用較少用的顏色
            });
          group.color = rankedColors[0];
          colorMap.set(group.prefix, group.color);
          colorUse.set(group.color, (colorUse.get(group.color) || 0) + 1);
        }
        return colorMap;
      }

      // 取得設備名稱對應的顏色（查 colorMap，找不到則用黃金角度 HSL）
      function colorForEquipmentName(name) {
        return state.equipmentColorMap.get(equipmentNamePrefix(name)) || colorForPrefix(equipmentNamePrefix(name));
      }

      // 在 Canvas 繪製個別點位（小圓點，白色邊框）
      function drawPoints(ctx, items) {
        for (const item of items) {
          ctx.beginPath();
          ctx.arc(item.x, item.y, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = colorForEquipmentName(item.point.name);
          ctx.fill();
          ctx.lineWidth = 1.5;
          ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
          ctx.stroke();
        }
      }

      // 前綴標籤配色快取（每次 redraw 重新計算）
      let currentPrefixColors = new Map();

      // ==========================================
      // buildPrefixColorsByProximity()：圖號群組配色（鄰近圖著色）
      // 步驟：
      //   1. 建立鄰近圖（畫面距離 < 160px 視為相鄰）
      //   2. 貪婪著色（鄰居最多的先著色）
      //   3. 色號 → HSL 顏色（每輪 60° 色相間距，交錯亮度）
      // ==========================================
      function buildPrefixColorsByProximity(items) {
        const THRESHOLD = 160; // px，約兩個標籤寬度
        const adj = new Map(items.map(it => [it.prefix, new Set()]));
        for (let i = 0; i < items.length; i++) {
          for (let j = i + 1; j < items.length; j++) {
            const dx = items[i].x - items[j].x, dy = items[i].y - items[j].y;
            if (Math.sqrt(dx * dx + dy * dy) < THRESHOLD) {
              adj.get(items[i].prefix).add(items[j].prefix);
              adj.get(items[j].prefix).add(items[i].prefix);
            }
          }
        }
        const sorted = [...items].sort((a, b) => adj.get(b.prefix).size - adj.get(a.prefix).size);
        const colorIdx = new Map();
        for (const { prefix } of sorted) {
          const usedIdx = new Set([...adj.get(prefix)].map(n => colorIdx.get(n)).filter(v => v !== undefined));
          let c = 0; while (usedIdx.has(c)) c++;
          colorIdx.set(prefix, c);
        }
        const result = new Map();
        for (const [prefix, idx] of colorIdx) {
          const hue = (idx * 60 + Math.floor(idx / 6) * 30) % 360; // 環內 60° 間距，每輪偏移 30°
          const sat = 65 + (idx % 3) * 10;  // 65 / 75 / 85%
          const lit = 28 + (idx % 2) * 12;  // 28 / 40%（深淺交錯讓白字清楚）
          result.set(prefix, `hsl(${hue}, ${sat}%, ${lit}%)`);
        }
        return result;
      }

      // 在 Canvas 繪製圖號群組標籤（圓角矩形 + 白色文字 + hitBox）
      function drawPrefixLabels(ctx, items) {
        currentPrefixColors = buildPrefixColorsByProximity(items); // 重新計算配色
        for (const item of items) {
          const color = currentPrefixColors.get(item.prefix) || colorForPrefix(item.prefix);
          const label = `${item.prefix} · ${formatNumber(item.count)}`;
          const width = Math.max(74, Math.min(128, 28 + label.length * 7)), height = 30;
          const x = item.x - width / 2, y = item.y - height / 2;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(x, y, width, height, 8);
          else ctx.rect(x, y, width, height);
          ctx.fillStyle = color; ctx.fill();
          ctx.lineWidth = 2; ctx.strokeStyle = "#fff"; ctx.stroke();
          ctx.fillStyle = "#fff"; ctx.font = "800 12px system-ui, sans-serif";
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText(label, item.x, item.y + 0.5);
          item.hitBox = { x, y, width, height }; // 儲存點擊偵測範圍
        }
      }

      // 防止群組標籤重疊：用格子 key 去重，每格只放一個標籤
      function placePrefixLabels(items) {
        const occupied = new Set(), output = [];
        const gridW = map.getZoom() <= 10 ? 52 : 36;
        const gridH = map.getZoom() <= 10 ? 28 : 20;
        for (const item of items) {
          const key = `${Math.floor(item.x / gridW)}:${Math.floor(item.y / gridH)}`;
          if (occupied.has(key)) continue;
          occupied.add(key); output.push(item);
          if (output.length >= 900) break; // 最多顯示 900 個群組標籤（效能保護）
        }
        return output;
      }

      // 更新 Leaflet divIcon 設備名稱標籤（個別點位模式才顯示，超過 MAX_POINT_LABELS 不顯示）
      function updateLabels() {
        labelsLayer.clearLayers();
        if (state.labelsHidden || state.displayMode !== "point" || state.visiblePoints.length > MAX_POINT_LABELS) return;
        for (const point of state.visiblePoints) {
          const labelColor = colorForEquipmentName(point.name);
          L.marker([point.lat, point.lng], {
            icon: L.divIcon({
              className: "point-label",
              html: `<span class="point-label-chip" style="--label-color:${labelColor}">${escapeHtml(point.name)}</span>`,
              iconSize: null, iconAnchor: [-8, 20],
            }),
          }).on("click", () => {
            L.popup({ autoPanPadding: [10, 10] }).setLatLng([point.lat, point.lng]).setContent(popupHtml(point)).openOn(map);
          }).addTo(labelsLayer);
        }
      }

      // 更新搜尋統計數字（總點位 / 視窗內 / 標籤數）
      function updateStats() {
        totalCount.textContent   = formatNumber(state.points.length);
        visibleCount.textContent = formatNumber(state.labelsHidden ? 0 : state.visiblePoints.length);
        drawCount.textContent    = formatNumber(state.drawnItems.length);
      }

      // 填入區域下拉選單（從 meta.areas 讀取）
      function fillAreas() {
        for (const area of state.meta?.areas || []) {
          const option = document.createElement("option");
          option.value = area.name;
          option.textContent = `${area.name} (${formatNumber(area.count)})`;
          areaSelect.append(option);
        }
      }

      // 主圖標籤顯示/隱藏切換
      document.getElementById("toggleLabelsBtn").addEventListener("click", (e) => {
        state.labelsHidden = !state.labelsHidden;
        e.target.textContent = state.labelsHidden ? "顯示所有主圖標籤" : "隱藏所有主圖標籤";
        e.target.classList.toggle("is-hidden", state.labelsHidden);
        renderer.redraw();
        updateRecordMarkers(); // 標籤模式改變時也要更新星號標記樣式
      });

      // 搜尋篩選事件綁定
      areaSelect.addEventListener("change", applyFilter);
      searchInput.addEventListener("input", debounce(applyFilter, 180)); // 180ms 防抖

      // ==========================================
      // applyFilter()：套用目前的搜尋條件，重繪結果列表與地圖
      // ==========================================
      function applyFilter() {
        state.area   = areaSelect.value;
        state.query  = searchInput.value.trim();
        state.search = parseSearchQuery(state.query);
        renderResults(searchMatches(state.search));
        renderer.redraw();
      }

      // ==========================================
      // searchMatches()：傳回符合搜尋條件的點位陣列（最多 50 筆）
      // 最少 2 個字元才觸發（圖號前綴如 Q1295 不受限），避免輸入單字造成卡頓
      // ==========================================
      function searchMatches(search) {
        if (!search.prefixes.length && !search.terms.some(t => t.length >= 2)) return [];
        const output = [];
        for (const point of state.points) {
          if (state.area && point.area !== state.area) continue;
          if (matchesSearch(point, search)) output.push(point);
        }
        return output.sort((a, b) => {
          const rankCompare = searchResultRank(a, search) - searchResultRank(b, search);
          if (rankCompare !== 0) return rankCompare;
          return comparePointsByName(a, b);
        }).slice(0, 50);
      }

      // ==========================================
      // renderDefectStats()：渲染不良統計分頁內容
      // 計算所有紀錄的不良項目類型與筆數，
      // 依筆數降序排列，顯示：總計列 + 各類型（橫條圖 + 可展開的紀錄清單）
      // ==========================================
      function renderDefectStats() {
        const el = document.getElementById('defectStatsContent');
        if (!el) return;

        // 依不良項目文字分組（空白與「無」略過）
        const grouped = new Map();
        for (const r of state.records) {
          const d = (r.defect || '').trim();
          if (!d || d === '無') continue;
          if (!grouped.has(d)) grouped.set(d, []);
          grouped.get(d).push(r);
        }

        const sorted = [...grouped.entries()].sort((a, b) => b[1].length - a[1].length);
        if (!sorted.length) { el.innerHTML = '<p style="color:#999;font-size:12px;margin:4px 0;">尚無不良紀錄</p>'; return; }

        const max   = sorted[0][1].length; // 最多筆數（橫條圖 100% 基準）
        const total = sorted.reduce((sum, [, recs]) => sum + recs.length, 0);

        // 頂部總計列
        const totalHtml = `
          <div style="display:flex; justify-content:space-between; align-items:center;
                      padding:4px 0 8px; margin-bottom:4px;
                      border-bottom:2px solid var(--line);
                      font-weight:bold; font-size:13px;">
            <span style="color:var(--muted);">總計</span>
            <span style="color:var(--accent-dark);">${total} 筆</span>
          </div>`;

        el.innerHTML = totalHtml + sorted.map(([name, recs]) => {
          const count = recs.length;

          // 展開後的子紀錄列表（點擊跳轉至巡視紀錄分頁並高亮）
          const recsHtml = recs.map(r => `
            <div class="defect-stat-record"
                 data-record-id="${r.id}"
                 data-folder-id="${r.folderId}"
                 style="padding:5px 8px; cursor:pointer; border-radius:4px;
                        font-size:12px; background:#f8fafc;
                        margin-bottom:3px; border:1px solid var(--line);">
              <!-- 設備名稱（點擊跳轉並高亮） -->
              <div style="font-weight:bold; color:var(--accent-dark);">📍 ${escapeHtml(r.name || r.code)}</div>
              <!-- 所屬資料夾路徑（例：2026-05-25 / 子資料夾） -->
              <div style="color:var(--muted); font-size:11px; margin-top:1px;">📂 ${escapeHtml(getFullFolderPath(r.folderId))}</div>
            </div>`).join('');

          return `
            <div style="border-bottom:1px solid #f1f5f9;">
              <!-- 標題列：點擊展開/收合（accordion 邏輯在 document click 委派處理）-->
              <div class="defect-stat-header"
                   style="display:flex; align-items:center; gap:8px;
                          padding:6px 0; cursor:pointer; user-select:none;">
                <!-- 展開箭頭（展開時旋轉 90°）-->
                <span class="defect-stat-arrow" style="font-size:10px; color:var(--muted); transition:transform 0.2s;">▶</span>
                <!-- 不良類型名稱 -->
                <span style="flex:1; font-size:15px; color:var(--text);">${escapeHtml(name)}</span>
                <!-- 橫條圖（寬度 = 此類型筆數 / 最多類型筆數 × 100%）-->
                <div style="width:80px; background:#e2e8f0; border-radius:4px; height:8px; overflow:hidden;">
                  <div style="width:${Math.round(count / max * 100)}%; background:var(--accent); height:100%; border-radius:4px;"></div>
                </div>
                <!-- 右側筆數 -->
                <span style="font-weight:bold; font-size:13px; color:var(--accent-dark); min-width:24px; text-align:right;">${count}</span>
              </div>
              <!-- 子紀錄列表（預設隱藏，點標題列後展開）-->
              <div class="defect-stat-records" style="display:none; padding:0 0 6px 12px;">${recsHtml}</div>
            </div>`;
        }).join('');
      }

      // ==========================================
      // 捲動按鈕事件
      // 巡視紀錄分頁：捲動 .folders-section（可捲動的資料夾區塊）
      // 不良統計分頁：捲動 #defectStatsContent（可捲動的統計內容區）
      // ==========================================
      document.getElementById('scrollTopBtn').addEventListener('click', () => {
        document.querySelector('.folders-section').scrollTo({ top: 0, behavior: 'smooth' });
      });
      document.getElementById('scrollBotBtn').addEventListener('click', () => {
        const el = document.querySelector('.folders-section');
        el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
      });
      document.getElementById('statsScrollTopBtn').addEventListener('click', () => {
        document.getElementById('defectStatsContent').scrollTo({ top: 0, behavior: 'smooth' });
      });
      document.getElementById('statsScrollBotBtn').addEventListener('click', () => {
        const el = document.getElementById('defectStatsContent');
        el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
      });

      // ==========================================
      // renderResults()：渲染搜尋結果列表
      // 使用 <template> 複製元素，避免直接操作 innerHTML（效能較佳）
      // ==========================================
      function renderResults(items) {
        results.innerHTML = "";
        if (!items.length) { results.innerHTML = '<p class="popup-meta">請輸入設備關鍵字。</p>'; return; }
        for (const point of items) {
          const fragment = resultTemplate.content.cloneNode(true);
          fragment.querySelector("strong").textContent = point.name || "未命名";
          fragment.querySelector("span").textContent   = `${point.area || ""} / ${point.code || ""}`;
          fragment.querySelector("button").addEventListener("click", () => {
            map.flyTo([point.lat, point.lng], map.getMaxZoom(), { duration: 0.45 });
            L.popup({ autoPanPadding: [10, 10] }).setLatLng([point.lat, point.lng]).setContent(popupHtml(point)).openOn(map);
            document.getElementById("mapSearchPanel").classList.remove("is-open");
            searchInput.value = ""; applyFilter();
          });
          results.append(fragment);
        }
      }

      // ==========================================
      // 地圖點擊事件
      // 群組模式：點擊 hitBox 放大（zoom +2）
      // 個別點位模式：點擊最近的點位（距離 < 16px）開啟 Popup
      // ==========================================
      map.on("click", (e) => {
        if (state.displayMode === "prefix") {
          // 群組模式：找到被點擊的群組標籤，飛轉過去並放大
          const prefix = state.drawnItems.find(item => {
            const b = item.hitBox;
            return b && e.containerPoint.x >= b.x && e.containerPoint.x <= b.x + b.width
                     && e.containerPoint.y >= b.y && e.containerPoint.y <= b.y + b.height;
          });
          if (prefix) map.flyTo([prefix.lat, prefix.lng], Math.max(map.getZoom() + 2, SHOW_POINTS_ZOOM), { duration: 0.45 });
        } else {
          if (state.labelsHidden) return; // 標籤隱藏時不處理點擊
          // 個別點位模式：找最近的點位（最多掃描 6000 個）
          let best = null, bestDist = 16;
          for (const point of state.visiblePoints.slice(0, 6000)) {
            const dist = map.latLngToContainerPoint([point.lat, point.lng]).distanceTo(e.containerPoint);
            if (dist < bestDist) { best = point; bestDist = dist; }
          }
          if (best) L.popup({ autoPanPadding: [10, 10] }).setLatLng([best.lat, best.lng]).setContent(popupHtml(best)).openOn(map);
        }
      });

      // 右鍵地圖：反推圖號並開啟手動新增設備的 Popup
      map.on("contextmenu", (e) => {
        const { lat, lng } = e.latlng;
        const code = latLngToTpcCode(lat, lng);
        L.popup({ autoPanPadding: [10, 10] })
          .setLatLng([lat, lng])
          .setContent(popupHtml({ lat, lng, name: "手動新增設備", code, area: "自訂" }))
          .openOn(map);
      });

      // ==========================================
      // 定位功能（Geolocation API）
      // 使用 watchPosition 持續追蹤，顯示位置圓點與精度範圍圓。
      // 再次點擊「定位」按鈕 → 停止追蹤並移除標記。
      // ==========================================
      let locationMarker = null, locationCircle = null, locationWatchId = null;

      document.getElementById("locateButton").addEventListener("click", (e) => {
        if (locationWatchId !== null) {
          // 已在定位中 → 停止追蹤
          navigator.geolocation.clearWatch(locationWatchId);
          locationWatchId = null;
          if (locationMarker) { map.removeLayer(locationMarker); locationMarker = null; }
          if (locationCircle) { map.removeLayer(locationCircle); locationCircle = null; }
          e.target.classList.remove("is-active");
          e.target.textContent = "定位"; return;
        }
        if (!navigator.geolocation) { GlobalModal.alert("此瀏覽器不支援定位功能。"); return; }
        e.target.textContent = "定位中...";
        locationWatchId = navigator.geolocation.watchPosition(
          (pos) => {
            const latlng = [pos.coords.latitude, pos.coords.longitude];
            if (!locationMarker) {
              // 第一次定位：建立藍色圓點標記 + 精度範圍圓，並飛轉到位置
              locationMarker = L.circleMarker(latlng, { radius: 7, color: "#fff", weight: 2, fillColor: "#2563eb", fillOpacity: 0.95 }).addTo(map);
              locationCircle = L.circle(latlng, { radius: pos.coords.accuracy || 30, color: "#2563eb", weight: 1, fillColor: "#2563eb", fillOpacity: 0.12 }).addTo(map);
              map.flyTo(latlng, map.getMaxZoom(), { duration: 0.45 });
            } else {
              // 後續更新：只移動標記位置與精度範圍
              locationMarker.setLatLng(latlng);
              locationCircle.setLatLng(latlng).setRadius(pos.coords.accuracy || 30);
            }
            e.target.classList.add("is-active");
            e.target.textContent = "關閉定位";
          },
          (err) => { e.target.textContent = "定位失敗"; console.error("定位錯誤:", err); },
          { enableHighAccuracy: true }
        );
      });

      // ==========================================
      // 資料來源（依序嘗試，第一個成功的為主）
      // 1. 本機上一層 data 目錄（開發環境）
      // 2. 本機同層 data 目錄
      // 3. GitHub Pages 備援（網路版）
      // ==========================================
      const DATA_URLS = [
        { meta: "../data/meta.json",  points: "../data/points.json" },
        { meta: "data/meta.json",     points: "data/points.json" },
        { meta: "https://aertyuloq8.github.io/taipower-equipment-map/data/meta.json",
          points: "https://aertyuloq8.github.io/taipower-equipment-map/data/points.json" },
      ];

      async function tryFetchData() {
        for (const urls of DATA_URLS) {
          try {
            const [metaRes, pointsRes] = await Promise.all([
              fetch(urls.meta,   { cache: "no-cache" }),
              fetch(urls.points, { cache: "no-cache" }),
            ]);
            if (metaRes.ok && pointsRes.ok) return { meta: await metaRes.json(), points: await pointsRes.json() };
          } catch (e) { console.warn("資料來源嘗試失敗，切換備用：", urls.meta, e.message); }
        }
        throw new Error("所有資料來源皆無法連線，請檢查網路或資料目錄是否存在。");
      }

      // ==========================================
      // init()：應用程式啟動流程
      // 1. 從 localStorage 讀取巡視紀錄資料
      // 2. 渲染資料夾清單與統計
      // 3. 更新地圖星號標記
      // 4. 非同步載入設備點位資料
      // 5. 初始化地圖視野、填入區域選單、重繪 Canvas
      // ==========================================
      async function init() {
        setStatus("載入設備資料...");
        loadFromLocalStorage();
        renderFolders();
        renderDefectStats(); // 啟動時預先渲染統計（切到統計分頁時直接顯示）
        updateRecordMarkers();

        try {
          const { meta, points } = await tryFetchData();
          state.meta   = meta;
          state.points = points;

          fillAreas();
          renderResults([]);
          map.setView([23.7, 120.95], 8); // 台灣中心
          if (state.meta?.bounds) map.fitBounds(state.meta.bounds, { padding: [28, 28] });
          renderer.redraw();
          setStatus(""); // 清除載入中訊息
        } catch (e) {
          console.error(e);
          setStatus("⚠️ 設備資料載入失敗：" + e.message);
        }
      }

      init(); // 啟動
    </script>
  </body>
</html>
